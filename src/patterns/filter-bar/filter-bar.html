<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Filter Bar</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="filter-bar-demo">
    <form class="filter-bar visual-example" aria-label="Filter orders">
      <fieldset>
        <legend class="visually-hidden">Order filters</legend>
        <label>
          Search
          <input
            class="input"
            type="search"
            name="query"
            placeholder="Order or customer"
          />
        </label>
        <label>
          Status
          <select name="status">
            <option value="">All statuses</option>
            <option>Open</option>
            <option>Complete</option>
          </select>
        </label>
      </fieldset>
      <menu>
        <button class="button" variant="outline" type="reset">Reset</button>
        <button class="button" type="submit">Apply</button>
      </menu>
    </form>
  </body>
</html>
