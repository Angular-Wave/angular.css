<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/static/css/tailwind-preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    data-example="avatar-badge avatar-basic avatar-demo avatar-group avatar-group-count"
  >
    <div class="avatar-demo visual-example">
      <span class="avatar">
        <img
          class="avatar-grayscale"
          src="../../images/avatars/01.png"
          alt="Profile portrait"
        />
        <span>CN</span>
      </span>
      <span class="avatar">
        <img src="../../images/avatars/02.png" alt="Profile portrait" />
        <span>ER</span>
        <output variant="success"></output>
      </span>
      <span class="avatar" aria-label="Jane Doe">
        <span>JD</span>
      </span>
      <span class="avatar-grayscale avatar-group">
        <span class="avatar">
          <img src="../../images/avatars/01.png" alt="Profile portrait" />
          <span>CN</span>
        </span>
        <span class="avatar">
          <img src="../../images/avatars/03.png" alt="Profile portrait" />
          <span>LR</span>
        </span>
        <span class="avatar">
          <img src="../../images/avatars/04.png" alt="Profile portrait" />
          <span>ER</span>
        </span>
        <output>+3</output>
      </span>
    </div>
  </body>
</html>
