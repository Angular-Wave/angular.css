<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/static/css/tailwind-preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="buttonGroupAction = 'None'"
    data-example="button-group-orientation separator button-group-size button-group-split"
  >
    <main class="button-group-canonical visual-example">
      <div class="button-group-size-stack" aria-label="Button group sizes">
        <div aria-label="State ownership" class="button-group">
          <button
            id="button-group-unmanaged"
            type="button"
            variant="outline"
            size="sm"
            class="button"
          >
            Small
          </button>
          <button
            id="button-group-managed"
            type="button"
            variant="outline"
            size="sm"
            aria-pressed="true"
            tabindex="3"
            class="button"
          >
            Button
          </button>
          <button type="button" variant="outline" size="sm" class="button">
            Group
          </button>
          <button
            type="button"
            variant="outline"
            size="icon-sm"
            aria-label="Add small"
            class="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
        <div class="button-group">
          <button type="button" variant="outline" class="button">
            Default
          </button>
          <button type="button" variant="outline" class="button">Button</button>
          <button type="button" variant="outline" class="button">Group</button>
          <button
            type="button"
            variant="outline"
            size="icon"
            aria-label="Add default"
            class="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
        <div class="button-group">
          <button type="button" variant="outline" size="lg" class="button">
            Large
          </button>
          <button type="button" variant="outline" size="lg" class="button">
            Button
          </button>
          <button type="button" variant="outline" size="lg" class="button">
            Group
          </button>
          <button
            type="button"
            variant="outline"
            size="icon-lg"
            aria-label="Add large"
            class="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
      </div>

      <fieldset
        orientation="vertical"
        aria-label="Media controls"
        class="button-group"
      >
        <button
          type="button"
          variant="outline"
          size="icon"
          aria-label="Increase"
          class="button"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M5 12h14M12 5v14" />
          </svg>
        </button>
        <hr class="separator" />
        <button
          type="button"
          variant="outline"
          size="icon"
          aria-label="Decrease"
          class="button"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
          </svg>
        </button>
      </fieldset>

      <div class="button-group-canonical-row">
        <div class="button-group">
          <button
            type="button"
            variant="secondary"
            size="sm"
            ng-click="buttonGroupAction = 'Copy'"
            class="button"
          >
            Copy
          </button>
          <hr class="separator" aria-orientation="vertical" />
          <button
            type="button"
            variant="secondary"
            size="sm"
            ng-click="buttonGroupAction = 'Paste'"
            class="button"
          >
            Paste
          </button>
        </div>
        <div class="button-group">
          <button
            type="button"
            variant="secondary"
            ng-click="buttonGroupAction = 'Button'"
            class="button"
          >
            Button
          </button>
          <hr class="separator" aria-orientation="vertical" />
          <button
            type="button"
            variant="secondary"
            size="icon"
            aria-label="Add item"
            ng-click="buttonGroupAction = 'Add'"
            class="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
      </div>
      <output class="output">Action: {{ buttonGroupAction }}</output>
    </main>
  </body>
</html>
