<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="frameworks=['AngularTS', 'AngularCSS', 'Tailwind CSS']; state={ query: '', selected: 'AngularTS' }"
  >
    <div ng-combobox>
      <label for="framework">Framework</label>
      <header>
        <input
          id="framework"
          ng-model="state.query"
          placeholder="Search frameworks..."
          class="input"
        />
        <button
          variant="outline"
          size="icon"
          aria-label="Open options"
          value="toggle"
        >
          v
        </button>
      </header>
      <aside aria-label="Framework options">
        <p ng-if="(frameworks | filter:state.query).length === 0">
          No frameworks found.
        </p>
        <div>
          <section>
            <h3>Libraries</h3>
            <ul>
              <li
                ng-repeat="framework in frameworks | filter:state.query"
                ng-click="state.selected=framework; state.query=framework"
              >
                {{ framework }}
              </li>
            </ul>
          </section>
        </div>
      </aside>
      <button
        ng-click="state.query=''; state.selected=''"
        variant="ghost"
        value="clear"
      >
        Clear selection
      </button>
      <p class="muted">
        Selected: {{ state.selected ? state.selected : 'None' }}
      </p>
    </div>
  </body>
</html>
