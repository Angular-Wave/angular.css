<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="frameworks=['AngularTS', 'AngularCSS', 'Tailwind CSS']; state={ query: '', selected: 'AngularTS' }"
  >
    <div ng-combobox>
      <label for="framework" class="label">Framework</label>
      <div class="combobox-control">
        <input
          id="framework"
          ng-model="state.query"
          placeholder="Search frameworks..."
          class="input"
        />
        <button
          variant="outline"
          size="icon"
          aria-label="Open options"
          class="combobox-trigger"
        >
          v
        </button>
      </div>
      <ul aria-label="Framework options" class="combobox-content">
        <section class="combobox-group">
          <h3 class="combobox-group-label">Libraries</h3>
          <li
            ng-repeat="framework in frameworks | filter:state.query"
            data-value="{{ framework }}"
            ng-click="state.selected=framework; state.query=framework"
            class="combobox-item"
          >
            {{ framework }}
          </li>
        </section>
        <p
          ng-if="(frameworks | filter:state.query).length === 0"
          class="combobox-empty"
        >
          No frameworks found.
        </p>
      </ul>
      <button
        ng-click="state.query=''; state.selected=''"
        variant="ghost"
        class="combobox-clear"
      >
        Clear selection
      </button>
      <p class="muted">
        Selected: {{ state.selected ? state.selected : 'None' }}
      </p>
    </div>
  </body>
</html>
