<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/static/css/tailwind-preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="collapsible-example-body"
    data-example="collapsible-demo"
  >
    <details class="collapsible collapsible-order-demo visual-example">
      <summary class="collapsible-order-summary">
        <span class="collapsible-order-header">
          <span class="collapsible-order-title">Order #4189</span>
          <span class="collapsible-icon-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m7 15 5 5 5-5M7 9l5-5 5 5" />
            </svg>
          </span>
          <span class="visually-hidden">Toggle details</span>
        </span>
        <span class="collapsible-order-status">
          <span>Status</span><strong>Shipped</strong>
        </span>
      </summary>
      <div class="collapsible-order-content collapsible-content">
        <div class="collapsible-order-panel">
          <p><strong>Shipping address</strong></p>
          <p>100 Market St, San Francisco</p>
        </div>
        <div class="collapsible-order-panel">
          <p><strong>Items</strong></p>
          <p>2x Studio Headphones</p>
        </div>
      </div>
    </details>
  </body>
</html>
