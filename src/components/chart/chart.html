<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <section ng-chart style="max-width: 32rem">
      <header data-slot="chart-header">
        <div>
          <h3 data-slot="chart-title">Visitors</h3>
          <p data-slot="chart-description">Preview target: 72%</p>
        </div>
      </header>
      <div data-slot="chart-plot">
        <div data-slot="chart-bars">
          <span
            data-slot="chart-bar"
            data-value="46%"
            style="--chart-color: var(--chart-1)"
          ></span>
          <span
            data-slot="chart-bar"
            data-value="58%"
            style="--chart-color: var(--chart-2)"
          ></span>
          <span
            data-slot="chart-bar"
            data-value="72%"
            style="--chart-color: var(--chart-3)"
          ></span>
          <span
            data-slot="chart-bar"
            data-value="88%"
            style="--chart-color: var(--chart-4)"
          ></span>
        </div>
      </div>
      <div data-slot="chart-legend">
        <span data-slot="chart-legend-item"
          ><span
            data-slot="chart-swatch"
            style="--chart-color: var(--chart-1)"
          ></span
          >Desktop</span
        >
        <span data-slot="chart-legend-item"
          ><span
            data-slot="chart-swatch"
            style="--chart-color: var(--chart-2)"
          ></span
          >Mobile</span
        >
      </div>
    </section>
  </body>
</html>
