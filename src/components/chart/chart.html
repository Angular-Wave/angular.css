<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <figure style="max-width: 32rem" class="chart">
      <header>
        <div>
          <h2>Visitors</h2>
          <p>Preview target: 72%</p>
        </div>
      </header>
      <section>
        <div>
          <span data-value="46%" style="--chart-color: var(--chart-1)"></span>
          <span data-value="58%" style="--chart-color: var(--chart-2)"></span>
          <span data-value="72%" style="--chart-color: var(--chart-3)"></span>
          <span data-value="88%" style="--chart-color: var(--chart-4)"></span>
        </div>
      </section>
      <ul>
        <li><span style="--chart-color: var(--chart-1)"></span>Desktop</li>
        <li><span style="--chart-color: var(--chart-2)"></span>Mobile</li>
      </ul>
    </figure>
  </body>
</html>
