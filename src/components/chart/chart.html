<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <figure style="max-width: 32rem" class="chart">
      <header class="chart-header">
        <div>
          <h2 class="chart-title">Visitors</h2>
          <figcaption class="chart-description">Preview target: 72%</figcaption>
        </div>
      </header>
      <div class="chart-plot">
        <div class="chart-bars">
          <span
            data-value="46%"
            style="--chart-color: var(--chart-1)"
            class="chart-bar"
          ></span>
          <span
            data-value="58%"
            style="--chart-color: var(--chart-2)"
            class="chart-bar"
          ></span>
          <span
            data-value="72%"
            style="--chart-color: var(--chart-3)"
            class="chart-bar"
          ></span>
          <span
            data-value="88%"
            style="--chart-color: var(--chart-4)"
            class="chart-bar"
          ></span>
        </div>
      </div>
      <ul class="chart-legend">
        <li class="chart-legend-item">
          <span
            style="--chart-color: var(--chart-1)"
            class="chart-swatch"
          ></span
          >Desktop
        </li>
        <li class="chart-legend-item">
          <span
            style="--chart-color: var(--chart-2)"
            class="chart-swatch"
          ></span
          >Mobile
        </li>
      </ul>
    </figure>
  </body>
</html>
