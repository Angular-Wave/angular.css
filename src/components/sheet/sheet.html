<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak style="padding: 0">
    <button
      variant="outline"
      aria-controls="notifications-sheet"
      style="position: absolute; left: 24px; top: 24px; z-index: 60"
      class="button"
    >
      Open sheet
    </button>
    <section
      id="notifications-sheet"
      ng-sheet
      data-open="true"
      style="height: 370px"
    >
      <div class="sheet-overlay"></div>
      <dialog
        data-side="right"
        aria-label="Notifications"
        class="sheet-content"
      >
        <header class="sheet-header">
          <h2 class="sheet-title">Notifications</h2>
          <p class="sheet-description">Recent updates from your workspace.</p>
        </header>
        <div class="stack-sm">
          <div class="item">
            <section class="item-content">
              <h3 class="item-title">Build completed</h3>
              <p class="item-description">
                Production build finished 2 minutes ago.
              </p>
            </section>
          </div>
          <div class="item">
            <section class="item-content">
              <h3 class="item-title">Invite accepted</h3>
              <p class="item-description">Jane joined the design team.</p>
            </section>
          </div>
        </div>
        <footer class="sheet-footer">
          <button variant="outline" data-sheet-close class="button">
            Close
          </button>
        </footer>
      </dialog>
    </section>
  </body>
</html>
