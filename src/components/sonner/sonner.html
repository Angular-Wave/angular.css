<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="canonical = { visible: false, status: 'Ready' }"
    data-example="sonner-demo"
    class="sonner-example-body"
  >
    <main class="sonner-demo visual-example">
      <button
        type="button"
        variant="outline"
        ng-click="canonical.visible = true; canonical.status = 'Toast shown'"
        class="button"
      >
        Show Toast
      </button>
      <output class="output">{{ canonical.status }}</output>
    </main>

    <div ng-toaster position="bottom-right" aria-label="Notifications">
      <li ng-if="canonical.visible" animate class="toast">
        <section class="toast-content">
          <h3 class="toast-title">Event has been created</h3>
          <p class="toast-description">Sunday, December 03, 2023 at 9:00 AM</p>
        </section>
        <button
          variant="outline"
          size="sm"
          ng-click="canonical.visible = false; canonical.status = 'Undo selected'"
          class="button toast-action"
        >
          Undo
        </button>
      </li>
    </div>
  </body>
</html>
