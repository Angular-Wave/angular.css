<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak style="padding: 0">
    <button
      data-slot="button"
      variant="outline"
      aria-controls="billing-drawer"
      style="position: absolute; left: 24px; top: 24px; z-index: 60"
    >
      Open drawer
    </button>
    <section
      id="billing-drawer"
      ng-drawer
      data-open="false"
      style="height: 370px"
    >
      <div data-slot="drawer-overlay"></div>
      <section data-slot="drawer-content" aria-label="Billing period">
        <div data-slot="drawer-handle"></div>
        <header data-slot="drawer-header">
          <h2 data-slot="drawer-title">Billing period</h2>
          <p data-slot="drawer-description">
            Choose a cycle before creating the invoice.
          </p>
        </header>
      </section>
    </section>
  </body>
</html>
