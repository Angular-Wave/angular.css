<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak style="padding: 0">
    <button
      variant="outline"
      aria-controls="billing-drawer"
      style="position: absolute; left: 24px; top: 24px; z-index: 60"
      class="button"
    >
      Open drawer
    </button>
    <section
      id="billing-drawer"
      ng-drawer
      data-open="false"
      style="height: 370px"
    >
      <div class="drawer-overlay"></div>
      <dialog aria-label="Billing period" class="drawer-content">
        <div class="drawer-handle"></div>
        <header class="drawer-header">
          <h2 class="drawer-title">Billing period</h2>
          <p class="drawer-description">
            Choose a cycle before creating the invoice.
          </p>
        </header>
      </dialog>
    </section>
  </body>
</html>
