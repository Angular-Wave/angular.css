<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/static/css/tailwind-preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="menu={fullUrls:true,profile:'benoit'}"
    class="menubar-example-body"
  >
    <main class="menubar-demo visual-example">
      <nav ng-menubar aria-label="Application menu">
        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">File</button>
          <menu class="menubar-content">
            <div class="menubar-group">
              <button type="button" class="menubar-item">
                New Tab <span class="menubar-shortcut">⌘T</span>
              </button>
              <button type="button" class="menubar-item">
                New Window <span class="menubar-shortcut">⌘N</span>
              </button>
              <button type="button" disabled class="menubar-item">
                New Incognito Window
              </button>
            </div>
            <hr class="menubar-separator" />
            <div class="menubar-sub">
              <button type="button" class="menubar-sub-trigger">Share</button>
              <div class="menubar-sub-content">
                <button type="button" class="menubar-item">Email link</button>
                <button type="button" class="menubar-item">Messages</button>
              </div>
            </div>
            <hr class="menubar-separator" />
            <button type="button" class="menubar-item">
              Print... <span class="menubar-shortcut">⌘P</span>
            </button>
          </menu>
        </section>

        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">Edit</button>
          <menu class="menubar-content">
            <button type="button" class="menubar-item">Undo</button>
            <button type="button" class="menubar-item">Redo</button>
            <hr class="menubar-separator" />
            <button type="button" class="menubar-item">Cut</button>
            <button type="button" class="menubar-item">Copy</button>
            <button type="button" class="menubar-item">Paste</button>
          </menu>
        </section>

        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">View</button>
          <menu class="menubar-content">
            <button
              type="button"
              aria-checked="{{ menu.fullUrls }}"
              ng-click="menu.fullUrls=!menu.fullUrls"
              class="menubar-checkbox-item"
            >
              Full URLs
            </button>
            <hr class="menubar-separator" />
            <button type="button" inset class="menubar-item">Reload</button>
          </menu>
        </section>

        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">Profiles</button>
          <menu class="menubar-content">
            <fieldset aria-label="Profile" class="menubar-radio-group">
              <button
                type="button"
                aria-checked="{{ menu.profile === 'andy' }}"
                ng-click="menu.profile='andy'"
                class="menubar-radio-item"
              >
                Andy
              </button>
              <button
                type="button"
                aria-checked="{{ menu.profile === 'benoit' }}"
                ng-click="menu.profile='benoit'"
                class="menubar-radio-item"
              >
                Benoit
              </button>
            </fieldset>
          </menu>
        </section>
      </nav>
    </main>
  </body>
</html>
