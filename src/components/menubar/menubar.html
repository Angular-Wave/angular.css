<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/static/css/tailwind-preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="menu={fullUrls:true,profile:'benoit'}"
    class="menubar-example-body"
  >
    <main class="menubar-demo visual-example">
      <nav ng-menubar aria-label="Application menu">
        <section ng-menubar-menu>
          <button type="button" ng-menubar-trigger>File</button>
          <div ng-menubar-content>
            <div ng-menubar-group>
              <button type="button" ng-menubar-item>
                New Tab <span ng-menubar-shortcut>⌘T</span>
              </button>
              <button type="button" ng-menubar-item>
                New Window <span ng-menubar-shortcut>⌘N</span>
              </button>
              <button type="button" ng-menubar-item disabled>
                New Incognito Window
              </button>
            </div>
            <div ng-menubar-separator role="separator"></div>
            <div ng-menubar-sub>
              <button type="button" ng-menubar-sub-trigger>Share</button>
              <div ng-menubar-sub-content>
                <button type="button" ng-menubar-item>Email link</button>
                <button type="button" ng-menubar-item>Messages</button>
              </div>
            </div>
            <div ng-menubar-separator role="separator"></div>
            <button type="button" ng-menubar-item>
              Print... <span ng-menubar-shortcut>⌘P</span>
            </button>
          </div>
        </section>

        <section ng-menubar-menu>
          <button type="button" ng-menubar-trigger>Edit</button>
          <div ng-menubar-content>
            <button type="button" ng-menubar-item>Undo</button>
            <button type="button" ng-menubar-item>Redo</button>
            <div ng-menubar-separator role="separator"></div>
            <button type="button" ng-menubar-item>Cut</button>
            <button type="button" ng-menubar-item>Copy</button>
            <button type="button" ng-menubar-item>Paste</button>
          </div>
        </section>

        <section ng-menubar-menu>
          <button type="button" ng-menubar-trigger>View</button>
          <div ng-menubar-content>
            <button
              type="button"
              ng-menubar-checkbox-item
              role="menuitemcheckbox"
              aria-checked="{{ menu.fullUrls }}"
              ng-click="menu.fullUrls=!menu.fullUrls"
            >
              Full URLs
            </button>
            <div ng-menubar-separator role="separator"></div>
            <button type="button" ng-menubar-item inset>Reload</button>
          </div>
        </section>

        <section ng-menubar-menu>
          <button type="button" ng-menubar-trigger>Profiles</button>
          <div ng-menubar-content>
            <div ng-menubar-radio-group role="group" aria-label="Profile">
              <button
                type="button"
                ng-menubar-radio-item
                role="menuitemradio"
                aria-checked="{{ menu.profile === 'andy' }}"
                ng-click="menu.profile='andy'"
              >
                Andy
              </button>
              <button
                type="button"
                ng-menubar-radio-item
                role="menuitemradio"
                aria-checked="{{ menu.profile === 'benoit' }}"
                ng-click="menu.profile='benoit'"
              >
                Benoit
              </button>
            </div>
          </div>
        </section>
      </nav>
    </main>
  </body>
</html>
