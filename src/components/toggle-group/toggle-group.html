<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="alignment='center'">
    <div class="stack-sm">
      <fieldset ng-toggle-group class="row toggle-group" variant="outline">
        <button
          aria-pressed="false"
          ng-click="alignment='left'"
          type="button"
          class="toggle-group-item"
        >
          Left
        </button>
        <button
          aria-pressed="true"
          ng-click="alignment='center'"
          type="button"
          class="toggle-group-item"
        >
          Center
        </button>
        <button
          aria-pressed="false"
          ng-click="alignment='right'"
          type="button"
          class="toggle-group-item"
        >
          Right
        </button>
      </fieldset>

      <div class="output">Alignment: <span ng-bind="alignment"></span></div>
    </div>
  </body>
</html>
