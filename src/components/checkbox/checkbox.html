<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="stack">
      <div orientation="horizontal" class="field">
        <input id="terms" type="checkbox" class="checkbox" />
        <label for="terms" class="field-label label">Accept terms</label>
      </div>

      <div orientation="horizontal" data-invalid class="field">
        <input
          id="terms-invalid"
          type="checkbox"
          aria-invalid="true"
          class="checkbox"
        />
        <label for="terms-invalid" class="field-label label">Required</label>
      </div>
    </div>
  </body>
</html>
