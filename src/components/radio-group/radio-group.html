<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <fieldset class="radio-group">
      <legend>Density</legend>

      <div orientation="horizontal" class="field">
        <input
          id="density-default"
          name="density"
          type="radio"
          value="default"
        />
        <label for="density-default">Default</label>
      </div>
      <div orientation="horizontal" class="field">
        <input
          id="density-comfortable"
          name="density"
          type="radio"
          value="comfortable"
          checked
        />
        <label for="density-comfortable">Comfortable</label>
      </div>
      <div orientation="horizontal" class="field">
        <input
          id="density-compact"
          name="density"
          type="radio"
          value="compact"
        />
        <label for="density-compact">Compact</label>
      </div>
    </fieldset>
  </body>
</html>
