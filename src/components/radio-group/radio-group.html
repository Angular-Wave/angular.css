<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <fieldset class="p-10">
      <legend class="mb-3">Density</legend>
      <fieldset class="radio-group">
        <div orientation="horizontal" class="field">
          <input
            id="density-default"
            name="density"
            type="radio"
            value="default"
            class="radio-group-item"
          />
          <label for="density-default" class="label">Default</label>
        </div>
        <div orientation="horizontal" class="field">
          <input
            id="density-comfortable"
            name="density"
            type="radio"
            value="comfortable"
            checked
            class="radio-group-item"
          />
          <label for="density-comfortable" class="label">Comfortable</label>
        </div>
        <div orientation="horizontal" class="field">
          <input
            id="density-compact"
            name="density"
            type="radio"
            value="compact"
            class="radio-group-item"
          />
          <label for="density-compact" class="label">Compact</label>
        </div>
      </fieldset>
    </fieldset>
  </body>
</html>
