<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <ul style="max-width: 32rem" class="item-group">
      <li variant="outline" class="item">
        <figure variant="icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
        </figure>
        <section>
          <h3>Profile verified</h3>
          <p>Your public display name and email have been confirmed.</p>
        </section>
        <menu>
          <button variant="outline" size="sm" class="button">Review</button>
        </menu>
      </li>
      <li variant="muted" size="sm" class="item">
        <section>
          <h3>Scheduled reports</h3>
          <p>Weekly snapshots are ready for your team.</p>
        </section>
        <menu>
          <span variant="secondary" class="badge">New</span>
        </menu>
      </li>
    </ul>
  </body>
</html>
