<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="row">
      <span ng-avatar>
        <span class="avatar-fallback">JD</span>
        <span class="avatar-badge"></span>
      </span>
      <span ng-avatar data-size="sm">
        <span class="avatar-fallback">AT</span>
      </span>
      <span ng-avatar data-size="lg">
        <span class="avatar-fallback">UI</span>
      </span>
      <span class="avatar-group">
        <span ng-avatar>
          <span class="avatar-fallback">AB</span>
        </span>
        <span ng-avatar>
          <span class="avatar-fallback">CD</span>
        </span>
        <span ng-avatar>
          <span class="avatar-fallback">EF</span>
        </span>
        <span class="avatar-group-count">+3</span>
      </span>
    </div>
  </body>
</html>
