<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <section ng-carousel aria-label="Featured reports" style="max-width: 28rem">
      <div>
        <ul>
          <li>
            <section class="card">
              <header>
                <h2>Revenue</h2>
                <p>Quarterly performance summary.</p>
              </header>
              <section>
                <div
                  class="media-surface"
                  style="height: 9rem; border-radius: var(--radius)"
                >
                  +18%
                </div>
              </section>
            </section>
          </li>
          <li>
            <section class="card">
              <header>
                <h2>Retention</h2>
                <p>Monthly cohort movement.</p>
              </header>
              <section>
                <div
                  class="media-surface"
                  style="height: 9rem; border-radius: var(--radius)"
                >
                  94%
                </div>
              </section>
            </section>
          </li>
        </ul>
      </div>
      <button
        size="icon"
        variant="outline"
        aria-label="Previous"
        class="button"
      >
        &lt;
      </button>
      <button size="icon" variant="outline" aria-label="Next" class="button">
        &gt;
      </button>
      <nav aria-hidden="true">
        <button aria-label="Show revenue"></button>
        <button aria-label="Show retention"></button>
      </nav>
    </section>
  </body>
</html>
