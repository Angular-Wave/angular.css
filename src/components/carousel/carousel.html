<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <section ng-carousel aria-label="Featured reports" style="max-width: 28rem">
      <div class="carousel-content">
        <ul class="carousel-track">
          <li class="carousel-item">
            <section class="card">
              <header class="card-header">
                <h2 class="card-title">Revenue</h2>
                <p class="card-description">Quarterly performance summary.</p>
              </header>
              <section class="card-content">
                <div
                  class="media-surface"
                  style="height: 9rem; border-radius: var(--radius)"
                >
                  +18%
                </div>
              </section>
            </section>
          </li>
          <li class="carousel-item">
            <section class="card">
              <header class="card-header">
                <h2 class="card-title">Retention</h2>
                <p class="card-description">Monthly cohort movement.</p>
              </header>
              <section class="card-content">
                <div
                  class="media-surface"
                  style="height: 9rem; border-radius: var(--radius)"
                >
                  94%
                </div>
              </section>
            </section>
          </li>
        </ul>
      </div>
      <button
        size="icon"
        variant="outline"
        aria-label="Previous"
        class="button carousel-previous"
      >
        &lt;
      </button>
      <button
        size="icon"
        variant="outline"
        aria-label="Next"
        class="button carousel-next"
      >
        &gt;
      </button>
      <nav aria-hidden="true" class="carousel-dots">
        <button
          data-active="true"
          aria-label="Show revenue"
          class="carousel-dot"
        ></button>
        <button aria-label="Show retention" class="carousel-dot"></button>
      </nav>
    </section>
  </body>
</html>
