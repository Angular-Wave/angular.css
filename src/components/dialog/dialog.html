<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div>
      <button aria-controls="profile-dialog">Open dialog</button>
      <section id="profile-dialog" ng-dialog>
        <div class="dialog-overlay"></div>
        <dialog class="dialog-content">
          <header class="dialog-header">
            <h2 class="dialog-title">Profile</h2>
            <p class="dialog-description">Preview your profile.</p>
          </header>
        </dialog>
      </section>
    </div>
  </body>
</html>
