<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/static/css/tailwind-preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="accordion-demo">
    <div ng-accordion class="accordion-demo visual-example">
      <div data-state="open" class="accordion-item">
        <h3>
          <button type="button" class="accordion-trigger">
            What are your shipping options?
          </button>
        </h3>
        <div class="accordion-content">
          We offer standard (5-7 days), express (2-3 days), and overnight
          shipping. Free shipping on international orders.
        </div>
      </div>
      <div class="accordion-item">
        <h3>
          <button type="button" class="accordion-trigger">
            What is your return policy?
          </button>
        </h3>
        <div class="accordion-content">
          Returns are accepted within 30 days. Items must be unused and in their
          original packaging.
        </div>
      </div>
      <div class="accordion-item">
        <h3>
          <button type="button" class="accordion-trigger">
            How can I contact customer support?
          </button>
        </h3>
        <div class="accordion-content">
          Reach us by email, live chat, or phone during business hours.
        </div>
      </div>
    </div>
  </body>
</html>
