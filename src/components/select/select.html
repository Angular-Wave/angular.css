<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="stack-sm" ng-init="status='Todo'">
      <div class="output">Current: <span ng-bind="status"></span></div>
      <div ng-select data-open="false">
        <button data-slot="select-trigger" type="button">Todo</button>
        <div data-slot="select-content">
          <div
            data-slot="select-item"
            data-value="Todo"
            role="option"
            aria-selected="true"
          >
            Todo
          </div>
          <div data-slot="select-item" data-value="In progress" role="option">
            In progress
          </div>
          <div data-slot="select-item" data-value="Done" role="option">
            Done
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
