<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="stack">
      <section data-slot="direction">
        <p data-logical-align="start">Default LTR direction.</p>
      </section>
      <section ng-direction dir="rtl">
        <p data-logical-align="start">RTL direction with logical alignment.</p>
      </section>
    </div>
  </body>
</html>
