<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="stack">
      <button ng-button>Button</button>
      <div class="row">
        <button ng-button variant="outline">Button</button>
        <button ng-button variant="outline" size="icon">+</button>
      </div>
      <div class="row">
        <button ng-button variant="secondary">Secondary</button>
      </div>
      <div class="row">
        <button ng-button size="sm">Small</button>
      </div>
      <div class="row">
        <button ng-button size="lg">Large</button>
      </div>
      <div class="row">
        <button ng-button variant="ghost">Ghost</button>
      </div>
      <div class="row">
        <button ng-button variant="outline" disabled>Disabled</button>
      </div>
    </div>
  </body>
</html>
