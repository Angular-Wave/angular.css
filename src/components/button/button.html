<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="stack">
      <button class="button">Button</button>
      <div class="row">
        <button variant="outline" class="button">Button</button>
        <button variant="outline" size="icon" class="button">+</button>
      </div>
      <div class="row">
        <button variant="secondary" class="button">Secondary</button>
      </div>
      <div class="row">
        <button size="sm" class="button">Small</button>
      </div>
      <div class="row">
        <button size="lg" class="button">Large</button>
      </div>
      <div class="row">
        <button variant="ghost" class="button">Ghost</button>
      </div>
      <div class="row">
        <button variant="outline" disabled class="button">Disabled</button>
      </div>
    </div>
  </body>
</html>
