<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <section ng-tabs style="max-width: 28rem">
      <menu aria-label="Project sections">
        <button aria-selected="true">Overview</button>
        <button>Analytics</button>
        <button>Reports</button>
      </menu>
      <article class="card">
        <header>
          <h2>Overview</h2>
          <p>View key metrics and recent activity.</p>
        </header>
        <section class="muted">
          You have 12 active projects and 3 pending tasks.
        </section>
      </article>
      <article class="card">
        <header>
          <h2>Analytics</h2>
          <p>Review conversion and usage trends.</p>
        </header>
        <section class="muted">
          Conversion is up 8% over the previous period.
        </section>
      </article>
      <article class="card">
        <header>
          <h2>Reports</h2>
          <p>Export weekly workspace summaries.</p>
        </header>
        <section class="muted">Three reports are ready to download.</section>
      </article>
    </section>
  </body>
</html>
