<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <section ng-tabs style="max-width: 28rem">
      <menu aria-label="Project sections" class="tabs-list">
        <button aria-selected="true" class="tabs-trigger">Overview</button>
        <button class="tabs-trigger">Analytics</button>
        <button class="tabs-trigger">Reports</button>
      </menu>
      <section class="tabs-content">
        <section class="card">
          <header class="card-header">
            <h2 class="card-title">Overview</h2>
            <p class="card-description">
              View key metrics and recent activity.
            </p>
          </header>
          <section class="muted card-content">
            You have 12 active projects and 3 pending tasks.
          </section>
        </section>
      </section>
      <section class="tabs-content">
        <section class="card">
          <header class="card-header">
            <h2 class="card-title">Analytics</h2>
            <p class="card-description">Review conversion and usage trends.</p>
          </header>
          <section class="muted card-content">
            Conversion is up 8% over the previous period.
          </section>
        </section>
      </section>
      <section class="tabs-content">
        <section class="card">
          <header class="card-header">
            <h2 class="card-title">Reports</h2>
            <p class="card-description">Export weekly workspace summaries.</p>
          </header>
          <section class="muted card-content">
            Three reports are ready to download.
          </section>
        </section>
      </section>
    </section>
  </body>
</html>
