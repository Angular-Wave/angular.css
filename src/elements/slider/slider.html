<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularCSS</title>
    <link rel="stylesheet" href="/docs/assets/angular.css" />
    <script src="https://cdn.jsdelivr.net/npm/@angular-wave/angular.ts/dist/angular-ts.umd.min.js"></script>
    <script type="module" src="../../index.ts"></script>
  </head>

  <body ng-app="ui" ng-cloak>
    <div class="grid w-full max-w-xl items-start gap-4 p-10">
      <label for="volume" class="label">Volume</label>
      <input ng-slider id="volume" type="range" min="0" max="100" value="75" />
      <input ng-slider type="range" min="0" max="100" value="40" disabled />
    </div>
  </body>
</html>
