<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularCSS</title>
    <link rel="stylesheet" href="/docs/assets/angular.css" />
    <script src="https://cdn.jsdelivr.net/npm/@angular-wave/angular.ts/dist/angular-ts.umd.min.js"></script>
    <script type="module" src="../../index.ts"></script>
  </head>

  <body ng-app="ui" ng-cloak>
    <fieldset class="p-10 radio-group">
      <legend class="mb-3">Density</legend>

      <div orientation="horizontal" class="field">
        <input
          id="density-default"
          name="density"
          type="radio"
          value="default"
        />
        <label for="density-default">Default</label>
      </div>
      <div orientation="horizontal" class="field">
        <input
          id="density-comfortable"
          name="density"
          type="radio"
          value="comfortable"
          checked
        />
        <label for="density-comfortable">Comfortable</label>
      </div>
      <div orientation="horizontal" class="field">
        <input
          id="density-compact"
          name="density"
          type="radio"
          value="compact"
        />
        <label for="density-compact">Compact</label>
      </div>
    </fieldset>
  </body>
</html>
