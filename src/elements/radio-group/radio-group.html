<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularCSS</title>
    <link rel="stylesheet" href="/docs/assets/angular.css" />
    <script src="https://cdn.jsdelivr.net/npm/@angular-wave/angular.ts/dist/angular-ts.umd.min.js"></script>
    <script type="module" src="../../index.ts"></script>
  </head>

  <body ng-app="ui" ng-cloak>
    <fieldset class="p-10">
      <legend class="mb-3">Density</legend>
      <div ng-radio-group role="radiogroup">
        <div data-slot="field" orientation="horizontal">
          <input
            ng-radio-group-item
            id="density-default"
            name="density"
            type="radio"
            value="default"
          />
          <label ng-label for="density-default">Default</label>
        </div>
        <div data-slot="field" orientation="horizontal">
          <input
            ng-radio-group-item
            id="density-comfortable"
            name="density"
            type="radio"
            value="comfortable"
            checked
          />
          <label ng-label for="density-comfortable">Comfortable</label>
        </div>
        <div data-slot="field" orientation="horizontal">
          <input
            ng-radio-group-item
            id="density-compact"
            name="density"
            type="radio"
            value="compact"
          />
          <label ng-label for="density-compact">Compact</label>
        </div>
      </div>
    </fieldset>
  </body>
</html>
