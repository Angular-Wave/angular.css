<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularCSS</title>
    <link rel="stylesheet" href="/docs/assets/angular.css" />
    <script src="https://cdn.jsdelivr.net/npm/@angular-wave/angular.ts/dist/angular-ts.umd.min.js"></script>
    <script type="module" src="../../index.ts"></script>
  </head>

  <body ng-app="ui" ng-cloak>
    <form class="grid w-full max-w-xl items-start gap-6 p-10">
      <fieldset class="field-set">
        <legend>Profile</legend>

        <div class="field-group">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" placeholder="Jane Doe" class="input" />
            <p>Use your public display name.</p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              placeholder="Email"
              aria-invalid="true"
              class="input"
            />
            <p class="field-error">Enter a valid email.</p>
          </div>
        </div>
      </fieldset>
    </form>
  </body>
</html>
