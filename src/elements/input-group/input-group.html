<main class="container">
  <section class="vstack">
    <h2>Input group</h2>

    <div class="field">
      <label for="input-group-search">Search</label>
      <fieldset class="input-group">
        <input
          id="input-group-search"
          placeholder="Search documentation..."
          class="input"
        />
        <div align="inline-start">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </div>
        <div align="inline-end">
          <kbd>Ctrl K</kbd>
        </div>
      </fieldset>
    </div>

    <div class="field">
      <label for="input-group-url">URL</label>
      <fieldset class="input-group">
        <div align="inline-start">
          <span>https://</span>
        </div>
        <input id="input-group-url" class="input" />
        <div align="inline-end">
          <button variant="ghost" class="button">Copy</button>
        </div>
      </fieldset>
    </div>
  </section>
</main>
