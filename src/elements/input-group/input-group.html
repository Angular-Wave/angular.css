<main class="container">
  <section class="vstack">
    <h2>Input group</h2>

    <div class="field">
      <label for="input-group-search" class="field-label label">Search</label>
      <fieldset class="input-group">
        <input
          id="input-group-search"
          placeholder="Search documentation..."
          class="input-group-control input"
        />
        <div data-align="inline-start" class="input-group-addon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </div>
        <div data-align="inline-end" class="input-group-addon">
          <kbd>Ctrl K</kbd>
        </div>
      </fieldset>
    </div>

    <div class="field">
      <label for="input-group-url" class="field-label label">URL</label>
      <fieldset class="input-group">
        <div data-align="inline-start" class="input-group-addon">
          <span class="input-group-text">https://</span>
        </div>
        <input id="input-group-url" class="input-group-control input" />
        <div data-align="inline-end" class="input-group-addon">
          <button variant="ghost" class="input-group-button button">
            Copy
          </button>
        </div>
      </fieldset>
    </div>
  </section>
</main>
