<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularCSS</title>
    <link rel="stylesheet" href="/docs/assets/angular.css" />
    <script src="https://cdn.jsdelivr.net/npm/@angular-wave/angular.ts/dist/angular-ts.umd.min.js"></script>
    <script type="module" src="../../index.ts"></script>
  </head>

  <body ng-app="ui" ng-cloak>
    <div class="grid w-full max-w-xl items-start gap-4 p-10">
      <div orientation="horizontal" class="field">
        <input id="airplane-mode" type="checkbox" class="switch" />
        <label for="airplane-mode" class="label">Airplane Mode</label>
      </div>

      <div orientation="horizontal" class="field">
        <input
          id="small-switch"
          type="checkbox"
          size="sm"
          checked
          class="switch"
        />
        <label for="small-switch" class="label">Small switch</label>
      </div>
    </div>
  </body>
</html>
