<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularCSS</title>
    <link rel="stylesheet" href="/docs/assets/angular.css" />
    <script src="https://cdn.jsdelivr.net/npm/@angular-wave/angular.ts/dist/angular-ts.umd.min.js"></script>
    <script type="module" src="../../index.ts"></script>
  </head>

  <body ng-app="ui" ng-cloak>
    <div class="grid w-full max-w-xl items-start gap-4 p-10">
      <div orientation="horizontal" class="field">
        <input id="terms" type="checkbox" class="checkbox" />
        <label for="terms" class="field-label label">Accept terms</label>
      </div>

      <div orientation="horizontal" data-invalid class="field">
        <input
          id="terms-invalid"
          type="checkbox"
          aria-invalid="true"
          class="checkbox"
        />
        <label for="terms-invalid" class="field-label label">Required</label>
      </div>
    </div>
  </body>
</html>
