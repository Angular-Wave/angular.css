<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="alert-dialog-basic alert-dialog-demo"
  >
    <section
      id="confirmation-dialog"
      ng-alert-dialog
      class="alert-dialog-demo visual-example alert-dialog"
    >
      <button

        type="button"
        variant="outline"

       class="alert-dialog-trigger button">
        Show Dialog
      </button>
      <div class="alert-dialog-overlay"></div>
      <dialog data-size="default" class="alert-dialog-content">
        <header class="alert-dialog-header">
          <h2 class="alert-dialog-title">Are you absolutely sure?</h2>
          <p class="alert-dialog-description">
            This action cannot be undone. This will permanently delete your
            account from our servers.
          </p>
        </header>
        <footer class="alert-dialog-footer">
          <button

            type="button"
            variant="outline"

           class="alert-dialog-cancel button">
            Cancel
          </button>
          <button type="button" class="alert-dialog-action button">
            Continue
          </button>
        </footer>
      </dialog>
    </section>
  </body>
</html>
