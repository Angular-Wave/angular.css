<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="alert-dialog-basic alert-dialog-demo"
  >
    <section
      id="confirmation-dialog"
      ng-alert-dialog
      class="alert-dialog-demo visual-example"
    >
      <button
        ng-button
        type="button"
        variant="outline"
        data-slot="alert-dialog-trigger"
      >
        Show Dialog
      </button>
      <div data-slot="alert-dialog-overlay"></div>
      <section data-slot="alert-dialog-content" data-size="default">
        <header data-slot="alert-dialog-header">
          <h2 data-slot="alert-dialog-title">Are you absolutely sure?</h2>
          <p data-slot="alert-dialog-description">
            This action cannot be undone. This will permanently delete your
            account from our servers.
          </p>
        </header>
        <footer data-slot="alert-dialog-footer">
          <button
            ng-button
            type="button"
            variant="outline"
            data-slot="alert-dialog-cancel"
          >
            Cancel
          </button>
          <button ng-button type="button" data-slot="alert-dialog-action">
            Continue
          </button>
        </footer>
      </section>
    </section>
  </body>
</html>
