<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div class="stack">
      <section data-slot="card" ng-direction id="direction-default">
        <header data-slot="card-header">
          <h3 data-slot="card-title">LTR</h3>
          <p data-slot="card-description" data-logical-align="start">
            The chevron points forward.
          </p>
        </header>
        <div data-slot="card-content" class="row">
          <span data-slot="rtl-flip" aria-hidden="true">-&gt;</span>
          <span>Settings</span>
        </div>
      </section>

      <section
        data-slot="card"
        ng-direction
        id="direction-rtl"
        dir="rtl"
        lang="ar"
      >
        <header data-slot="card-header">
          <h3 data-slot="card-title">RTL</h3>
          <p data-slot="card-description" data-logical-align="start">
            تتبع المحاذاة المنطقية واتجاه الأيقونة اتجاه المستند.
          </p>
        </header>
        <div
          data-slot="card-content"
          class="row"
          ng-direction
          id="direction-nested"
        >
          <span data-slot="rtl-flip" aria-hidden="true">-&gt;</span>
          <span>الإعدادات</span>
        </div>
      </section>
    </div>
  </body>
</html>
