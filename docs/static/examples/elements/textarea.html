<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="message='Ship semantic components';rtlMessage='';textareaAction='Ready'"
    data-example="textarea-button textarea-demo textarea-disabled textarea-field textarea-invalid textarea-rtl"
  >
    <main class="textarea-workflows visual-example">
      <div class="field">
        <label for="docs-textarea-message"
           class="field-label label">Message</label>
        <textarea

          id="docs-textarea-message"
          placeholder="Add a message"
          ng-model="message" class="textarea"></textarea>
        <p class="field-description">Add context for your request.</p>
      </div>

      <div data-disabled="true" class="field">
        <label for="docs-textarea-disabled"
           class="field-label label">Disabled</label>
        <textarea

          id="docs-textarea-disabled"
          placeholder="Disabled"
          disabled class="textarea"></textarea>
      </div>

      <div data-invalid="true" class="field">
        <label for="docs-textarea-invalid"
           class="field-label label">Invalid</label>
        <textarea

          id="docs-textarea-invalid"
          placeholder="Invalid"
          aria-invalid="true" class="textarea"></textarea>
        <p class="field-error">A message is required.</p>
      </div>

      <div class="textarea-button-demo field">
        <label for="docs-textarea-reply"
           class="field-label label">Reply</label>
        <textarea

          id="docs-textarea-reply"
          placeholder="Type your message here." class="textarea"></textarea>
        <button

          type="button"
          ng-click="textareaAction='Message sent'" class="button">
          Send message
        </button>
      </div>

      <div dir="rtl" lang="ar" class="field">
        <label for="docs-textarea-rtl"
           class="field-label label">رسالتك</label>
        <textarea

          id="docs-textarea-rtl"
          ng-model="rtlMessage"
          placeholder="اكتب رسالتك هنا." class="textarea"></textarea>
        <p class="field-description">سيتم إرسال رد إلى بريدك الإلكتروني.</p>
      </div>

      <output class="output textarea-output">
        Message: {{ message ? message : "empty" }} · {{ textareaAction }}
      </output>
    </main>
  </body>
</html>
