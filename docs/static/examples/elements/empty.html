<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="empty-demo">
    <section

      class="empty-demo visual-example empty"

      aria-live="polite"
    >
      <header class="empty-header">
        <div variant="icon" class="empty-media">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 9.75h16.5m-13.5 0V6.75A2.25 2.25 0 0 1 9 4.5h6a2.25 2.25 0 0 1 2.25 2.25v3m-12 0 1.2 8.4A2.25 2.25 0 0 0 8.68 20.25h6.64a2.25 2.25 0 0 0 2.23-2.1l1.2-8.4"
            />
          </svg>
        </div>
        <h2 class="empty-title">No Projects Yet</h2>
        <p class="empty-description">
          You haven't created any projects yet. Get started by creating your
          first project.
        </p>
      </header>
      <section class="empty-content">
        <div class="row">
          <button class="button">Create Project</button>
          <button variant="outline" class="button">Import Project</button>
        </div>
      </section>
      <a class="empty-learn-more" href="#learn-more">
        Learn More
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M7 17 17 7M7 7h10v10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </section>
  </body>
</html>
