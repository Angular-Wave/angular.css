<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="profile={name:'Pedro Duarte',username:'@peduarte'}; savedName='Pedro Duarte'"
    data-example="dialog-demo"
  >
    <main class="dialog-demo visual-example">
      <section id="profile-dialog" ng-dialog>
        <button ng-dialog-trigger ng-button variant="outline">
          Edit profile
        </button>
        <div ng-dialog-overlay>
          <span class="dialog-overlay-probe" aria-hidden="true"></span>
        </div>
        <section ng-dialog-content>
          <header ng-dialog-header>
            <h2 ng-dialog-title>Edit profile</h2>
            <p ng-dialog-description>
              Make changes to your profile here. Click save when you're done.
            </p>
          </header>
          <form class="dialog-profile-form" ng-submit="savedName=profile.name">
            <div class="dialog-form-row">
              <label ng-label for="dialog-name">Name</label>
              <input id="dialog-name" data-input ng-model="profile.name" />
            </div>
            <div class="dialog-form-row">
              <label ng-label for="dialog-username">Username</label>
              <input
                id="dialog-username"
                data-input
                ng-model="profile.username"
              />
            </div>
            <footer ng-dialog-footer>
              <button ng-button variant="outline" data-dialog-close>
                Cancel
              </button>
              <button
                ng-button
                type="submit"
                data-dialog-close
                ng-click="savedName=profile.name"
              >
                Save changes
              </button>
            </footer>
          </form>
          <button ng-dialog-close ng-button variant="ghost" size="icon-sm">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="example-sr-only">Close</span>
          </button>
        </section>
      </section>
      <output class="dialog-output" aria-live="polite">
        Saved profile: <span ng-bind="savedName"></span>
      </output>
    </main>
  </body>
</html>
