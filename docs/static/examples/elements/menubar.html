<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="menubarDemo={bookmarks:false,fullUrls:true,profile:'benoit'}"
    class="menubar-example-body"
    data-example="menubar-demo"
  >
    <main class="menubar-demo visual-example">
      <nav ng-menubar aria-label="Browser application menu">
        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">File</button>
          <menu class="menubar-content">
            <div class="menubar-group">
              <button type="button" class="menubar-item">
                New Tab <span class="menubar-shortcut">⌘T</span>
              </button>
              <button type="button" class="menubar-item">
                New Window <span class="menubar-shortcut">⌘N</span>
              </button>
              <button type="button" disabled class="menubar-item">
                New Incognito Window
              </button>
            </div>
            <hr  class="menubar-separator"/>
            <div class="menubar-group">
              <div class="menubar-sub">
                <button type="button" class="menubar-sub-trigger">Share</button>
                <div class="menubar-sub-content">
                  <div class="menubar-group">
                    <button type="button" class="menubar-item">Email link</button>
                    <button type="button" class="menubar-item">Messages</button>
                    <button type="button" class="menubar-item">Notes</button>
                  </div>
                </div>
              </div>
            </div>
            <hr  class="menubar-separator"/>
            <div class="menubar-group">
              <button type="button" class="menubar-item">
                Print... <span class="menubar-shortcut">⌘P</span>
              </button>
            </div>
          </menu>
        </section>

        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">Edit</button>
          <menu class="menubar-content">
            <div class="menubar-group">
              <button type="button" class="menubar-item">
                Undo <span class="menubar-shortcut">⌘Z</span>
              </button>
              <button type="button" class="menubar-item">
                Redo <span class="menubar-shortcut">⇧⌘Z</span>
              </button>
            </div>
            <hr  class="menubar-separator"/>
            <div class="menubar-group">
              <div class="menubar-sub">
                <button type="button" class="menubar-sub-trigger">Find</button>
                <div class="menubar-sub-content">
                  <button type="button" class="menubar-item">Search the web</button>
                  <hr  class="menubar-separator"/>
                  <button type="button" class="menubar-item">Find...</button>
                  <button type="button" class="menubar-item">Find Next</button>
                  <button type="button" class="menubar-item">Find Previous</button>
                </div>
              </div>
            </div>
            <hr  class="menubar-separator"/>
            <div class="menubar-group">
              <button type="button" class="menubar-item">Cut</button>
              <button type="button" class="menubar-item">Copy</button>
              <button type="button" class="menubar-item">Paste</button>
            </div>
          </menu>
        </section>

        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">View</button>
          <menu class="menubar-view-content menubar-content">
            <div class="menubar-group">
              <button
                type="button"


                aria-checked="{{ menubarDemo.bookmarks }}"
                ng-click="menubarDemo.bookmarks=!menubarDemo.bookmarks"
               class="menubar-checkbox-item">
                Bookmarks Bar
              </button>
              <button
                type="button"


                aria-checked="{{ menubarDemo.fullUrls }}"
                ng-click="menubarDemo.fullUrls=!menubarDemo.fullUrls"
               class="menubar-checkbox-item">
                Full URLs
              </button>
            </div>
            <hr  class="menubar-separator"/>
            <div class="menubar-group">
              <button type="button" inset class="menubar-item">
                Reload <span class="menubar-shortcut">⌘R</span>
              </button>
              <button type="button" inset disabled class="menubar-item">
                Force Reload <span class="menubar-shortcut">⇧⌘R</span>
              </button>
            </div>
            <hr  class="menubar-separator"/>
            <button type="button" inset class="menubar-item">
              Toggle Fullscreen
            </button>
            <hr  class="menubar-separator"/>
            <button type="button" inset class="menubar-item">Hide Sidebar</button>
          </menu>
        </section>

        <section class="menubar-menu">
          <button type="button" class="menubar-trigger">Profiles</button>
          <menu class="menubar-content">
            <fieldset


              aria-label="Active profile"
             class="menubar-radio-group">
              <button
                type="button"


                aria-checked="{{ menubarDemo.profile === 'andy' }}"
                ng-click="menubarDemo.profile='andy'"
               class="menubar-radio-item">
                Andy
              </button>
              <button
                type="button"


                aria-checked="{{ menubarDemo.profile === 'benoit' }}"
                ng-click="menubarDemo.profile='benoit'"
               class="menubar-radio-item">
                Benoit
              </button>
              <button
                type="button"


                aria-checked="{{ menubarDemo.profile === 'luis' }}"
                ng-click="menubarDemo.profile='luis'"
               class="menubar-radio-item">
                Luis
              </button>
            </fieldset>
            <hr  class="menubar-separator"/>
            <button type="button" inset class="menubar-item">Edit...</button>
            <hr  class="menubar-separator"/>
            <button type="button" inset class="menubar-item">Add Profile...</button>
          </menu>
        </section>
      </nav>
    </main>
  </body>
</html>
