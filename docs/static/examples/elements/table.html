<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <figure class="table-container">
      <table class="table">
        <caption class="table-caption">
          A list of recent invoices.
        </caption>
        <thead class="table-header">
          <tr class="table-row">
            <th scope="col" class="table-head">Invoice</th>
            <th scope="col" class="table-head">Status</th>
            <th scope="col" class="table-head">Method</th>
            <th class="text-right table-head" scope="col">
              Amount
            </th>
          </tr>
        </thead>
        <tbody class="table-body">
          <tr class="table-row">
            <th scope="row" class="table-cell">INV001</th>
            <td class="table-cell">Paid</td>
            <td class="table-cell">Card</td>
            <td class="text-right table-cell">$250.00</td>
          </tr>
          <tr class="table-row">
            <th scope="row" class="table-cell">INV002</th>
            <td class="table-cell">Pending</td>
            <td class="table-cell">PayPal</td>
            <td class="text-right table-cell">$150.00</td>
          </tr>
          <tr class="table-row">
            <th scope="row" class="table-cell">INV003</th>
            <td class="table-cell">Unpaid</td>
            <td class="table-cell">Transfer</td>
            <td class="text-right table-cell">$350.00</td>
          </tr>
        </tbody>
        <tfoot class="table-footer">
          <tr class="table-row">
            <td colspan="3" class="table-cell">Total</td>
            <td class="text-right table-cell">$750.00</td>
          </tr>
        </tfoot>
      </table>
    </figure>
  </body>
</html>
