<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="search=''; status=''">
    <div class="stack">
      <label for="docs-input-search">Search</label>
      <input
        id="docs-input-search"
        placeholder="Search"
        ng-model="search"
        class="input"
      />
      <div class="output">Value: {{ search ? search : "empty" }}</div>

      <label for="docs-input-compact">Content-sized</label>
      <input id="docs-input-compact" value="Compact" class="input input-fit" />

      <label for="docs-input-disabled">Disabled</label>
      <input
        id="docs-input-disabled"
        placeholder="Disabled"
        disabled
        class="input"
      />

      <label for="docs-input-invalid">Invalid</label>
      <input
        id="docs-input-invalid"
        placeholder="Invalid"
        aria-invalid="true"
        class="input"
      />

      <label for="docs-input-file">File</label>
      <input id="docs-input-file" type="file" class="input" />
    </div>
  </body>
</html>
