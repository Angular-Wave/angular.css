<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <div data-slot="item-group" style="max-width: 32rem">
      <div ng-item variant="outline" id="outline-item">
        <div data-slot="item-media" variant="icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
        </div>
        <div data-slot="item-content">
          <div data-slot="item-title">Profile verified</div>
          <p data-slot="item-description">
            Your public display name and email have been confirmed.
          </p>
        </div>
        <div data-slot="item-actions">
          <button ng-button variant="outline" size="sm">Review</button>
        </div>
      </div>
      <div ng-item variant="muted" data-size="sm" id="compact-item">
        <div data-slot="item-content">
          <div data-slot="item-title">Scheduled reports</div>
          <p data-slot="item-description">
            Weekly snapshots are ready for your team.
          </p>
        </div>
        <div data-slot="item-actions">
          <span ng-badge variant="secondary">New</span>
        </div>
      </div>
      <div ng-item disabled id="disabled-item">
        <div data-slot="item-content">
          <div data-slot="item-title">Archived workspace</div>
          <p data-slot="item-description">
            This workspace is retained for audit history.
          </p>
        </div>
        <div data-slot="item-actions">
          <button ng-button variant="outline" size="sm" disabled>
            Restore
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
