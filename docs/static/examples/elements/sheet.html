<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="profile={name:'Pedro Duarte',username:'@peduarte'}; savedName='Pedro Duarte'"
    data-example="sheet-demo"
  >
    <main class="sheet-demo visual-example">
      <section id="profile-sheet" ng-sheet>
        <button variant="outline" class="sheet-trigger button">Open</button>
        <div class="sheet-overlay"></div>
        <dialog class="sheet-content">
          <header class="sheet-header">
            <h2 class="sheet-title">Edit profile</h2>
            <p class="sheet-description">
              Make changes to your profile here. Click save when you're done.
            </p>
          </header>
          <form class="sheet-profile-form" ng-submit="savedName=profile.name">
            <div class="sheet-profile-fields sheet-body">
              <div class="sheet-profile-field">
                <label for="sheet-demo-name" class="label">Name</label>
                <input
                  id="sheet-demo-name"

                  ng-model="profile.name"
                  autofocus class="input" />
              </div>
              <div class="sheet-profile-field">
                <label for="sheet-demo-username" class="label">Username</label>
                <input
                  id="sheet-demo-username"

                  ng-model="profile.username" class="input" />
              </div>
            </div>
            <footer class="sheet-footer">
              <button

                type="submit"
                data-sheet-close
                ng-click="savedName=profile.name" class="button">
                Save changes
              </button>
              <button data-sheet-close variant="outline" class="button">
                Close
              </button>
            </footer>
          </form>
          <button variant="ghost" size="icon-sm" class="sheet-close button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="example-sr-only">Close sheet</span>
          </button>
        </dialog>
      </section>
      <output class="sheet-output" aria-live="polite">
        Saved profile: <span ng-bind="savedName"></span>
      </output>
    </main>
  </body>
</html>
