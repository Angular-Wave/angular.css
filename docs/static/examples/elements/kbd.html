<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="kbdAction='Ready'"
    data-example="kbd-button kbd-demo kbd-group kbd-input-group kbd-rtl kbd-tooltip"
  >
    <main class="kbd-workflows visual-example">
      <section class="kbd-row">
        <span>Open command menu</span>
        <span class="kbd-group"
          ><kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd></span
        >
        <span>or</span>
        <kbd aria-label="Slash" class="kbd">/</kbd>
      </section>

      <button
        variant="outline"
        type="button"
        ng-click="kbdAction='Saved'"
        class="button"
      >
        Save changes
        <span class="kbd-group"
          ><kbd class="kbd">Ctrl</kbd><kbd class="kbd">S</kbd></span
        >
      </button>

      <div class="input-group">
        <input
          placeholder="Search..."
          aria-label="Search with shortcut"
          class="input"
        />
        <div align="inline-end">
          <kbd class="kbd">⌘K</kbd>
        </div>
      </div>

      <span ng-tooltip>
        <button variant="outline" type="button" class="button">
          Keyboard help
        </button>
        <span side="top">Press <kbd class="kbd">?</kbd> to open help.</span>
      </span>

      <section class="kbd-row" dir="rtl" lang="ar">
        <span>فتح قائمة الأوامر</span>
        <span class="kbd-group"
          ><kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd></span
        >
      </section>

      <output class="kbd-output">{{ kbdAction }}</output>
    </main>
  </body>
</html>
