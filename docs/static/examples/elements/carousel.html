<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="carousel-example-body"
    data-example="carousel-demo"
  >
    <main class="carousel-canonical-stage visual-example">
      <section ng-carousel class="carousel-demo" aria-label="Numbered slides">
        <div data-slot="carousel-content">
          <div data-slot="carousel-track">
            <article data-slot="carousel-item">
              <div class="carousel-item-padding">
                <section ng-card>
                  <div data-slot="card-content" class="carousel-square">
                    <span>1</span>
                  </div>
                </section>
              </div>
            </article>
            <article data-slot="carousel-item">
              <div class="carousel-item-padding">
                <section ng-card>
                  <div data-slot="card-content" class="carousel-square">
                    <span>2</span>
                  </div>
                </section>
              </div>
            </article>
            <article data-slot="carousel-item">
              <div class="carousel-item-padding">
                <section ng-card>
                  <div data-slot="card-content" class="carousel-square">
                    <span>3</span>
                  </div>
                </section>
              </div>
            </article>
            <article data-slot="carousel-item">
              <div class="carousel-item-padding">
                <section ng-card>
                  <div data-slot="card-content" class="carousel-square">
                    <span>4</span>
                  </div>
                </section>
              </div>
            </article>
            <article data-slot="carousel-item">
              <div class="carousel-item-padding">
                <section ng-card>
                  <div data-slot="card-content" class="carousel-square">
                    <span>5</span>
                  </div>
                </section>
              </div>
            </article>
          </div>
        </div>
        <button
          data-slot="button"
          ng-carousel-previous
          size="icon-sm"
          variant="outline"
          type="button"
          aria-label="Previous slide"
        >
          <svg
            class="icon-sm lucide lucide-chevron-left"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button
          data-slot="button"
          ng-carousel-next
          size="icon-sm"
          variant="outline"
          type="button"
          aria-label="Next slide"
        >
          <svg
            class="icon-sm lucide lucide-chevron-right"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </section>
    </main>
  </body>
</html>
