<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="alert-demo">
    <div class="alert-demo visual-example">
      <div ng-alert>
        <svg
          data-slot="alert-icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-check-circle-2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9 12l2 2 4-4"></path>
        </svg>

        <div data-slot="alert-title">Payment successful</div>

        <div data-slot="alert-description">
          Your payment of $29.99 has been processed. A receipt has been sent to
          your email address.
        </div>
      </div>

      <div ng-alert>
        <svg
          data-slot="alert-icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-info"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </svg>

        <div data-slot="alert-title">New feature available</div>
        <div data-slot="alert-description">
          We've added dark mode support. You can enable it in your account
          settings.
        </div>
      </div>
    </div>
  </body>
</html>
