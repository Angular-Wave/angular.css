<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="checkbox-example-body"
    ng-init="terms=false;termsDetails=true;wrappedNotifications=false"
    data-example="checkbox-demo"
  >
    <div class="checkbox-demo visual-example field-group">
      <fieldset ng-field orientation="horizontal">
        <input

          id="terms-checkbox"
          name="terms-checkbox"
          type="checkbox"
          ng-model="terms" class="checkbox" />
        <label for="terms-checkbox" class="label">Accept terms and conditions</label>
      </fieldset>

      <fieldset ng-field orientation="horizontal">
        <input

          id="terms-checkbox-2"
          name="terms-checkbox-2"
          type="checkbox"
          ng-model="termsDetails" class="checkbox" />
        <div class="field-content">
          <label for="terms-checkbox-2"
             class="field-label label">Accept terms and conditions</label>
          <p class="field-description">
            By clicking this checkbox, you agree to the terms.
          </p>
        </div>
      </fieldset>

      <fieldset ng-field orientation="horizontal" data-disabled="true">
        <input

          id="toggle-checkbox"
          name="toggle-checkbox"
          type="checkbox"
          disabled class="checkbox" />
        <label for="toggle-checkbox"
           class="field-label label">Enable notifications</label>
      </fieldset>

      <label class="field-label label">
        <div orientation="horizontal" class="field">
          <input

            id="toggle-checkbox-2"
            name="toggle-checkbox-2"
            type="checkbox"
            ng-model="wrappedNotifications" class="checkbox" />
          <div class="field-content">
            <span class="field-title">Enable notifications</span>
            <span class="field-description">
              You can enable or disable notifications at any time.
            </span>
          </div>
        </div>
      </label>

      <output class="visually-hidden" aria-live="polite">
        Terms {{ terms ? 'accepted' : 'not accepted' }}. Detailed terms {{
        termsDetails ? 'accepted' : 'not accepted' }}. Notifications {{
        wrappedNotifications ? 'enabled' : 'disabled' }}.
      </output>
    </div>
  </body>
</html>
