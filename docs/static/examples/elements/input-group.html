<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <main class="stack">
      <div data-slot="field">
        <label ng-label data-slot="field-label" for="search">Search</label>
        <div ng-input-group role="group">
          <input
            data-input
            data-slot="input-group-control"
            id="search"
            placeholder="Search documentation..."
          />
          <div data-slot="input-group-addon" data-align="inline-start">⌕</div>
        </div>
      </div>
    </main>
  </body>
</html>
