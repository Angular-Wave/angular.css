<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <main class="stack">
      <div class="field">
        <label for="search" class="field-label label">Search</label>
        <div class="input-group">
          <input


            id="search"
            placeholder="Search documentation..."
           class="input-group-control input" />
          <label for="search" data-align="inline-start" class="input-group-addon">
            <span aria-hidden="true">⌕</span>
          </label>
        </div>
      </div>
    </main>
  </body>
</html>
