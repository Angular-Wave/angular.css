<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="popover-example-body"
    data-example="popover-demo"
  >
    <main class="popover-demo visual-example">
      <span aria-label="Dimensions popover" class="popover">
        <button
          type="button"
          variant="outline"
          class="popover-trigger button"
          popovertarget="popover-popover-1-content"
        >
          Open popover
        </button>
        <aside
          class="popover-demo-content popover-content"
          aria-label="Dimensions"
          id="popover-popover-1-content"
          data-side="bottom"
          data-align="center"
          popover
        >
          <header class="popover-header">
            <h2 class="popover-title">Dimensions</h2>
            <p class="popover-description">Set the dimensions for the layer.</p>
          </header>
          <div class="popover-dimension-fields">
            <div class="popover-dimension-field">
              <label for="popover-width" class="label">Width</label>
              <input id="popover-width" value="100%" autofocus class="input" />
            </div>
            <div class="popover-dimension-field">
              <label for="popover-max-width" class="label">Max. width</label>
              <input id="popover-max-width" value="300px" class="input" />
            </div>
            <div class="popover-dimension-field">
              <label for="popover-height" class="label">Height</label>
              <input id="popover-height" value="25px" class="input" />
            </div>
            <div class="popover-dimension-field">
              <label for="popover-max-height" class="label">Max. height</label>
              <input id="popover-max-height" value="none" class="input" />
            </div>
          </div>
        </aside>
      </span>
    </main>
  </body>
</html>
