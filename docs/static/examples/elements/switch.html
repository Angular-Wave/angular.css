<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="mode=false"
    data-example="switch-demo"
  >
    <div class="switch-demo visual-example">
      <input
        ng-switch-control
        id="airplane-mode"
        type="checkbox"
        role="switch"
        ng-model="mode"
      />
      <label ng-label for="airplane-mode">Airplane Mode</label>
      <div class="output visually-hidden" aria-live="polite">
        Mode enabled: <span ng-bind="mode"></span>
      </div>
    </div>
  </body>
</html>
