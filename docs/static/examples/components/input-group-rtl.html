<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="rtlQuery=''; rtlComment=''; rtlCount=0; rtlStatus='جاهز'"
    class="input-group-workflow-body"
    data-example="input-group-rtl"
  >
    <main
      class="input-group-rtl-workflow"
      aria-label="مجموعات إدخال من اليمين إلى اليسار"
    >
      <div class="input-group">
        <input


          ng-model="rtlQuery"
          placeholder="بحث..."
          aria-label="بحث"
         class="input-group-control input" />
        <div data-align="inline-start" class="input-group-addon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </div>
        <div data-align="inline-end" class="input-group-addon">
          ١٢ نتيجة
        </div>
      </div>
      <div class="input-group">
        <input


          placeholder="جاري البحث..."
          aria-label="جاري البحث"
         class="input-group-control input" />
        <div data-align="inline-end" class="input-group-addon">
          <span data-size="sm" aria-label="تحميل" class="spinner"></span>
        </div>
      </div>
      <div class="input-group">
        <input


          placeholder="جاري حفظ التغييرات..."
          aria-label="جاري الحفظ"
         class="input-group-control input" />
        <div data-align="inline-end" class="input-group-addon">
          <span class="input-group-text">جاري الحفظ...</span><span data-size="sm" aria-label="تحميل" class="spinner"></span>
        </div>
      </div>
      <div class="field">
        <label for="input-group-rtl-comment"
           class="field-label label">منطقة النص</label>
        <div class="input-group">
          <textarea


            id="input-group-rtl-comment"
            ng-model="rtlComment"
            data-change="rtlCount=rtlComment.length"
            maxlength="280"
            placeholder="اكتب تعليقًا..."
           class="input-group-control textarea"></textarea>
          <div data-align="block-end" class="input-group-addon">
            <span class="input-group-text">{{ rtlCount }}/٢٨٠</span>
            <button


              data-size="sm"
              class="input-group-push-end input-group-button button"
              type="button"
              ng-click="rtlStatus='تم النشر'"
            >
              نشر
            </button>
          </div>
        </div>
        <p class="field-description">تذييل موضع أسفل منطقة النص.</p>
      </div>
      <output class="input-group-output">
        {{ rtlStatus }} · {{ rtlQuery || 'لا يوجد بحث' }}
      </output>
    </main>
  </body>
</html>
