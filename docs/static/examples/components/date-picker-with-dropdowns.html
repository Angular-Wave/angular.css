<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
    <script src="../../js/date-picker-demo.umd.js"></script>
  </head>
  <body
    ng-app="datePickerDemo"
    ng-controller="DatePickerDemoController as picker"
    ng-cloak
    class="date-picker-dropdown-body"
    data-example="data-picker-with-dropdowns"
  >
    <main class="date-picker-dropdown-demo visual-example">
      <fieldset ng-field class="date-picker-dropdown-field">
        <label for="date-picker-with-dropdowns" class="field-label">Date</label>
        <span ng-popover id="date-picker-dropdown-popover">
          <button
            id="date-picker-with-dropdowns"
            type="button"


            variant="outline"
            class="date-picker-trigger date-picker-trigger-between popover-trigger button"
          >
            <span
              >{{ picker.dropdownDate ? picker.format(picker.dropdownDate) :
              'Pick a date' }}</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <aside

            side="bottom"
            align="start"
            class="calendar-popover-content date-picker-dropdown-content popover-content"
            aria-label="Choose a date with dropdowns"
          >
            <section
              ng-calendar
              data-calendar-generated
              data-month="2026-09"
              data-caption-layout="dropdown"
              data-start-year="2020"
              data-end-year="2030"
              ng-attr-data-value="{{ picker.dropdownDate }}"
              ng-on-angularcss:calendar-select="picker.selectDropdown($event.detail.value)"
            >
              <header class="calendar-header">
                <button
                  type="button"


                  size="icon"
                  variant="ghost"
                  aria-label="Previous dropdown month"
                 class="calendar-previous button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m15 18-6-6 6-6"></path>
                  </svg>
                </button>
                <h3 class="calendar-title"></h3>
                <button
                  type="button"


                  size="icon"
                  variant="ghost"
                  aria-label="Next dropdown month"
                 class="calendar-next button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m9 18 6-6-6-6"></path>
                  </svg>
                </button>
              </header>
              <div class="calendar-grid"></div>
            </section>
            <footer class="date-picker-dropdown-footer">
              <button

                type="button"
                variant="outline"
                size="sm"
                ng-click="picker.finishDropdown()" class="button">
                Done
              </button>
            </footer>
          </aside>
        </span>
      </fieldset>
    </main>
  </body>
</html>
