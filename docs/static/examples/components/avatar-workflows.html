<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="avatarAction = 'None'"
    data-example="avatar-badge-icon avatar-dropdown avatar-group-count-icon avatar-rtl avatar-size"
  >
    <main class="avatar-workflows">
      <section
        class="avatar-workflow-section"
        aria-labelledby="avatar-badge-heading"
      >
        <h2 id="avatar-badge-heading">Badge icon</h2>
        <div class="avatar-workflow-row" aria-label="Avatar badge icon">
          <span class="avatar">
            <img

              class="avatar-grayscale avatar-image"
              src="../../images/avatars/02.png"
              alt="@pranathip" />
            <span class="avatar-fallback">PP</span>
            <span class="avatar-badge">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
            </span>
          </span>
        </div>
      </section>

      <section
        class="avatar-workflow-section"
        aria-labelledby="avatar-count-heading"
      >
        <h2 id="avatar-count-heading">Group count icon</h2>
        <div

          class="avatar-grayscale avatar-group"
          aria-label="Avatar group count icon"
        >
          <span class="avatar">
            <img

              src="../../images/avatars/01.png"
              alt="@shadcn"
             class="avatar-image" />
            <span class="avatar-fallback">CN</span>
          </span>
          <span class="avatar">
            <img

              src="../../images/avatars/03.png"
              alt="@maxleiter"
             class="avatar-image" />
            <span class="avatar-fallback">LR</span>
          </span>
          <span class="avatar">
            <img

              src="../../images/avatars/04.png"
              alt="@evilrabbit"
             class="avatar-image" />
            <span class="avatar-fallback">ER</span>
          </span>
          <span class="avatar-group-count">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </span>
        </div>
      </section>

      <section
        class="avatar-workflow-section"
        aria-labelledby="avatar-size-heading"
      >
        <h2 id="avatar-size-heading">Sizes</h2>
        <div
          class="avatar-workflow-row avatar-grayscale"
          aria-label="Avatar sizes"
        >
          <span size="sm" class="avatar">
            <img

              src="../../images/avatars/01.png"
              alt="@shadcn small"
             class="avatar-image" />
            <span class="avatar-fallback">CN</span>
          </span>
          <span class="avatar">
            <img

              src="../../images/avatars/01.png"
              alt="@shadcn default"
             class="avatar-image" />
            <span class="avatar-fallback">CN</span>
          </span>
          <span size="lg" class="avatar">
            <img

              src="../../images/avatars/01.png"
              alt="@shadcn large"
             class="avatar-image" />
            <span class="avatar-fallback">CN</span>
          </span>
        </div>
      </section>

      <section
        class="avatar-workflow-section avatar-dropdown-stage"
        aria-labelledby="avatar-menu-heading"
      >
        <h2 id="avatar-menu-heading">Dropdown</h2>
        <div ng-dropdown class="avatar-dropdown-demo dropdown-menu">
          <button
            type="button"


            variant="ghost"
            size="icon"
            class="avatar-dropdown-trigger dropdown-menu-trigger button"
            aria-label="Open user menu"
          >
            <span class="avatar">
              <img

                src="../../images/avatars/01.png"
                alt="shadcn"
               class="avatar-image" />
              <span class="avatar-fallback">CN</span>
            </span>
          </button>
          <menu class="avatar-dropdown-menu dropdown-menu-content">
            <div class="dropdown-menu-group">
              <button

                ng-click="avatarAction = 'Profile'"
               class="dropdown-menu-item">
                Profile
              </button>
              <button

                ng-click="avatarAction = 'Billing'"
               class="dropdown-menu-item">
                Billing
              </button>
              <button

                ng-click="avatarAction = 'Settings'"
               class="dropdown-menu-item">
                Settings
              </button>
            </div>
            <div class="dropdown-menu-separator"></div>
            <div class="dropdown-menu-group">
              <button

                data-variant="destructive"
                ng-click="avatarAction = 'Log out'"
               class="dropdown-menu-item">
                Log out
              </button>
            </div>
          </menu>
        </div>
        <output class="avatar-workflow-output">
          Selected: {{ avatarAction }}
        </output>
      </section>

      <section
        class="avatar-workflow-section avatar-workflow-wide"
        aria-labelledby="avatar-rtl-heading"
        dir="rtl"
        lang="ar"
      >
        <h2 id="avatar-rtl-heading">اتجاه من اليمين إلى اليسار</h2>
        <div
          class="avatar-workflow-row avatar-rtl-demo"
          aria-label="صور رمزية من اليمين إلى اليسار"
        >
          <span class="avatar">
            <img

              class="avatar-grayscale avatar-image"
              src="../../images/avatars/01.png"
              alt="@shadcn" />
            <span class="avatar-fallback">CN</span>
          </span>
          <span class="avatar-rtl-badge avatar">
            <img

              src="../../images/avatars/04.png"
              alt="@evilrabbit"
             class="avatar-image" />
            <span class="avatar-fallback">ER</span>
            <span data-variant="success" class="avatar-badge"></span>
          </span>
          <span class="avatar-grayscale avatar-group">
            <span class="avatar">
              <img

                src="../../images/avatars/01.png"
                alt="@shadcn"
               class="avatar-image" />
              <span class="avatar-fallback">CN</span>
            </span>
            <span class="avatar">
              <img

                src="../../images/avatars/03.png"
                alt="@maxleiter"
               class="avatar-image" />
              <span class="avatar-fallback">LR</span>
            </span>
            <span class="avatar">
              <img

                src="../../images/avatars/04.png"
                alt="@evilrabbit"
               class="avatar-image" />
              <span class="avatar-fallback">ER</span>
            </span>
            <span class="avatar-group-count">+٣</span>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
