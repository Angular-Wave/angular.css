<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="sidebarOpen=true; sidebarAction='جاهز'"
    data-example="sidebar-rtl"
    class="sidebar-example-body"
  >
    <div class="sidebar-rtl-shell visual-example sidebar-layout">
      <main class="sidebar-rtl-inset sidebar-inset">
        <header class="sidebar-demo-toolbar">
          <button
            variant="ghost"
            size="sm"
            data-sidebar-controlled
            aria-controls="rtl-sidebar"
            ng-click="sidebarOpen=!sidebarOpen"
            class="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M15 4v16"></path>
            </svg>
            <span ng-bind="sidebarOpen ? 'إغلاق الشريط' : 'فتح الشريط'"></span>
          </button>
        </header>
        <section class="sidebar-dashboard">
          <div>
            <span class="sidebar-dashboard-kicker">نظرة عامة</span>
            <h1>لوحة التحكم</h1>
            <p>تابع نشاط الفريق والمشاريع الحالية.</p>
          </div>
          <output
            class="sidebar-anatomy-output"
            aria-live="polite"
            ng-bind="sidebarAction"
          ></output>
        </section>
      </main>
      <aside
        id="rtl-sidebar"
        ng-sidebar
        side="right"
        variant="floating"
        collapsible="icon"
        ng-attr-data-state="{{ sidebarOpen ? 'expanded' : 'collapsed' }}"
        class="sidebar-rtl-panel"
        aria-label="التنقل في مساحة العمل"
      >
        <header class="sidebar-header">
          <a href="#workspace" size="lg" class="sidebar-menu-button">
            <span class="sidebar-brand-mark" aria-hidden="true">أ</span>
            <span class="sidebar-brand-copy"
              ><strong>شركة أكمي</strong><small>المؤسسة</small></span
            >
          </a>
        </header>
        <nav class="sidebar-content">
          <section class="sidebar-group">
            <h3 class="sidebar-group-label">المنصة</h3>
            <div class="sidebar-group-content">
              <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                  <a
                    data-active="true"
                    href="#playground"
                    class="sidebar-menu-button"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                      <path d="m8 9 2 2-2 2M13 15h3"></path>
                    </svg>
                    <span>ملعب</span>
                  </a>
                  <ul class="sidebar-menu-sub">
                    <li class="sidebar-menu-sub-item">
                      <a href="#history" class="sidebar-menu-sub-button"
                        >السجل</a
                      >
                    </li>
                    <li class="sidebar-menu-sub-item">
                      <a href="#starred" class="sidebar-menu-sub-button"
                        >المميز</a
                      >
                    </li>
                    <li class="sidebar-menu-sub-item">
                      <a href="#settings" class="sidebar-menu-sub-button"
                        >الإعدادات</a
                      >
                    </li>
                  </ul>
                </li>
                <li class="sidebar-menu-item">
                  <a href="#models" class="sidebar-menu-button"
                    ><span class="sidebar-menu-dot" aria-hidden="true"></span
                    ><span>النماذج</span></a
                  >
                </li>
              </ul>
            </div>
          </section>
          <section class="sidebar-group">
            <h3 class="sidebar-group-label">المشاريع</h3>
            <div class="sidebar-group-content">
              <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                  <a href="#design" class="sidebar-menu-button"
                    ><span class="sidebar-menu-dot" aria-hidden="true"></span
                    ><span>هندسة التصميم</span></a
                  >
                  <div ng-dropdown>
                    <button
                      aria-label="المزيد"
                      class="dropdown-menu-trigger sidebar-menu-action"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                      >
                        <circle cx="5" cy="12" r="1.5"></circle>
                        <circle cx="12" cy="12" r="1.5"></circle>
                        <circle cx="19" cy="12" r="1.5"></circle>
                      </svg>
                    </button>
                    <menu
                      side="left"
                      align="start"
                      class="dropdown-menu-content"
                    >
                      <button
                        ng-click="sidebarAction='عرض المشروع'"
                        class="dropdown-menu-item"
                      >
                        عرض المشروع
                      </button>
                      <button
                        ng-click="sidebarAction='مشاركة المشروع'"
                        class="dropdown-menu-item"
                      >
                        مشاركة المشروع
                      </button>
                    </menu>
                  </div>
                </li>
                <li class="sidebar-menu-item">
                  <a href="#sales" class="sidebar-menu-button"
                    ><span class="sidebar-menu-dot" aria-hidden="true"></span
                    ><span>المبيعات والتسويق</span></a
                  >
                </li>
                <li class="sidebar-menu-item">
                  <a href="#travel" class="sidebar-menu-button"
                    ><span class="sidebar-menu-dot" aria-hidden="true"></span
                    ><span>السفر</span></a
                  >
                </li>
              </ul>
            </div>
          </section>
        </nav>
        <footer class="sidebar-footer">
          <button
            size="lg"
            ng-click="sidebarAction='الحساب'"
            class="sidebar-menu-button"
          >
            <span class="avatar"><span class="avatar-fallback">ش</span></span>
            <span class="sidebar-brand-copy"
              ><strong>شاد سي إن</strong><small>m@example.com</small></span
            >
          </button>
        </footer>
      </aside>
    </div>
  </body>
</html>
