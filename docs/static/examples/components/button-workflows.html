<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Button Workflows</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    data-example="button-default button-destructive button-ghost button-icon button-link button-outline button-render button-rounded button-rtl button-secondary button-size button-spinner button-with-icon"
  >
    <main class="workflow-stack">
      <div class="workflow-row" aria-label="Button variants">
        <button class="button">Button</button>
        <button variant="secondary" class="button">Secondary</button>
        <button variant="destructive" class="button">Destructive</button>
        <button variant="outline" class="button">Outline</button>
        <button variant="ghost" class="button">Ghost</button>
        <button variant="link" class="button">Link</button>
      </div>

      <div class="workflow-row workflow-sizes" aria-label="Button sizes">
        <button size="xs" variant="outline" class="button">Extra Small</button>
        <button
          size="icon-xs"
          variant="outline"
          aria-label="Submit extra small"
          class="button"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 17 17 7M7 7h10v10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button size="sm" variant="outline" class="button">Small</button>
        <button
          size="icon-sm"
          variant="outline"
          aria-label="Submit small"
          class="button"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 17 17 7M7 7h10v10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button variant="outline" class="button">Default</button>
        <button
          size="icon"
          variant="outline"
          aria-label="Submit default"
          class="button"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 17 17 7M7 7h10v10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button size="lg" variant="outline" class="button">Large</button>
        <button
          size="icon-lg"
          variant="outline"
          aria-label="Submit large"
          class="button"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 17 17 7M7 7h10v10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div class="workflow-row" aria-label="Rounded and icon buttons">
        <a href="#login" variant="secondary" size="sm" class="button">Login</a>
        <button type="submit" class="button-rounded button">Get Started</button>
        <button
          class="button-rounded button"
          variant="outline"
          size="icon"
          aria-label="Continue"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="m5 12 7-7 7 7M12 19V5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button variant="outline" class="button">
          <svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M6 3v12M18 9v12M6 9c6 0 6 6 12 6M18 3v3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          New Branch
        </button>
        <button variant="outline" class="button">
          Fork
          <svg
            icon="inline-end"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M6 3v12M18 9v12M6 9c6 0 6 6 12 6M18 3v3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="workflow-row" aria-label="Loading buttons">
        <button variant="outline" disabled class="button">
          <svg
            icon="inline-start"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          Generating
        </button>
        <button variant="secondary" aria-disabled="true" class="button">
          Downloading
          <svg
            icon="inline-end"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="workflow-row" dir="rtl" aria-label="RTL buttons">
        <button variant="outline" class="button">زر</button>
        <button variant="destructive" class="button">حذف</button>
        <button variant="outline" class="button">
          إرسال
          <svg
            icon="inline-end"
            class="rtl-flip"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m9 18 6-6-6-6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </main>
  </body>
</html>
