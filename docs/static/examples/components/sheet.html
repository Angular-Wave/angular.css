<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="profile={name:'Pedro Duarte',username:'@peduarte'}; savedName='Pedro Duarte'"
    data-example="sheet-demo"
  >
    <main class="sheet-demo visual-example">
      <section id="profile-sheet" ng-sheet>
        <button ng-sheet-trigger ng-button variant="outline">Open</button>
        <div ng-sheet-overlay></div>
        <aside ng-sheet-content>
          <header ng-sheet-header>
            <h2 ng-sheet-title>Edit profile</h2>
            <p ng-sheet-description>
              Make changes to your profile here. Click save when you're done.
            </p>
          </header>
          <form class="sheet-profile-form" ng-submit="savedName=profile.name">
            <div ng-sheet-body class="sheet-profile-fields">
              <div class="sheet-profile-field">
                <label ng-label for="sheet-demo-name">Name</label>
                <input
                  id="sheet-demo-name"
                  data-input
                  ng-model="profile.name"
                  autofocus
                />
              </div>
              <div class="sheet-profile-field">
                <label ng-label for="sheet-demo-username">Username</label>
                <input
                  id="sheet-demo-username"
                  data-input
                  ng-model="profile.username"
                />
              </div>
            </div>
            <footer ng-sheet-footer>
              <button
                ng-button
                type="submit"
                data-sheet-close
                ng-click="savedName=profile.name"
              >
                Save changes
              </button>
              <button data-sheet-close ng-button variant="outline">
                Close
              </button>
            </footer>
          </form>
          <button ng-sheet-close ng-button variant="ghost" size="icon-sm">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="example-sr-only">Close sheet</span>
          </button>
        </aside>
      </section>
      <output class="sheet-output" aria-live="polite">
        Saved profile: <span ng-bind="savedName"></span>
      </output>
    </main>
  </body>
</html>
