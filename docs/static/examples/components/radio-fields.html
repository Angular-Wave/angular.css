<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="radioFields={subscription:'free',battery:'',security:'',unlock:'',invalid:'',disabled:''}"
    data-example="radio-fields"
  >
    <main ng-field-group class="radio-fields-demo visual-example">
      <fieldset ng-field-set>
        <legend ng-field-legend data-variant="label" id="subscription-title">
          Subscription Plan
        </legend>
        <div ng-radio-group aria-labelledby="subscription-title">
          <div ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="radio-free"
              name="subscription-plan"
              type="radio"
              value="free"
              ng-model="radioFields.subscription"
            />
            <label ng-field-label for="radio-free" class="radio-plain-label">
              Free Plan
            </label>
          </div>
          <div ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="radio-pro"
              name="subscription-plan"
              type="radio"
              value="pro"
              ng-model="radioFields.subscription"
            />
            <label ng-field-label for="radio-pro" class="radio-plain-label">
              Pro Plan
            </label>
          </div>
          <div ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="radio-enterprise"
              name="subscription-plan"
              type="radio"
              value="enterprise"
              ng-model="radioFields.subscription"
            />
            <label
              ng-field-label
              for="radio-enterprise"
              class="radio-plain-label"
            >
              Enterprise
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset ng-field-set>
        <legend ng-field-legend data-variant="label" id="battery-title">
          Battery Level
        </legend>
        <p ng-field-description id="battery-description">
          Choose your preferred battery level.
        </p>
        <div
          ng-radio-group
          aria-labelledby="battery-title"
          aria-describedby="battery-description"
        >
          <div ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="battery-high"
              name="battery-level"
              type="radio"
              value="high"
              ng-model="radioFields.battery"
            />
            <label ng-field-label for="battery-high">High</label>
          </div>
          <div ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="battery-medium"
              name="battery-level"
              type="radio"
              value="medium"
              ng-model="radioFields.battery"
            />
            <label ng-field-label for="battery-medium">Medium</label>
          </div>
          <div ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="battery-low"
              name="battery-level"
              type="radio"
              value="low"
              ng-model="radioFields.battery"
            />
            <label ng-field-label for="battery-low">Low</label>
          </div>
        </div>
      </fieldset>

      <div
        ng-radio-group
        class="radio-fields-content-list"
        aria-label="Device security"
      >
        <div ng-field orientation="horizontal" role="group">
          <input
            ng-radio-group-item
            id="radio-content-1"
            name="device-security"
            type="radio"
            value="touch"
            ng-model="radioFields.security"
          />
          <div ng-field-content>
            <label ng-field-label for="radio-content-1">Enable Touch ID</label>
            <p ng-field-description>
              Enable Touch ID to quickly unlock your device.
            </p>
          </div>
        </div>
        <div ng-field orientation="horizontal" role="group">
          <input
            ng-radio-group-item
            id="radio-content-2"
            name="device-security"
            type="radio"
            value="biometric"
            ng-model="radioFields.security"
          />
          <div ng-field-content>
            <label ng-field-label for="radio-content-2">
              Enable Touch ID and Face ID to make it even faster to unlock your
              device. This is a long label to test the layout.
            </label>
            <p ng-field-description>
              Enable Touch ID to quickly unlock your device.
            </p>
          </div>
        </div>
      </div>

      <div
        ng-radio-group
        class="radio-fields-title-list"
        aria-label="Device unlock"
      >
        <label ng-field-label for="radio-title-1">
          <span ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="radio-title-1"
              name="device-unlock"
              type="radio"
              value="touch"
              ng-model="radioFields.unlock"
            />
            <span ng-field-content>
              <span ng-field-title>Enable Touch ID</span>
              <span ng-field-description>
                Enable Touch ID to quickly unlock your device.
              </span>
            </span>
          </span>
        </label>
        <label ng-field-label for="radio-title-2">
          <span ng-field orientation="horizontal" role="group">
            <input
              ng-radio-group-item
              id="radio-title-2"
              name="device-unlock"
              type="radio"
              value="biometric"
              ng-model="radioFields.unlock"
            />
            <span ng-field-content>
              <span ng-field-title>
                Enable Touch ID and Face ID to make it even faster to unlock
                your device. This is a long label to test the layout.
              </span>
              <span ng-field-description>
                Enable Touch ID to quickly unlock your device.
              </span>
            </span>
          </span>
        </label>
      </div>

      <fieldset ng-field-set>
        <legend ng-field-legend data-variant="label" id="invalid-title">
          Invalid Radio Group
        </legend>
        <div ng-radio-group aria-labelledby="invalid-title">
          <div
            ng-field
            orientation="horizontal"
            role="group"
            data-invalid="true"
          >
            <input
              ng-radio-group-item
              id="radio-invalid-1"
              name="invalid-choice"
              type="radio"
              value="invalid1"
              aria-invalid="true"
              ng-model="radioFields.invalid"
            />
            <label ng-field-label for="radio-invalid-1">
              Invalid Option 1
            </label>
          </div>
          <div
            ng-field
            orientation="horizontal"
            role="group"
            data-invalid="true"
          >
            <input
              ng-radio-group-item
              id="radio-invalid-2"
              name="invalid-choice"
              type="radio"
              value="invalid2"
              aria-invalid="true"
              ng-model="radioFields.invalid"
            />
            <label ng-field-label for="radio-invalid-2">
              Invalid Option 2
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset ng-field-set>
        <legend ng-field-legend data-variant="label" id="disabled-title">
          Disabled Radio Group
        </legend>
        <div
          ng-radio-group
          aria-labelledby="disabled-title"
          aria-disabled="true"
        >
          <div
            ng-field
            orientation="horizontal"
            role="group"
            data-disabled="true"
          >
            <input
              ng-radio-group-item
              id="radio-disabled-1"
              name="disabled-choice"
              type="radio"
              value="disabled1"
              disabled
              ng-model="radioFields.disabled"
            />
            <label ng-field-label for="radio-disabled-1">
              Disabled Option 1
            </label>
          </div>
          <div
            ng-field
            orientation="horizontal"
            role="group"
            data-disabled="true"
          >
            <input
              ng-radio-group-item
              id="radio-disabled-2"
              name="disabled-choice"
              type="radio"
              value="disabled2"
              disabled
              ng-model="radioFields.disabled"
            />
            <label ng-field-label for="radio-disabled-2">
              Disabled Option 2
            </label>
          </div>
        </div>
      </fieldset>
    </main>
  </body>
</html>
