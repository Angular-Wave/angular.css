<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="spinner-badge spinner-button spinner-custom spinner-empty spinner-input-group spinner-rtl spinner-size input-group-spinner"
  >
    <main class="spinner-workflows">
      <div class="workflow-row" aria-label="Spinner sizes">
        <svg

          id="processing-spinner"

          aria-live="assertive"
          aria-label="Processing data"
          style="width: 12px; height: 12px"
          viewBox="0 0 24 24"
          fill="none" class="spinner">
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="spinner">
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg

          aria-hidden="true"
          style="width: 24px; height: 24px"
          viewBox="0 0 24 24"
          fill="none" class="spinner">
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg

          aria-hidden="true"
          style="width: 32px; height: 32px"
          viewBox="0 0 24 24"
          fill="none" class="spinner">
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="workflow-row" aria-label="Spinner badges">
        <span class="badge"><svg

            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg>Syncing</span>
        <span variant="secondary" class="badge"><svg

            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg>Updating</span>
        <span variant="outline" class="badge"><svg

            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg>Processing</span>
      </div>

      <div class="workflow-buttons-column" aria-label="Spinner buttons">
        <button disabled size="sm" class="button">
          <svg

            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg>Loading...
        </button>
        <button variant="outline" disabled size="sm" class="button">
          <svg

            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg>Please wait
        </button>
        <button variant="secondary" disabled size="sm" class="button">
          <svg

            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg>Processing
        </button>
      </div>

      <section

        class="spinner-empty-demo empty"

        aria-live="polite"
      >
        <header class="empty-header">
          <div variant="icon" class="empty-media">
            <svg viewBox="0 0 24 24" fill="none" class="spinner">
              <path
                d="M21 12a9 9 0 1 1-6.22-8.56"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <h2 class="empty-title">Processing your request</h2>
          <p class="empty-description">
            Please wait while we process your request. Do not refresh the page.
          </p>
        </header>
        <section class="empty-content">
          <button variant="outline" size="sm" class="button">Cancel</button>
        </section>
      </section>

      <div class="workflow-input-groups" aria-label="Spinner input groups">
        <div class="input-group">
          <input


            placeholder="Searching..."
           class="input-group-control input" />
          <div data-align="inline-end" class="input-group-addon">
            <svg viewBox="0 0 24 24" fill="none" class="spinner">
              <path
                d="M21 12a9 9 0 1 1-6.22-8.56"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
        <div class="input-group">
          <input


            placeholder="Saving changes..."
           class="input-group-control input" />
          <div data-align="inline-end" class="input-group-addon">
            <span class="input-group-text">Saving...</span><svg viewBox="0 0 24 24" fill="none" class="spinner">
              <path
                d="M21 12a9 9 0 1 1-6.22-8.56"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
      </div>

      <article variant="muted" class="spinner-rtl-demo item" dir="rtl">
        <div class="item-media">
          <svg viewBox="0 0 24 24" fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <section class="item-content">
          <h3 class="item-title">جاري معالجة الدفع...</h3>
        </section>
        <section class="spinner-amount item-content">
          <span>١٠٠.٠٠ دولار</span>
        </section>
      </article>
    </main>
  </body>
</html>
