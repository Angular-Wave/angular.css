<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="tooltip-rtl">
    <main class="tooltip-rtl-workflow" dir="rtl">
      <header class="workflow-heading"><h2>الجوانب الفعلية</h2></header>
      <div class="tooltip-side-row">
        <span ng-tooltip>
          <button type="button" variant="outline" class="tooltip-trigger button">
            يسار
          </button>
          <span side="left" class="tooltip-content">إضافة إلى المكتبة</span>
        </span>
        <span ng-tooltip>
          <button type="button" variant="outline" class="tooltip-trigger button">
            أعلى
          </button>
          <span side="top" class="tooltip-content">إضافة إلى المكتبة</span>
        </span>
        <span ng-tooltip>
          <button type="button" variant="outline" class="tooltip-trigger button">
            أسفل
          </button>
          <span side="bottom" class="tooltip-content">إضافة إلى المكتبة</span>
        </span>
        <span ng-tooltip>
          <button type="button" variant="outline" class="tooltip-trigger button">
            يمين
          </button>
          <span side="right" class="tooltip-content">إضافة إلى المكتبة</span>
        </span>
      </div>
    </main>
  </body>
</html>
