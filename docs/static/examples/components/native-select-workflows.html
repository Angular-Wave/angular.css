<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="nativeSelectWorkflow={department:'',fruit:'',compact:'todo',showArchived:false}"
    data-example="native-select-disabled native-select-groups native-select-invalid"
  >
    <main class="native-select-workflows">
      <section class="native-select-workflow-section">
        <header class="workflow-heading"><h2>Grouped options</h2></header>
        <div class="native-select-field">
          <label for="native-department" class="label">Department</label>
          <div class="native-select-wrapper">
            <select

              id="native-department"
              ng-model="nativeSelectWorkflow.department" class="native-select">
              <option value="">Select department</option>
              <optgroup label="Engineering">
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="devops">DevOps</option>
              </optgroup>
              <optgroup label="Sales">
                <option value="sales-rep">Sales Rep</option>
                <option value="account-manager">Account Manager</option>
                <option value="sales-director">Sales Director</option>
              </optgroup>
              <optgroup label="Operations">
                <option value="support">Customer Support</option>
                <option value="product-manager">Product Manager</option>
                <option value="ops-manager">Operations Manager</option>
              </optgroup>
            </select>
          </div>
          <p class="native-select-output">
            Selected:
            <span ng-if="!nativeSelectWorkflow.department">none</span>
            <span
              ng-if="nativeSelectWorkflow.department"
              id="native-department-output"
              ng-bind="nativeSelectWorkflow.department"
            ></span>
          </p>
        </div>
      </section>

      <section class="native-select-workflow-section">
        <header class="workflow-heading"><h2>States</h2></header>
        <div class="native-select-state-list">
          <div class="native-select-field">
            <label for="native-disabled" class="label">Disabled</label>
            <div class="native-select-wrapper">
              <select id="native-disabled" disabled class="native-select">
                <option value="">Disabled</option>
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="blueberry">Blueberry</option>
              </select>
            </div>
          </div>
          <div class="native-select-field">
            <label for="native-invalid" class="label">Invalid</label>
            <div class="native-select-wrapper">
              <select

                id="native-invalid"
                aria-invalid="true"
                ng-model="nativeSelectWorkflow.fruit" class="native-select">
                <option value="">Error state</option>
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="blueberry">Blueberry</option>
              </select>
            </div>
          </div>
          <div class="native-select-field">
            <label for="native-compact" class="label">Small</label>
            <div data-size="sm" class="native-select-wrapper">
              <select

                id="native-compact"
                data-size="sm"
                ng-model="nativeSelectWorkflow.compact" class="native-select">
                <option value="todo">Todo</option>
                <option value="done">Done</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <section
        class="native-select-workflow-section native-select-dynamic-section"
      >
        <header class="workflow-heading">
          <h2>Dynamic AngularTS options</h2>
        </header>
        <button

          type="button"
          variant="outline"
          ng-click="nativeSelectWorkflow.showArchived=true" class="button">
          Add archived option
        </button>
        <div class="native-select-field">
          <label for="native-dynamic" class="label">Project status</label>
          <div class="native-select-wrapper">
            <select

              id="native-dynamic"
              ng-model="nativeSelectWorkflow.dynamic" class="native-select">
              <option value="">Select status</option>
              <option value="active">Active</option>
              <option
                ng-if="nativeSelectWorkflow.showArchived"
                value="archived"
              >
                Archived
              </option>
            </select>
          </div>
          <p class="native-select-output">
            Value:
            <span ng-if="!nativeSelectWorkflow.dynamic">none</span>
            <span
              ng-if="nativeSelectWorkflow.dynamic"
              id="native-dynamic-output"
              ng-bind="nativeSelectWorkflow.dynamic"
            ></span>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
