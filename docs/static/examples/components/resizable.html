<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="resizable-demo">
    <div
      ng-resizable-panel-group
      orientation="horizontal"
      aria-label="Resizable layout"
      class="resizable-demo visual-example"
    >
      <section style="--panel-size: 1" class="resizable-panel">
        <div class="resizable-panel-content"><strong>One</strong></div>
      </section>
      <div

        aria-label="Resize panel one and panels two and three"
       class="resizable-handle">
        <span aria-hidden="true" class="resizable-handle-grip"></span>
      </div>
      <section style="--panel-size: 1" class="resizable-panel">
        <div
          ng-resizable-panel-group
          orientation="vertical"
          aria-label="Resize panels two and three"
        >
          <section style="--panel-size: 1" class="resizable-panel">
            <div class="resizable-panel-content"><strong>Two</strong></div>
          </section>
          <div

            aria-label="Resize panel two and panel three"
           class="resizable-handle">
            <span aria-hidden="true" class="resizable-handle-grip"></span>
          </div>
          <section style="--panel-size: 3" class="resizable-panel">
            <div class="resizable-panel-content"><strong>Three</strong></div>
          </section>
        </div>
      </section>
    </div>
  </body>
</html>
