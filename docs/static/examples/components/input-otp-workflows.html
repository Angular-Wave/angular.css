<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="controlled='123456'; direction='rtl'"
    data-example="input-otp-alphanumeric input-otp-controlled input-otp-disabled input-otp-four-digits input-otp-invalid input-otp-pattern input-otp-rtl input-otp-separator"
  >
    <main class="input-otp-workflow-grid visual-example">
      <section class="input-otp-workflow">
        <h2>Alphanumeric</h2>
        <label for="otp-alphanumeric">Access code</label>
        <input
          id="otp-alphanumeric"
          class="input-otp"
          autocomplete="one-time-code"
          maxlength="6"
          size="6"
          value="A1B2C3"
        />
      </section>

      <section class="input-otp-workflow">
        <h2>Controlled</h2>
        <label for="otp-controlled">Verification code</label>
        <input
          id="otp-controlled"
          class="input-otp"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          maxlength="6"
          size="6"
          ng-model="controlled"
        />
        <output class="input-otp-message">Code: {{ controlled }}</output>
      </section>

      <section class="input-otp-workflow">
        <h2>Disabled</h2>
        <label for="otp-disabled">Disabled code</label>
        <input
          id="otp-disabled"
          class="input-otp"
          maxlength="6"
          size="6"
          value="123456"
          disabled
        />
      </section>

      <section class="input-otp-workflow">
        <h2>Four digits</h2>
        <label for="otp-four">PIN</label>
        <input
          id="otp-four"
          class="input-otp"
          inputmode="numeric"
          pattern="[0-9]{4}"
          minlength="4"
          maxlength="4"
          size="4"
        />
      </section>

      <section class="input-otp-workflow">
        <h2>Invalid</h2>
        <label for="otp-invalid">Invalid code</label>
        <input
          id="otp-invalid"
          class="input-otp"
          value="000000"
          maxlength="6"
          size="6"
          aria-invalid="true"
          aria-describedby="otp-invalid-error"
        />
        <p id="otp-invalid-error" class="field-error">Code expired.</p>
      </section>

      <section class="input-otp-workflow">
        <h2>Digits only</h2>
        <label for="otp-pattern">Security code</label>
        <input
          id="otp-pattern"
          class="input-otp"
          inputmode="numeric"
          pattern="[0-9]{6}"
          minlength="6"
          maxlength="6"
          size="6"
          required
        />
      </section>

      <section class="input-otp-workflow" dir="{{ direction }}">
        <h2>RTL</h2>
        <label for="otp-rtl">رمز التحقق</label>
        <input
          id="otp-rtl"
          class="input-otp"
          inputmode="numeric"
          maxlength="6"
          size="6"
        />
        <button
          type="button"
          variant="outline"
          class="button"
          ng-click="direction = direction === 'rtl' ? 'ltr' : 'rtl'"
        >
          Change direction
        </button>
      </section>

      <section class="input-otp-workflow">
        <h2>Grouped</h2>
        <label for="otp-grouped">Recovery code</label>
        <input
          id="otp-grouped"
          class="input-otp input-otp-grouped"
          maxlength="6"
          size="6"
        />
      </section>
    </main>
  </body>
</html>
