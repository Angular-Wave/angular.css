<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="popover-rtl">
    <main class="popover-rtl-workflow" dir="rtl">
      <header class="workflow-heading"><h2>الجوانب الفعلية</h2></header>
      <div class="popover-side-grid">
        <section class="popover-side-stage popover-side-stage-left">
          <span ng-popover>
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              يسار
            </button>
            <aside side="left" aria-label="الأبعاد يسار" class="popover-content">
              <header class="popover-header">
                <h3 class="popover-title">الأبعاد</h3>
                <p class="popover-description">تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
        <section class="popover-side-stage popover-side-stage-top">
          <span ng-popover>
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              أعلى
            </button>
            <aside side="top" aria-label="الأبعاد أعلى" class="popover-content">
              <header class="popover-header">
                <h3 class="popover-title">الأبعاد</h3>
                <p class="popover-description">تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
        <section class="popover-side-stage popover-side-stage-bottom">
          <span ng-popover>
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              أسفل
            </button>
            <aside side="bottom" aria-label="الأبعاد أسفل" class="popover-content">
              <header class="popover-header">
                <h3 class="popover-title">الأبعاد</h3>
                <p class="popover-description">تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
        <section class="popover-side-stage popover-side-stage-right">
          <span ng-popover>
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              يمين
            </button>
            <aside side="right" aria-label="الأبعاد يمين" class="popover-content">
              <header class="popover-header">
                <h3 class="popover-title">الأبعاد</h3>
                <p class="popover-description">تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
      </div>
    </main>
  </body>
</html>
