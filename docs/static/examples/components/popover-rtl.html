<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="popover-rtl">
    <main class="popover-rtl-workflow" dir="rtl">
      <header class="workflow-heading"><h2>الجوانب الفعلية</h2></header>
      <div class="popover-side-grid">
        <section class="popover-side-stage popover-side-stage-left">
          <span class="popover">
            <button
              type="button"
              variant="outline"
              class="button"
              popovertarget="popover-popover-rtl-1-content"
            >
              يسار
            </button>
            <aside
              aria-label="الأبعاد يسار"
              id="popover-popover-rtl-1-content"
              popover
              side="left"
              align="center"
            >
              <header>
                <h3>الأبعاد</h3>
                <p>تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
        <section class="popover-side-stage popover-side-stage-top">
          <span class="popover">
            <button
              type="button"
              variant="outline"
              class="button"
              popovertarget="popover-popover-rtl-2-content"
            >
              أعلى
            </button>
            <aside
              aria-label="الأبعاد أعلى"
              id="popover-popover-rtl-2-content"
              popover
              side="top"
              align="center"
            >
              <header>
                <h3>الأبعاد</h3>
                <p>تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
        <section class="popover-side-stage popover-side-stage-bottom">
          <span class="popover">
            <button
              type="button"
              variant="outline"
              class="button"
              popovertarget="popover-popover-rtl-3-content"
            >
              أسفل
            </button>
            <aside
              aria-label="الأبعاد أسفل"
              id="popover-popover-rtl-3-content"
              popover
              side="bottom"
              align="center"
            >
              <header>
                <h3>الأبعاد</h3>
                <p>تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
        <section class="popover-side-stage popover-side-stage-right">
          <span class="popover">
            <button
              type="button"
              variant="outline"
              class="button"
              popovertarget="popover-popover-rtl-4-content"
            >
              يمين
            </button>
            <aside
              aria-label="الأبعاد يمين"
              id="popover-popover-rtl-4-content"
              popover
              side="right"
              align="center"
            >
              <header>
                <h3>الأبعاد</h3>
                <p>تعيين الأبعاد للطبقة.</p>
              </header>
            </aside>
          </span>
        </section>
      </div>
    </main>
  </body>
</html>
