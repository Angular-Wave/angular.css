<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="profile={name:'Pedro Duarte',username:'peduarte'}; savedName='Pedro Duarte'"
    data-example="sheet-rtl"
  >
    <main class="sheet-demo visual-example">
      <section id="rtl-profile-sheet" ng-sheet side="left">
        <button variant="outline" class="sheet-trigger button">فتح</button>
        <div class="sheet-overlay"></div>
        <dialog class="sheet-content">
          <header class="sheet-header">
            <h2 class="sheet-title">تعديل الملف الشخصي</h2>
            <p class="sheet-description">
              قم بإجراء تغييرات على ملفك الشخصي هنا. انقر حفظ عند الانتهاء.
            </p>
          </header>
          <form class="sheet-profile-form">
            <div class="sheet-profile-fields sheet-body">
              <div class="sheet-profile-field">
                <label for="sheet-rtl-name" class="label">الاسم</label>
                <input
                  id="sheet-rtl-name"

                  ng-model="profile.name"
                  autofocus class="input" />
              </div>
              <div class="sheet-profile-field">
                <label for="sheet-rtl-username" class="label">اسم المستخدم</label>
                <input
                  id="sheet-rtl-username"

                  ng-model="profile.username" class="input" />
              </div>
            </div>
            <footer class="sheet-footer">
              <button

                data-sheet-close
                ng-click="savedName=profile.name" class="button">
                حفظ التغييرات
              </button>
              <button data-sheet-close variant="outline" class="button">
                إغلاق
              </button>
            </footer>
          </form>
          <button variant="ghost" size="icon-sm" class="sheet-close button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="example-sr-only">إغلاق اللوحة</span>
          </button>
        </dialog>
      </section>
      <output class="sheet-output" aria-live="polite">
        الملف المحفوظ: <span ng-bind="savedName"></span>
      </output>
    </main>
  </body>
</html>
