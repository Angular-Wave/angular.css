<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="collapsible-basic collapsible-rtl collapsible-settings"
  >
    <main class="collapsible-workflow-grid" aria-label="Collapsible workflows">
      <section
        class="collapsible-workflow"
        aria-labelledby="collapsible-basic-heading"
      >
        <h2 id="collapsible-basic-heading">Basic</h2>
        <div class="collapsible-basic-card card">
          <section>
            <details class="collapsible collapsible-product">
              <summary>
                <span>Product details</span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </summary>
              <div>
                <p>
                  This panel can be expanded or collapsed to reveal additional
                  content.
                </p>
                <button size="xs" class="button">Learn More</button>
              </div>
            </details>
          </section>
        </div>
      </section>

      <section
        class="collapsible-workflow"
        aria-labelledby="collapsible-settings-heading"
      >
        <h2 id="collapsible-settings-heading">Settings</h2>
        <div size="sm" class="collapsible-settings-card card">
          <header>
            <h2>Radius</h2>
            <p>Set the corner radius of the element.</p>
          </header>
          <section>
            <section class="collapsible-settings">
              <div class="collapsible-settings-fields">
                <label class="visually-hidden" for="radius-x">Radius X</label>
                <input id="radius-x" type="number" value="0" class="input" />
                <label class="visually-hidden" for="radius-y">Radius Y</label>
                <input id="radius-y" type="number" value="0" class="input" />
                <details class="collapsible collapsible-settings-disclosure">
                  <summary
                    class="button"
                    aria-label="Toggle additional radius settings"
                  >
                    <svg
                      class="collapsible-maximize"
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"
                      />
                    </svg>
                    <svg
                      class="collapsible-minimize"
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m8 0v-3a2 2 0 0 1 2-2h3"
                      />
                    </svg>
                  </summary>
                  <div class="collapsible-settings-more">
                    <label class="visually-hidden" for="radius-bottom-x"
                      >Bottom radius X</label
                    >
                    <input
                      id="radius-bottom-x"
                      type="number"
                      value="0"
                      class="input"
                    />
                    <label class="visually-hidden" for="radius-bottom-y"
                      >Bottom radius Y</label
                    >
                    <input
                      id="radius-bottom-y"
                      type="number"
                      value="0"
                      class="input"
                    />
                  </div>
                </details>
              </div>
            </section>
          </section>
        </div>
      </section>

      <section
        class="collapsible-workflow collapsible-workflow-wide"
        aria-labelledby="collapsible-rtl-heading"
        dir="rtl"
        lang="ar"
      >
        <h2 id="collapsible-rtl-heading">من اليمين إلى اليسار</h2>
        <details class="collapsible">
          <summary>
            <header>
              <h4>الطلب #4189</h4>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7 15 5 5 5-5M7 9l5-5 5 5" />
              </svg>
              <span class="visually-hidden">تبديل التفاصيل</span>
            </header>
            <p><span>الحالة</span><strong>تم الشحن</strong></p>
          </summary>
          <section>
            <article>
              <p><strong>عنوان الشحن</strong></p>
              <p>100 Market St, San Francisco</p>
            </article>
            <article>
              <p><strong>العناصر</strong></p>
              <p>2x سماعات الاستوديو</p>
            </article>
          </section>
        </details>
      </section>
    </main>
  </body>
</html>
