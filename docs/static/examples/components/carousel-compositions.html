<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="carousel-rtl carousel-size carousel-spacing"
  >
    <main
      class="carousel-composition-grid"
      aria-label="Carousel layout compositions"
    >
      <section
        class="carousel-workflow"
        aria-labelledby="carousel-rtl-heading"
        dir="rtl"
        lang="ar"
      >
        <h2 id="carousel-rtl-heading">من اليمين إلى اليسار</h2>
        <section
          ng-carousel
          dir="rtl"
          class="carousel-demo"
          aria-label="شرائح مرقمة"
        >
          <div class="carousel-content">
            <ul class="carousel-track">
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section class="carousel-square card-content">
                      <span>١</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section class="carousel-square card-content">
                      <span>٢</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section class="carousel-square card-content">
                      <span>٣</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section class="carousel-square card-content">
                      <span>٤</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section class="carousel-square card-content">
                      <span>٥</span>
                    </section>
                  </article>
                </div>
              </li>
            </ul>
          </div>
          <button


            size="icon-sm"
            variant="outline"
            type="button"
            aria-label="الشريحة السابقة"
           class="button carousel-previous">
            <svg
              class="icon-sm lucide lucide-chevron-left"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button


            size="icon-sm"
            variant="outline"
            type="button"
            aria-label="الشريحة التالية"
           class="button carousel-next">
            <svg
              class="icon-sm lucide lucide-chevron-right"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </section>
      </section>

      <section
        class="carousel-workflow"
        aria-labelledby="carousel-size-heading"
      >
        <h2 id="carousel-size-heading">Responsive size</h2>
        <section
          ng-carousel
          align="start"
          class="carousel-size-demo"
          aria-label="Sized numbered slides"
        >
          <div class="carousel-content">
            <ul class="carousel-track">
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-medium card-content"
                    >
                      <span>1</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-medium card-content"
                    >
                      <span>2</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-medium card-content"
                    >
                      <span>3</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-medium card-content"
                    >
                      <span>4</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-medium card-content"
                    >
                      <span>5</span>
                    </section>
                  </article>
                </div>
              </li>
            </ul>
          </div>
          <button


            size="icon-sm"
            variant="outline"
            type="button"
            aria-label="Previous sized slide"
           class="button carousel-previous">
            <svg
              class="icon-sm lucide lucide-chevron-left"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button


            size="icon-sm"
            variant="outline"
            type="button"
            aria-label="Next sized slide"
           class="button carousel-next">
            <svg
              class="icon-sm lucide lucide-chevron-right"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </section>
      </section>

      <section
        class="carousel-workflow carousel-composition-wide"
        aria-labelledby="carousel-spacing-heading"
      >
        <h2 id="carousel-spacing-heading">Custom spacing</h2>
        <section
          ng-carousel
          align="start"
          class="carousel-spacing-demo"
          aria-label="Tightly spaced numbered slides"
        >
          <div class="carousel-content">
            <ul class="carousel-track">
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-small card-content"
                    >
                      <span>1</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-small card-content"
                    >
                      <span>2</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-small card-content"
                    >
                      <span>3</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-small card-content"
                    >
                      <span>4</span>
                    </section>
                  </article>
                </div>
              </li>
              <li class="carousel-item">
                <div class="carousel-item-padding">
                  <article class="card">
                    <section

                      class="carousel-square carousel-square-small card-content"
                    >
                      <span>5</span>
                    </section>
                  </article>
                </div>
              </li>
            </ul>
          </div>
          <button


            size="icon-sm"
            variant="outline"
            type="button"
            aria-label="Previous tightly spaced slide"
           class="button carousel-previous">
            <svg
              class="icon-sm lucide lucide-chevron-left"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button


            size="icon-sm"
            variant="outline"
            type="button"
            aria-label="Next tightly spaced slide"
           class="button carousel-next">
            <svg
              class="icon-sm lucide lucide-chevron-right"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </section>
      </section>
    </main>
  </body>
</html>
