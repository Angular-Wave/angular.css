<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="status='todo'; includeArchived=false; externalOpen=false"
  >
    <main class="select-state-workflows visual-example">
      <div class="select-state-controls">
        <button

          type="button"
          data-variant="outline"
          ng-click="externalOpen=!externalOpen" class="button">
          Toggle popup
        </button>
        <button

          type="button"
          data-variant="outline"
          ng-click="includeArchived=!includeArchived" class="button">
          Toggle archived option
        </button>
      </div>

      <div
        id="state-select"
        ng-select
        open="{{ externalOpen }}"
        ng-on-angularcss:select="status=$event.detail.value; externalOpen=false"
        ng-on-angularcss:select-open-change="externalOpen=$event.detail.open"
      >
        <button type="button" aria-label="Status" class="select-trigger">
          <span

            ng-bind="status === 'doing' ? 'In progress' : status === 'done' ? 'Done' : status === 'archived' ? 'Archived' : 'Todo'"
           class="select-value"></span>
        </button>
        <ul data-align-trigger="false" class="select-content">
          <div class="select-group">
            <div class="select-label">Workflow</div>
            <li data-value="todo" aria-selected="true" class="select-item">
              Todo
            </li>
            <li data-value="doing" aria-disabled="true" class="select-item">
              In progress
            </li>
            <li data-value="done" class="select-item">Done</li>
            <li data-value="archived" ng-if="includeArchived" class="select-item">
              Archived
            </li>
          </div>
        </ul>
      </div>

      <output class="select-state-output" aria-live="polite">
        Selected: <span ng-bind="status"></span>. Archived option:
        <span ng-bind="includeArchived ? 'shown' : 'hidden'"></span>. Popup:
        <span ng-bind="externalOpen ? 'open' : 'closed'"></span>.
      </output>
    </main>
  </body>
</html>
