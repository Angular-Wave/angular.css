<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="rtlNativeStatus=''"
    data-example="native-select-rtl"
  >
    <main class="native-select-rtl-workflow">
      <div class="native-select-field" dir="rtl">
        <label for="rtl-native-status">الحالة</label>
        <select id="rtl-native-status" dir="rtl" ng-model="rtlNativeStatus">
          <option value="">اختر الحالة</option>
          <option value="todo">مهام</option>
          <option value="in-progress">قيد التنفيذ</option>
          <option value="done">منجز</option>
          <option value="cancelled">ملغي</option>
        </select>
        <p class="native-select-output">
          القيمة:
          <span ng-if="!rtlNativeStatus">لا شيء</span>
          <span
            ng-if="rtlNativeStatus"
            id="rtl-native-output"
            ng-bind="rtlNativeStatus"
          ></span>
        </p>
      </div>
    </main>
  </body>
</html>
