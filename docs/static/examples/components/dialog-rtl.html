<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="profile={name:'محمد علي',username:'@mohamed'}"
    data-example="dialog-rtl"
  >
    <main class="dialog-demo visual-example">
      <section id="rtl-profile-dialog" class="dialog">
        <button variant="outline" class="dialog-trigger button" type="button" commandfor="rtl-profile-dialog-content" command="show-modal">
          تعديل الملف الشخصي
        </button>
        <dialog class="dialog-content" id="rtl-profile-dialog-content" closedby="any" aria-labelledby="rtl-profile-dialog-title" aria-describedby="rtl-profile-dialog-description">
          <header class="dialog-header">
            <h2 class="dialog-title" id="rtl-profile-dialog-title">تعديل الملف الشخصي</h2>
            <p class="dialog-description" id="rtl-profile-dialog-description">
              غيّر بيانات ملفك الشخصي ثم احفظ التعديلات.
            </p>
          </header>
          <div class="dialog-profile-form">
            <div class="dialog-form-row">
              <label for="rtl-name" class="label">الاسم</label>
              <input id="rtl-name" ng-model="profile.name" class="input" />
            </div>
            <div class="dialog-form-row">
              <label for="rtl-username" class="label">اسم المستخدم</label>
              <input id="rtl-username" ng-model="profile.username" class="input" />
            </div>
          </div>
          <footer class="dialog-footer">
            <button variant="outline" class="button" commandfor="rtl-profile-dialog-content" command="close">إلغاء</button>
            <button class="button" commandfor="rtl-profile-dialog-content" command="close">حفظ التغييرات</button>
          </footer>
          <button variant="ghost" size="icon-sm" class="dialog-close button" commandfor="rtl-profile-dialog-content" command="close">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="example-sr-only">إغلاق</span>
          </button>
        </dialog>
      </section>
    </main>
  </body>
</html>
