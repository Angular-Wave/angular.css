<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="tooltip-example-body"
    data-example="tooltip-demo"
  >
    <main class="tooltip-demo visual-example">
      <span ng-tooltip>
        <button type="button" variant="outline" class="tooltip-trigger button">
          Hover
        </button>
        <span side="top" class="tooltip-content">Add to library</span>
      </span>
    </main>
  </body>
</html>
