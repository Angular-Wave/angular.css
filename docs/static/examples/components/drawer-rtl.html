<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="goal=350" data-example="drawer-rtl">
    <main class="drawer-demo visual-example">
      <section id="rtl-goal-drawer" ng-drawer>
        <button ng-drawer-trigger ng-button variant="outline">فتح الدرج</button>
        <div ng-drawer-overlay></div>
        <section ng-drawer-content>
          <div ng-drawer-handle></div>
          <div class="drawer-goal-panel">
            <header ng-drawer-header>
              <h2 ng-drawer-title>نقل الهدف</h2>
              <p ng-drawer-description>حدد هدف نشاطك اليومي.</p>
            </header>
            <div class="drawer-goal-body">
              <div class="drawer-goal-control">
                <button
                  ng-button
                  variant="outline"
                  size="icon-sm"
                  aria-label="تقليل"
                  ng-click="goal=goal-10"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
                <div class="drawer-goal-value">
                  <strong ng-bind="goal"></strong>
                  <span>سعرات حرارية/يوم</span>
                </div>
                <button
                  ng-button
                  variant="outline"
                  size="icon-sm"
                  aria-label="زيادة"
                  ng-click="goal=goal+10"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
              </div>
              <div
                class="drawer-goal-chart drawer-goal-chart-rtl"
                aria-hidden="true"
              >
                <span data-height="80"></span><span data-height="60"></span>
                <span data-height="40"></span><span data-height="60"></span>
                <span data-height="40"></span><span data-height="56"></span>
                <span data-height="38"></span><span data-height="48"></span>
                <span data-height="60"></span><span data-height="40"></span>
                <span data-height="56"></span><span data-height="38"></span>
                <span data-height="70"></span>
              </div>
            </div>
            <footer ng-drawer-footer>
              <button ng-button>إرسال</button>
              <button ng-drawer-close ng-button variant="outline">إلغاء</button>
            </footer>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
