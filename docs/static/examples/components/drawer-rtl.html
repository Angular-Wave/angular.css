<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="goal=350" data-example="drawer-rtl">
    <main class="drawer-demo visual-example">
      <section id="rtl-goal-drawer" class="drawer">
        <button variant="outline" class="drawer-trigger button" type="button" commandfor="rtl-goal-drawer-content" command="show-modal">فتح الدرج</button>
        <dialog class="drawer-content" id="rtl-goal-drawer-content" closedby="any" aria-labelledby="rtl-goal-drawer-title" aria-describedby="rtl-goal-drawer-description" data-side="bottom">
          <div class="drawer-handle"></div>
          <div class="drawer-goal-panel">
            <header class="drawer-header">
              <h2 class="drawer-title" id="rtl-goal-drawer-title">نقل الهدف</h2>
              <p class="drawer-description" id="rtl-goal-drawer-description">حدد هدف نشاطك اليومي.</p>
            </header>
            <div class="drawer-goal-body">
              <div class="drawer-goal-control">
                <button

                  variant="outline"
                  size="icon-sm"
                  aria-label="تقليل"
                  ng-click="goal=goal-10" class="button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
                <div class="drawer-goal-value">
                  <strong ng-bind="goal"></strong>
                  <span>سعرات حرارية/يوم</span>
                </div>
                <button

                  variant="outline"
                  size="icon-sm"
                  aria-label="زيادة"
                  ng-click="goal=goal+10" class="button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
              </div>
              <div
                class="drawer-goal-chart drawer-goal-chart-rtl"
                aria-hidden="true"
              >
                <span data-height="80"></span><span data-height="60"></span>
                <span data-height="40"></span><span data-height="60"></span>
                <span data-height="40"></span><span data-height="56"></span>
                <span data-height="38"></span><span data-height="48"></span>
                <span data-height="60"></span><span data-height="40"></span>
                <span data-height="56"></span><span data-height="38"></span>
                <span data-height="70"></span>
              </div>
            </div>
            <footer class="drawer-footer">
              <button class="button">إرسال</button>
              <button variant="outline" class="drawer-close button" commandfor="rtl-goal-drawer-content" command="close">إلغاء</button>
            </footer>
          </div>
        </dialog>
      </section>
    </main>
  </body>
</html>
