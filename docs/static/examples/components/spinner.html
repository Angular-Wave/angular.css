<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="spinner-demo">
    <div class="spinner-demo visual-example">
      <div ng-item variant="muted">
        <div data-slot="item-media">
          <svg ng-spinner viewBox="0 0 24 24" fill="none">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div data-slot="item-content">
          <div data-slot="item-title">Processing payment...</div>
        </div>
        <div data-slot="item-content" class="spinner-amount">
          <span>$100.00</span>
        </div>
      </div>
    </div>
  </body>
</html>
