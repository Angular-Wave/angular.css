<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="rtlMenubar={fullUrls:true,profile:'benoit'}"
    data-example="menubar-rtl"
  >
    <main class="menubar-rtl-workflow" dir="rtl">
      <header class="workflow-heading"><h2>قائمة التطبيق</h2></header>
      <div class="menubar-rtl-stage">
        <nav ng-menubar aria-label="قائمة التطبيق">
          <section ng-menubar-menu>
            <button type="button" ng-menubar-trigger>ملف</button>
            <div ng-menubar-content>
              <button type="button" ng-menubar-item>
                علامة تبويب جديدة <span ng-menubar-shortcut>⌘T</span>
              </button>
              <button type="button" ng-menubar-item>
                نافذة جديدة <span ng-menubar-shortcut>⌘N</span>
              </button>
              <button type="button" ng-menubar-item disabled>
                نافذة التصفح المتخفي الجديدة
              </button>
              <div ng-menubar-separator role="separator"></div>
              <div ng-menubar-sub>
                <button type="button" ng-menubar-sub-trigger>مشاركة</button>
                <div ng-menubar-sub-content>
                  <button type="button" ng-menubar-item>
                    رابط البريد الإلكتروني
                  </button>
                  <button type="button" ng-menubar-item>الرسائل</button>
                  <button type="button" ng-menubar-item>الملاحظات</button>
                </div>
              </div>
              <div ng-menubar-separator role="separator"></div>
              <button type="button" ng-menubar-item>
                طباعة... <span ng-menubar-shortcut>⌘P</span>
              </button>
            </div>
          </section>

          <section ng-menubar-menu>
            <button type="button" ng-menubar-trigger>تعديل</button>
            <div ng-menubar-content>
              <button type="button" ng-menubar-item>تراجع</button>
              <button type="button" ng-menubar-item>إعادة</button>
              <div ng-menubar-separator role="separator"></div>
              <button type="button" ng-menubar-item>قص</button>
              <button type="button" ng-menubar-item>نسخ</button>
              <button type="button" ng-menubar-item>لصق</button>
            </div>
          </section>

          <section ng-menubar-menu>
            <button type="button" ng-menubar-trigger>عرض</button>
            <div ng-menubar-content class="menubar-wide-content">
              <button
                type="button"
                ng-menubar-checkbox-item
                role="menuitemcheckbox"
                aria-checked="{{ rtlMenubar.fullUrls }}"
                ng-click="rtlMenubar.fullUrls=!rtlMenubar.fullUrls"
              >
                عناوين URL الكاملة
              </button>
              <div ng-menubar-separator role="separator"></div>
              <button type="button" ng-menubar-item inset>إعادة تحميل</button>
              <button type="button" ng-menubar-item inset disabled>
                إعادة تحميل قسري
              </button>
            </div>
          </section>

          <section ng-menubar-menu>
            <button type="button" ng-menubar-trigger>الملفات الشخصية</button>
            <div ng-menubar-content>
              <div ng-menubar-radio-group role="group" aria-label="الملف النشط">
                <button
                  type="button"
                  ng-menubar-radio-item
                  role="menuitemradio"
                  aria-checked="{{ rtlMenubar.profile === 'andy' }}"
                  ng-click="rtlMenubar.profile='andy'"
                >
                  Andy
                </button>
                <button
                  type="button"
                  ng-menubar-radio-item
                  role="menuitemradio"
                  aria-checked="{{ rtlMenubar.profile === 'benoit' }}"
                  ng-click="rtlMenubar.profile='benoit'"
                >
                  Benoit
                </button>
                <button
                  type="button"
                  ng-menubar-radio-item
                  role="menuitemradio"
                  aria-checked="{{ rtlMenubar.profile === 'luis' }}"
                  ng-click="rtlMenubar.profile='luis'"
                >
                  Luis
                </button>
              </div>
            </div>
          </section>
        </nav>
      </div>
    </main>
  </body>
</html>
