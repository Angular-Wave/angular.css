<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="hover-card-rtl">
    <main class="hover-card-workflow" dir="rtl">
      <header class="hover-card-workflow-header">
        <h2>الجوانب الفعلية</h2>
      </header>
      <div class="hover-card-side-grid">
        <section class="hover-card-stage hover-card-stage-left">
          <span ng-hover-card open-delay="20" close-delay="100">
            <button

              type="button"
              variant="outline"

             class="hover-card-trigger button">
              يسار
            </button>
            <aside side="left" class="hover-card-content">
              <strong class="hover-card-title">سماعات لاسلكية</strong>
              <span class="hover-card-description">٩٩.٩٩ $</span>
            </aside>
          </span>
        </section>

        <section class="hover-card-stage hover-card-stage-top">
          <span ng-hover-card open-delay="20" close-delay="100">
            <button

              type="button"
              variant="outline"

             class="hover-card-trigger button">
              أعلى
            </button>
            <aside side="top" class="hover-card-content">
              <strong class="hover-card-title">سماعات لاسلكية</strong>
              <span class="hover-card-description">٩٩.٩٩ $</span>
            </aside>
          </span>
        </section>

        <section class="hover-card-stage hover-card-stage-bottom">
          <span ng-hover-card open-delay="20" close-delay="100">
            <button

              type="button"
              variant="outline"

             class="hover-card-trigger button">
              أسفل
            </button>
            <aside side="bottom" class="hover-card-content">
              <strong class="hover-card-title">سماعات لاسلكية</strong>
              <span class="hover-card-description">٩٩.٩٩ $</span>
            </aside>
          </span>
        </section>

        <section class="hover-card-stage hover-card-stage-right">
          <span ng-hover-card open-delay="20" close-delay="100">
            <button

              type="button"
              variant="outline"

             class="hover-card-trigger button">
              يمين
            </button>
            <aside side="right" class="hover-card-content">
              <strong class="hover-card-title">سماعات لاسلكية</strong>
              <span class="hover-card-description">٩٩.٩٩ $</span>
            </aside>
          </span>
        </section>
      </div>
    </main>
  </body>
</html>
