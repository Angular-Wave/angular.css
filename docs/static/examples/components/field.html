<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="name='Jane Doe'; email=''">
    <form class="stack">
      <fieldset class="field-set">
        <legend class="field-legend">Profile</legend>
        <div class="field-group">
          <fieldset ng-field>
            <label for="demo-profile-name"
               class="field-label label">Name</label>
            <input

              id="demo-profile-name"
              placeholder="Jane Doe"
              ng-model="name" class="input" />
            <p class="field-description">Use your public display name.</p>
          </fieldset>
          <fieldset data-invalid ng-field>
            <label for="demo-profile-email" class="field-label label">
              Email
            </label>
            <input

              id="demo-profile-email"
              type="email"
              placeholder="Enter an email"
              required
              ng-model="email" class="input" />
            <p ng-if="!email" class="field-error">
              Enter a valid email.
            </p>
          </fieldset>
        </div>
      </fieldset>
      <div class="output">
        Preview: <span ng-bind="name"></span>
        <span ng-bind="email ? '(' + email + ')' : '(email required)'"></span>
      </div>
    </form>
  </body>
</html>
