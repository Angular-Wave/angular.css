<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
    <script src="../../js/sonner-demo.umd.js"></script>
  </head>
  <body
    ng-app="sonnerDemo"
    ng-controller="SonnerDemoController as sonner"
    ng-cloak
    data-example="sonner-description sonner-position sonner-types"
  >
    <main class="sonner-workflow-grid">
      <section
        class="sonner-workflow-section"
        aria-labelledby="sonner-description-title"
      >
        <h2 id="sonner-description-title">With description</h2>
        <button

          type="button"
          variant="outline"
          ng-click="sonner.showDescription()" class="button">
          Show Toast
        </button>
        <div class="sonner-inline-preview">
          <div
            ng-toaster
            class="sonner-inline-toaster"
            aria-label="Description notifications"
          >
            <li ng-if="sonner.descriptionVisible" class="toast">
              <section class="toast-content">
                <h3 class="toast-title">Event has been created</h3>
                <p class="toast-description">Monday, January 3rd at 6:00pm</p>
              </section>
              <button


                variant="ghost"
                size="icon-sm"
                aria-label="Dismiss description toast"
                ng-click="sonner.dismissDescription()"
               class="toast-close button">
                <span class="sonner-icon"></span>
              </button>
            </li>
          </div>
        </div>
        <output class="output">{{ sonner.descriptionStatus }}</output>
      </section>

      <section
        class="sonner-workflow-section sonner-workflow-wide"
        aria-labelledby="sonner-position-title"
      >
        <h2 id="sonner-position-title">Position</h2>
        <div class="sonner-button-grid" aria-label="Toast positions">
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPosition('top-left')" class="button">
            Top Left
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPosition('top-center')" class="button">
            Top Center
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPosition('top-right')" class="button">
            Top Right
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPosition('bottom-left')" class="button">
            Bottom Left
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPosition('bottom-center')" class="button">
            Bottom Center
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPosition('bottom-right')" class="button">
            Bottom Right
          </button>
        </div>
        <div class="sonner-position-preview">
          <div
            ng-toaster
            class="sonner-position-toaster"
            position="{{ sonner.position }}"
            aria-label="Position notifications"
          >
            <li ng-if="sonner.positionVisible" class="toast">
              <section class="toast-content">
                <h3 class="toast-title">Event has been created</h3>
              </section>
              <button


                variant="ghost"
                size="icon-sm"
                aria-label="Dismiss position toast"
                ng-click="sonner.dismissPosition()"
               class="toast-close button">
                <span class="sonner-icon"></span>
              </button>
            </li>
          </div>
        </div>
        <output class="output">Position: {{ sonner.position }}</output>
      </section>

      <section
        class="sonner-workflow-section sonner-workflow-wide"
        aria-labelledby="sonner-types-title"
      >
        <h2 id="sonner-types-title">Types</h2>
        <div class="sonner-button-grid" aria-label="Toast types">
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showType('default')" class="button">
            Default
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showType('success')" class="button">
            Success
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showType('info')" class="button">
            Info
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showType('warning')" class="button">
            Warning
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showType('error')" class="button">
            Error
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="sonner.showPromise()" class="button">
            Promise
          </button>
        </div>
        <div class="sonner-inline-preview sonner-types-preview">
          <div
            ng-toaster
            class="sonner-inline-toaster"
            aria-label="Type notifications"
          >
            <li

              type="{{ sonner.type }}"
              ng-if="sonner.typeVisible"
             class="toast">
              <span


                ng-if="sonner.type === 'success'"
               class="toast-icon sonner-icon"></span>
              <span


                ng-if="sonner.type === 'info'"
               class="toast-icon sonner-icon"></span>
              <span


                ng-if="sonner.type === 'warning'"
               class="toast-icon sonner-icon"></span>
              <span


                ng-if="sonner.type === 'error'"
               class="toast-icon sonner-icon"></span>
              <span


                ng-if="sonner.type === 'loading'"
               class="toast-icon sonner-icon"></span>
              <section class="toast-content">
                <h3 class="toast-title">{{ sonner.typeMessage }}</h3>
              </section>
              <button


                variant="ghost"
                size="icon-sm"
                aria-label="Dismiss type toast"
                ng-click="sonner.dismissType()"
               class="toast-close button">
                <span class="sonner-icon"></span>
              </button>
            </li>
          </div>
        </div>
        <output class="output">Type: {{ sonner.type }}</output>
      </section>
    </main>
  </body>
</html>
