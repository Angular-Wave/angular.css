<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="state={requiredEmail:'',dynamicVisible:false}"
  >
    <form class="component-state-grid" aria-label="Field state contracts">
      <section
        class="component-state-section"
        aria-labelledby="field-messages-title"
      >
        <h2 id="field-messages-title">Messages</h2>
        <div ng-field id="message-field">
          <label ng-label data-slot="field-label" for="message-control"
            >Name</label
          >
          <input data-input id="message-control" />
          <p data-slot="field-description">Use your public display name.</p>
          <p data-slot="field-error">The display name is already in use.</p>
        </div>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="field-invalid-title"
      >
        <h2 id="field-invalid-title">Invalid state</h2>
        <div ng-field id="explicit-invalid-field">
          <label
            ng-label
            data-slot="field-label"
            for="explicit-invalid-control"
          >
            Workspace
          </label>
          <input data-input id="explicit-invalid-control" aria-invalid="true" />
        </div>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="field-required-title"
      >
        <h2 id="field-required-title">Native validation</h2>
        <div ng-field id="required-field">
          <label ng-label data-slot="field-label" for="required-email"
            >Email</label
          >
          <input
            data-input
            id="required-email"
            type="email"
            required
            ng-model="state.requiredEmail"
          />
        </div>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="field-dynamic-title"
      >
        <h2 id="field-dynamic-title">Conditional control</h2>
        <div ng-field id="dynamic-field">
          <label ng-label data-slot="field-label" for="dynamic-email"
            >Team email</label
          >
          <p data-slot="field-description">Use the address for your team.</p>
          <input
            ng-if="state.dynamicVisible"
            data-input
            id="dynamic-email"
            type="email"
            required
          />
        </div>
        <button
          ng-button
          variant="outline"
          type="button"
          ng-click="state.dynamicVisible=true"
          ng-disabled="state.dynamicVisible"
        >
          Add email field
        </button>
      </section>
    </form>
  </body>
</html>
