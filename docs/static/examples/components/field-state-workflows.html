<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="state={requiredEmail:'',dynamicVisible:false}"
  >
    <form class="component-state-grid" aria-label="Field state contracts">
      <section
        class="component-state-section"
        aria-labelledby="field-messages-title"
      >
        <h2 id="field-messages-title">Messages</h2>
        <fieldset ng-field id="message-field">
          <label for="message-control"
             class="field-label label">Name</label>
          <input id="message-control" class="input" />
          <p class="field-description">Use your public display name.</p>
          <p class="field-error">The display name is already in use.</p>
        </fieldset>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="field-invalid-title"
      >
        <h2 id="field-invalid-title">Invalid state</h2>
        <fieldset ng-field id="explicit-invalid-field">
          <label


            for="explicit-invalid-control"
           class="field-label label">
            Workspace
          </label>
          <input id="explicit-invalid-control" aria-invalid="true" class="input" />
        </fieldset>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="field-required-title"
      >
        <h2 id="field-required-title">Native validation</h2>
        <fieldset ng-field id="required-field">
          <label for="required-email"
             class="field-label label">Email</label>
          <input

            id="required-email"
            type="email"
            required
            ng-model="state.requiredEmail" class="input" />
        </fieldset>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="field-dynamic-title"
      >
        <h2 id="field-dynamic-title">Conditional control</h2>
        <fieldset ng-field id="dynamic-field">
          <label for="dynamic-email"
             class="field-label label">Team email</label>
          <p class="field-description">Use the address for your team.</p>
          <input
            ng-if="state.dynamicVisible"

            id="dynamic-email"
            type="email"
            required class="input" />
        </fieldset>
        <button

          variant="outline"
          type="button"
          ng-click="state.dynamicVisible=true"
          ng-disabled="state.dynamicVisible" class="button">
          Add email field
        </button>
      </section>
    </form>
  </body>
</html>
