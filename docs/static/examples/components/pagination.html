<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak data-example="pagination-demo">
    <main class="pagination-demo visual-example">
      <nav ng-pagination aria-label="pagination">
        <ul data-slot="pagination-content">
          <li data-slot="pagination-item">
            <a
              data-slot="pagination-previous"
              href="#previous"
              aria-label="Go to previous page"
            >
              <svg
                data-icon="inline-start"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m15 18-6-6 6-6"></path>
              </svg>
              <span class="pagination-previous-text">Previous</span>
            </a>
          </li>
          <li data-slot="pagination-item">
            <a data-slot="pagination-link" href="#page-1">1</a>
          </li>
          <li data-slot="pagination-item">
            <a data-slot="pagination-link" href="#page-2" aria-current="page"
              >2</a
            >
          </li>
          <li data-slot="pagination-item">
            <a data-slot="pagination-link" href="#page-3">3</a>
          </li>
          <li data-slot="pagination-item">
            <span data-slot="pagination-ellipsis">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="5" cy="12" r="1.5"></circle>
                <circle cx="12" cy="12" r="1.5"></circle>
                <circle cx="19" cy="12" r="1.5"></circle>
              </svg>
              <span class="pagination-sr-only">More pages</span>
            </span>
          </li>
          <li data-slot="pagination-item">
            <a
              data-slot="pagination-next"
              href="#next"
              aria-label="Go to next page"
            >
              <span class="pagination-next-text">Next</span>
              <svg
                data-icon="inline-end"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
