<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="input-otp-example-body"
    ng-init="otp={a:'1',b:'2',c:'3',d:'4',e:'5',f:'6'}"
    data-example="input-otp-demo"
  >
    <div
      ng-input-otp
      class="input-otp-demo visual-example"
      aria-label="One-time password"
    >
      <div data-slot="input-otp-group">
        <span data-slot="input-otp-slot"
          ><input id="otp-1" ng-model="otp.a" maxlength="1"
        /></span>
        <span data-slot="input-otp-slot"
          ><input ng-model="otp.b" maxlength="1"
        /></span>
        <span data-slot="input-otp-slot"
          ><input ng-model="otp.c" maxlength="1"
        /></span>
        <span data-slot="input-otp-slot"
          ><input ng-model="otp.d" maxlength="1"
        /></span>
        <span data-slot="input-otp-slot"
          ><input ng-model="otp.e" maxlength="1"
        /></span>
        <span data-slot="input-otp-slot"
          ><input ng-model="otp.f" maxlength="1"
        /></span>
      </div>
    </div>
    <p class="visually-hidden" role="status" aria-live="polite">
      Code: {{ otp.a + otp.b + otp.c + otp.d + otp.e + otp.f }}
    </p>
  </body>
</html>
