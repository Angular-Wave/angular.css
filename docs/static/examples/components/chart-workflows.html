<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="chartData=[{month:'January',short:'Jan',desktop:186,mobile:80,d:'61%',m:'26%'},{month:'February',short:'Feb',desktop:305,mobile:200,d:'100%',m:'66%'},{month:'March',short:'Mar',desktop:237,mobile:120,d:'78%',m:'39%'},{month:'April',short:'Apr',desktop:73,mobile:190,d:'24%',m:'62%'},{month:'May',short:'May',desktop:209,mobile:130,d:'69%',m:'43%'},{month:'June',short:'Jun',desktop:214,mobile:140,d:'70%',m:'46%'}]; tooltip={visible:false}; legendTip={visible:false}"
    data-example="chart-example-grid chart-example-axis chart-example-tooltip chart-example-legend"
  >
    <main class="chart-workflow-grid" aria-label="Chart composition workflows">
      <section class="chart-workflow" aria-labelledby="chart-grid-heading">
        <h2 id="chart-grid-heading">Grid</h2>
        <figure

          class="chart-reference-demo chart"
          aria-label="Visitor chart with horizontal grid"
        >
          <div class="chart-plot">
            <div class="chart-grid"></div>
            <div class="chart-bar-groups">
              <div ng-repeat="point in chartData" class="chart-bar-group">
                <span

                  data-label="{{ point.month }} desktop"
                  data-value="{{ point.d }}"
                  data-color="#2563eb"
                 class="chart-bar"></span>
                <span

                  data-label="{{ point.month }} mobile"
                  data-value="{{ point.m }}"
                  data-color="#60a5fa"
                 class="chart-bar"></span>
              </div>
            </div>
          </div>
        </figure>
      </section>

      <section class="chart-workflow" aria-labelledby="chart-axis-heading">
        <h2 id="chart-axis-heading">Axis</h2>
        <figure

          class="chart-reference-demo chart"
          aria-label="Visitor chart with horizontal axis"
        >
          <div class="chart-plot">
            <div class="chart-grid"></div>
            <div class="chart-bar-groups">
              <div ng-repeat="point in chartData" class="chart-bar-group">
                <span

                  data-label="{{ point.month }} desktop"
                  data-value="{{ point.d }}"
                  data-color="#2563eb"
                 class="chart-bar"></span>
                <span

                  data-label="{{ point.month }} mobile"
                  data-value="{{ point.m }}"
                  data-color="#60a5fa"
                 class="chart-bar"></span>
              </div>
            </div>
          </div>
          <div class="chart-axis">
            <span ng-repeat="point in chartData"
               class="chart-axis-item">{{ point.short }}</span>
          </div>
        </figure>
      </section>

      <section class="chart-workflow" aria-labelledby="chart-tooltip-heading">
        <h2 id="chart-tooltip-heading">Tooltip</h2>
        <figure

          class="chart-reference-demo chart"
          aria-label="Visitor chart with tooltip"
        >
          <div class="chart-plot">
            <div class="chart-grid"></div>
            <div class="chart-bar-groups">
              <div

                ng-repeat="point in chartData"
                ng-mouseenter="tooltip.visible=true;tooltip.month=point.month;tooltip.desktop=point.desktop;tooltip.mobile=point.mobile"
                ng-mouseleave="tooltip.visible=false"
               class="chart-bar-group">
                <span

                  data-label="{{ point.month }} desktop"
                  data-value="{{ point.d }}"
                  data-color="#2563eb"
                 class="chart-bar"></span>
                <span

                  data-label="{{ point.month }} mobile"
                  data-value="{{ point.m }}"
                  data-color="#60a5fa"
                 class="chart-bar"></span>
              </div>
            </div>
            <output

              class="chart-floating-tooltip chart-tooltip"
              ng-if="tooltip.visible"

            >
              <strong
                 class="chart-tooltip-label">{{ tooltip.month }}</strong>
              <div class="chart-tooltip-items">
                <div class="chart-tooltip-item">
                  <span

                    data-color="#2563eb"
                   class="chart-tooltip-indicator"></span><span class="chart-tooltip-name">Desktop</span><span
                     class="chart-tooltip-value">{{ tooltip.desktop }}</span>
                </div>
                <div class="chart-tooltip-item">
                  <span

                    data-color="#60a5fa"
                   class="chart-tooltip-indicator"></span><span class="chart-tooltip-name">Mobile</span><span
                     class="chart-tooltip-value">{{ tooltip.mobile }}</span>
                </div>
              </div>
            </output>
          </div>
          <div class="chart-axis">
            <span ng-repeat="point in chartData"
               class="chart-axis-item">{{ point.short }}</span>
          </div>
        </figure>
      </section>

      <section class="chart-workflow" aria-labelledby="chart-legend-heading">
        <h2 id="chart-legend-heading">Legend</h2>
        <figure

          class="chart-reference-demo chart"
          aria-label="Visitor chart with legend and tooltip"
        >
          <div class="chart-plot">
            <div class="chart-grid"></div>
            <div class="chart-bar-groups">
              <div

                ng-repeat="point in chartData"
                ng-mouseenter="legendTip.visible=true;legendTip.month=point.month;legendTip.desktop=point.desktop;legendTip.mobile=point.mobile"
                ng-mouseleave="legendTip.visible=false"
               class="chart-bar-group">
                <span

                  data-label="{{ point.month }} desktop"
                  data-value="{{ point.d }}"
                  data-color="#2563eb"
                 class="chart-bar"></span>
                <span

                  data-label="{{ point.month }} mobile"
                  data-value="{{ point.m }}"
                  data-color="#60a5fa"
                 class="chart-bar"></span>
              </div>
            </div>
            <output

              class="chart-floating-tooltip chart-tooltip"
              ng-if="legendTip.visible"

            >
              <strong
                 class="chart-tooltip-label">{{ legendTip.month }}</strong>
              <div class="chart-tooltip-items">
                <div class="chart-tooltip-item">
                  <span

                    data-color="#2563eb"
                   class="chart-tooltip-indicator"></span><span class="chart-tooltip-name">Desktop</span><span
                     class="chart-tooltip-value">{{ legendTip.desktop }}</span>
                </div>
                <div class="chart-tooltip-item">
                  <span

                    data-color="#60a5fa"
                   class="chart-tooltip-indicator"></span><span class="chart-tooltip-name">Mobile</span><span
                     class="chart-tooltip-value">{{ legendTip.mobile }}</span>
                </div>
              </div>
            </output>
          </div>
          <div class="chart-axis">
            <span ng-repeat="point in chartData"
               class="chart-axis-item">{{ point.short }}</span>
          </div>
          <ul class="chart-legend">
            <li
               class="chart-legend-item"><span data-color="#2563eb" class="chart-swatch"></span>Desktop</li>
            <li
               class="chart-legend-item"><span data-color="#60a5fa" class="chart-swatch"></span>Mobile</li>
          </ul>
        </figure>
      </section>
    </main>
  </body>
</html>
