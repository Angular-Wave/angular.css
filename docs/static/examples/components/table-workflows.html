<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="invoices=[{id:'INV001',status:'Paid',method:'Credit Card',amount:'$250.00'},{id:'INV002',status:'Pending',method:'PayPal',amount:'$150.00'},{id:'INV003',status:'Unpaid',method:'Bank Transfer',amount:'$350.00'},{id:'INV004',status:'Paid',method:'Credit Card',amount:'$450.00'},{id:'INV005',status:'Paid',method:'PayPal',amount:'$550.00'},{id:'INV006',status:'Pending',method:'Bank Transfer',amount:'$200.00'},{id:'INV007',status:'Unpaid',method:'Credit Card',amount:'$300.00'}];products=[{name:'Wireless Mouse',price:'$29.99'},{name:'Mechanical Keyboard',price:'$129.99'},{name:'USB-C Hub',price:'$49.99'}];payments=[{id:'m5gr84i9',amount:'$316.00',status:'success',statusAr:'ناجح',email:'ken99@example.com',selected:false},{id:'3u1reuv4',amount:'$242.00',status:'success',statusAr:'ناجح',email:'Abe45@example.com',selected:false},{id:'derv1ws0',amount:'$837.00',status:'processing',statusAr:'قيد المعالجة',email:'Monserrat44@example.com',selected:false},{id:'5kma53ae',amount:'$874.00',status:'success',statusAr:'ناجح',email:'Silas22@example.com',selected:false},{id:'bhqecj4p',amount:'$721.00',status:'failed',statusAr:'فشل',email:'carmella@example.com',selected:false}];dataState={query:'',order:'email',all:false,selected:0,showStatus:true,showEmail:true,showAmount:true};rtlDataState={query:'',order:'email',all:false,showStatus:true,showEmail:true,showAmount:true};tableState={action:'Ready'}"
  >
    <main class="table-workflow-grid" aria-label="Table workflows">
      <section
        class="table-workflow table-workflow-wide"
        data-example="table-demo table-footer"
        aria-label="Recent invoices"
      >
        <figure class="table-container">
          <table class="table">
            <caption class="table-caption">
              A list of your recent invoices.
            </caption>
            <thead class="table-header">
              <tr class="table-row">
                <th class="table-head">Invoice</th>
                <th class="table-head">Status</th>
                <th class="table-head">Method</th>
                <th class="text-right table-head">Amount</th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr ng-repeat="invoice in invoices" animate class="table-row">
                <th class="table-cell">{{ invoice.id }}</th>
                <td class="table-cell">{{ invoice.status }}</td>
                <td class="table-cell">{{ invoice.method }}</td>
                <td class="text-right table-cell">{{ invoice.amount }}</td>
              </tr>
            </tbody>
            <tfoot class="table-footer">
              <tr class="table-row">
                <td colspan="3" class="table-cell">Total</td>
                <td class="text-right table-cell">$2,500.00</td>
              </tr>
            </tfoot>
          </table>
        </figure>
      </section>

      <section
        class="table-workflow table-actions-example"
        data-example="table-actions"
        aria-label="Product actions"
      >
        <figure class="table-container">
          <table class="table">
            <thead class="table-header">
              <tr class="table-row">
                <th class="table-head">Product</th>
                <th class="table-head">Price</th>
                <th class="text-right table-head">Actions</th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr ng-repeat="product in products" animate class="table-row">
                <th class="table-cell">{{ product.name }}</th>
                <td class="table-cell">{{ product.price }}</td>
                <td class="text-right table-cell">
                  <div ng-dropdown class="table-action-menu dropdown-menu">
                    <button
                      variant="ghost"
                      size="icon-xs"
                      type="button"
                      aria-label="Open menu for {{ product.name }}"
                      class="dropdown-menu-trigger button"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="5" cy="12" r="1"></circle>
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="19" cy="12" r="1"></circle>
                      </svg>
                    </button>
                    <menu class="dropdown-menu-content">
                      <button
                        ng-click="tableState.action='Edit '+product.name"
                        class="dropdown-menu-item"
                      >
                        Edit
                      </button>
                      <button
                        ng-click="tableState.action='Duplicate '+product.name"
                        class="dropdown-menu-item"
                      >
                        Duplicate
                      </button>
                      <hr class="dropdown-menu-separator" />
                      <button
                        data-variant="destructive"
                        ng-click="tableState.action='Delete '+product.name"
                        class="dropdown-menu-item"
                      >
                        Delete
                      </button>
                    </menu>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </figure>
      </section>

      <section
        class="table-workflow"
        data-example="table-rtl"
        aria-label="جدول الفواتير"
        dir="rtl"
        lang="ar"
      >
        <figure class="table-container">
          <table class="table">
            <caption class="table-caption">
              قائمة بفواتيرك الأخيرة.
            </caption>
            <thead class="table-header">
              <tr class="table-row">
                <th class="table-head">الفاتورة</th>
                <th class="table-head">الحالة</th>
                <th class="table-head">الطريقة</th>
                <th class="text-start table-head">المبلغ</th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr class="table-row">
                <th class="table-cell">INV001</th>
                <td class="table-cell">مدفوع</td>
                <td class="table-cell">بطاقة ائتمانية</td>
                <td class="table-cell">$250.00</td>
              </tr>
              <tr class="table-row">
                <th class="table-cell">INV002</th>
                <td class="table-cell">قيد الانتظار</td>
                <td class="table-cell">PayPal</td>
                <td class="table-cell">$150.00</td>
              </tr>
              <tr class="table-row">
                <th class="table-cell">INV003</th>
                <td class="table-cell">غير مدفوع</td>
                <td class="table-cell">تحويل بنكي</td>
                <td class="table-cell">$350.00</td>
              </tr>
            </tbody>
            <tfoot class="table-footer">
              <tr class="table-row">
                <td colspan="3" class="table-cell">المجموع</td>
                <td class="table-cell">$2,500.00</td>
              </tr>
            </tfoot>
          </table>
        </figure>
      </section>

      <section
        class="table-workflow table-workflow-wide"
        data-example="data-table-demo"
        aria-label="Payments data table"
      >
        <div class="data-table-toolbar">
          <input
            ng-model="dataState.query"
            placeholder="Filter emails..."
            aria-label="Filter payment emails"
            class="input"
          />
          <div ng-dropdown class="dropdown-menu">
            <button
              variant="outline"
              type="button"
              class="dropdown-menu-trigger button"
            >
              Columns <span aria-hidden="true">⌄</span>
            </button>
            <menu class="data-table-column-menu dropdown-menu-content">
              <button
                aria-checked="{{ dataState.showStatus }}"
                ng-click="dataState.showStatus=!dataState.showStatus"
                class="dropdown-menu-checkbox-item"
              >
                <span
                  ng-if="dataState.showStatus"
                  class="dropdown-menu-checkbox-item-indicator"
                  >✓</span
                >Status
              </button>
              <button
                aria-checked="{{ dataState.showEmail }}"
                ng-click="dataState.showEmail=!dataState.showEmail"
                class="dropdown-menu-checkbox-item"
              >
                <span
                  ng-if="dataState.showEmail"
                  class="dropdown-menu-checkbox-item-indicator"
                  >✓</span
                >Email
              </button>
              <button
                aria-checked="{{ dataState.showAmount }}"
                ng-click="dataState.showAmount=!dataState.showAmount"
                class="dropdown-menu-checkbox-item"
              >
                <span
                  ng-if="dataState.showAmount"
                  class="dropdown-menu-checkbox-item-indicator"
                  >✓</span
                >Amount
              </button>
            </menu>
          </div>
        </div>
        <figure class="data-table-frame table-container">
          <table class="table">
            <thead class="table-header">
              <tr class="table-row">
                <th class="data-table-select table-head">
                  <input
                    type="checkbox"
                    ng-model="dataState.all"
                    ng-change="payments[0].selected=dataState.all;payments[1].selected=dataState.all;payments[2].selected=dataState.all;payments[3].selected=dataState.all;payments[4].selected=dataState.all"
                    aria-label="Select all payments"
                    class="checkbox"
                  />
                </th>
                <th ng-if="dataState.showStatus" class="table-head">Status</th>
                <th ng-if="dataState.showEmail" class="table-head">
                  <button
                    variant="ghost"
                    type="button"
                    ng-click="dataState.order=dataState.order==='email' ? '-email' : 'email'"
                    class="button"
                  >
                    Email <span aria-hidden="true">↕</span>
                  </button>
                </th>
                <th ng-if="dataState.showAmount" class="text-right table-head">
                  Amount
                </th>
                <th class="table-head">
                  <span class="visually-hidden">Actions</span>
                </th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr
                ng-repeat="payment in payments | filter:dataState.query | orderBy:dataState.order"
                animate
                data-state="{{ payment.selected ? 'selected' : '' }}"
                class="table-row"
              >
                <td class="data-table-select table-cell">
                  <input
                    type="checkbox"
                    ng-model="payment.selected"
                    ng-change="dataState.selected=payment.selected ? 1 : 0"
                    aria-label="Select {{ payment.email }}"
                    class="checkbox"
                  />
                </td>
                <td ng-if="dataState.showStatus" class="capitalize table-cell">
                  {{ payment.status }}
                </td>
                <td ng-if="dataState.showEmail" class="lowercase table-cell">
                  {{ payment.email }}
                </td>
                <td
                  ng-if="dataState.showAmount"
                  class="text-right table-cell-medium table-cell"
                >
                  {{ payment.amount }}
                </td>
                <td class="text-right table-cell">
                  <button
                    variant="ghost"
                    size="icon-xs"
                    type="button"
                    ng-click="tableState.action='Open '+payment.id"
                    aria-label="Open menu for {{ payment.email }}"
                    class="button"
                  >
                    •••
                  </button>
                </td>
              </tr>
              <tr
                ng-if="!(payments | filter:dataState.query).length"
                animate
                class="table-row"
              >
                <td colspan="5" class="data-table-empty table-cell">
                  No results.
                </td>
              </tr>
            </tbody>
          </table>
        </figure>
        <div class="data-table-footer">
          <p>{{ dataState.selected }} of 5 row(s) selected.</p>
          <div class="row">
            <button
              variant="outline"
              size="sm"
              type="button"
              disabled
              class="button"
            >
              Previous</button
            ><button
              variant="outline"
              size="sm"
              type="button"
              disabled
              class="button"
            >
              Next
            </button>
          </div>
        </div>
      </section>

      <section
        class="table-workflow table-workflow-wide"
        data-example="data-table-rtl"
        aria-label="جدول بيانات المدفوعات"
        dir="rtl"
        lang="ar"
        ng-init="rtlPayments=[{amount:'$316.00',statusAr:'ناجح',email:'ken99@example.com',selected:false},{amount:'$242.00',statusAr:'ناجح',email:'Abe45@example.com',selected:false},{amount:'$837.00',statusAr:'قيد المعالجة',email:'Monserrat44@example.com',selected:false},{amount:'$874.00',statusAr:'ناجح',email:'Silas22@example.com',selected:false},{amount:'$721.00',statusAr:'فشل',email:'carmella@example.com',selected:false}]"
      >
        <div class="data-table-toolbar">
          <input
            ng-model="rtlDataState.query"
            placeholder="تصفية البريد الإلكتروني..."
            aria-label="تصفية البريد الإلكتروني"
            class="input"
          />
          <div ng-dropdown class="dropdown-menu">
            <button
              variant="outline"
              type="button"
              class="dropdown-menu-trigger button"
            >
              الأعمدة <span aria-hidden="true">⌄</span>
            </button>
            <menu class="dropdown-menu-content">
              <button
                aria-checked="{{ rtlDataState.showStatus }}"
                ng-click="rtlDataState.showStatus=!rtlDataState.showStatus"
                class="dropdown-menu-checkbox-item"
              >
                <span class="dropdown-menu-checkbox-item-indicator">✓</span
                >الحالة</button
              ><button
                aria-checked="{{ rtlDataState.showEmail }}"
                ng-click="rtlDataState.showEmail=!rtlDataState.showEmail"
                class="dropdown-menu-checkbox-item"
              >
                <span class="dropdown-menu-checkbox-item-indicator">✓</span
                >البريد الإلكتروني</button
              ><button
                aria-checked="{{ rtlDataState.showAmount }}"
                ng-click="rtlDataState.showAmount=!rtlDataState.showAmount"
                class="dropdown-menu-checkbox-item"
              >
                <span class="dropdown-menu-checkbox-item-indicator">✓</span
                >المبلغ
              </button>
            </menu>
          </div>
        </div>
        <figure class="data-table-frame table-container">
          <table class="table">
            <thead class="table-header">
              <tr class="table-row">
                <th class="data-table-select table-head">
                  <input
                    type="checkbox"
                    ng-model="rtlDataState.all"
                    aria-label="تحديد الكل"
                    class="checkbox"
                  />
                </th>
                <th ng-if="rtlDataState.showStatus" class="table-head">
                  الحالة
                </th>
                <th ng-if="rtlDataState.showEmail" class="table-head">
                  <button
                    variant="ghost"
                    type="button"
                    ng-click="rtlDataState.order=rtlDataState.order==='email' ? '-email' : 'email'"
                    class="button"
                  >
                    البريد الإلكتروني <span aria-hidden="true">↕</span>
                  </button>
                </th>
                <th ng-if="rtlDataState.showAmount" class="table-head">
                  المبلغ
                </th>
                <th class="table-head">
                  <span class="visually-hidden">الإجراءات</span>
                </th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr
                ng-repeat="payment in rtlPayments | filter:rtlDataState.query | orderBy:rtlDataState.order"
                animate
                class="table-row"
              >
                <td class="data-table-select table-cell">
                  <input
                    type="checkbox"
                    ng-model="payment.selected"
                    aria-label="تحديد {{ payment.email }}"
                    class="checkbox"
                  />
                </td>
                <td ng-if="rtlDataState.showStatus" class="table-cell">
                  {{ payment.statusAr }}
                </td>
                <td ng-if="rtlDataState.showEmail" class="lowercase table-cell">
                  {{ payment.email }}
                </td>
                <td
                  ng-if="rtlDataState.showAmount"
                  class="table-cell-medium table-cell"
                >
                  {{ payment.amount }}
                </td>
                <td class="table-cell">
                  <button
                    variant="ghost"
                    size="icon-xs"
                    type="button"
                    aria-label="فتح القائمة"
                    class="button"
                  >
                    •••
                  </button>
                </td>
              </tr>
              <tr
                ng-if="!(rtlPayments | filter:rtlDataState.query).length"
                animate
                class="table-row"
              >
                <td colspan="5" class="data-table-empty table-cell">
                  لا توجد نتائج.
                </td>
              </tr>
            </tbody>
          </table>
        </figure>
        <div class="data-table-footer">
          <p>0 من 5 صف(وف) محدد.</p>
          <div class="row">
            <button
              variant="outline"
              size="sm"
              type="button"
              disabled
              class="button"
            >
              السابق</button
            ><button
              variant="outline"
              size="sm"
              type="button"
              disabled
              class="button"
            >
              التالي
            </button>
          </div>
        </div>
      </section>
      <output class="table-workflow-output">{{ tableState.action }}</output>
    </main>
  </body>
</html>
