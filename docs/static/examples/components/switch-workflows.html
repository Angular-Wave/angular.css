<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="small=false; standard=false; share=false; notifications=true; focus=false; terms=false"
    data-example="switch-choice-card switch-description switch-disabled switch-invalid switch-rtl switch-sizes"
  >
    <main class="switch-workflows">
      <section class="switch-workflow-section" aria-label="Switch sizes">
        <div class="switch-size-list field-group">
          <fieldset orientation="horizontal" class="field">
            <input
              id="switch-size-sm"
              type="checkbox"
              size="sm"
              ng-model="small"
              class="switch"
            />
            <label for="switch-size-sm" class="label">Small</label>
          </fieldset>
          <fieldset orientation="horizontal" class="field">
            <input
              id="switch-size-default"
              type="checkbox"
              size="default"
              ng-model="standard"
              class="switch"
            />
            <label for="switch-size-default" class="label">Default</label>
          </fieldset>
        </div>
      </section>

      <section class="switch-workflow-section" aria-label="Disabled switch">
        <fieldset orientation="horizontal" data-disabled="true" class="field">
          <input
            id="switch-disabled-unchecked"
            type="checkbox"
            disabled
            class="switch"
          />
          <label for="switch-disabled-unchecked" class="label">Disabled</label>
        </fieldset>
      </section>

      <section class="switch-workflow-section" aria-label="Switch description">
        <fieldset orientation="horizontal" class="field">
          <div class="field-content">
            <label for="switch-focus-mode" class="label"
              >Share across devices</label
            >
            <p class="field-description">
              Focus is shared across devices, and turns off when you leave the
              app.
            </p>
          </div>
          <input
            id="switch-focus-mode"
            type="checkbox"
            ng-model="focus"
            class="switch"
          />
        </fieldset>
      </section>

      <section class="switch-workflow-section" aria-label="Invalid switch">
        <fieldset orientation="horizontal" data-invalid="true" class="field">
          <div class="field-content">
            <label for="switch-terms" class="label">
              Accept terms and conditions
            </label>
            <p class="field-description">
              You must accept the terms and conditions to continue.
            </p>
          </div>
          <input
            id="switch-terms"
            type="checkbox"
            aria-invalid="true"
            ng-model="terms"
            class="switch"
          />
        </fieldset>
      </section>

      <section
        class="switch-workflow-section switch-workflow-wide"
        aria-label="Switch choice cards"
      >
        <div class="switch-choice-list field-group">
          <label for="switch-share" class="switch-choice label">
            <fieldset orientation="horizontal" class="field">
              <span class="field-content">
                <span class="field-title">Share across devices</span>
                <span class="field-description">
                  Focus is shared across devices, and turns off when you leave
                  the app.
                </span>
              </span>
              <input
                id="switch-share"
                type="checkbox"
                ng-model="share"
                class="switch"
              />
            </fieldset>
          </label>
          <label for="switch-notifications" class="switch-choice label">
            <fieldset orientation="horizontal" class="field">
              <span class="field-content">
                <span class="field-title">Enable notifications</span>
                <span class="field-description">
                  Receive notifications when focus mode is enabled or disabled.
                </span>
              </span>
              <input
                id="switch-notifications"
                type="checkbox"
                ng-model="notifications"
                class="switch"
              />
            </fieldset>
          </label>
        </div>
      </section>

      <section
        class="switch-workflow-section switch-workflow-wide"
        aria-label="RTL switch"
        dir="rtl"
        lang="ar"
      >
        <fieldset orientation="horizontal" class="field">
          <div class="field-content">
            <label for="switch-focus-mode-rtl" class="label">
              المشاركة عبر الأجهزة
            </label>
            <p class="field-description">
              يتم مشاركة التركيز عبر الأجهزة، ويتم إيقاف تشغيله عند مغادرة
              التطبيق.
            </p>
          </div>
          <input
            id="switch-focus-mode-rtl"
            type="checkbox"
            dir="rtl"
            class="switch"
          />
        </fieldset>
      </section>
    </main>
  </body>
</html>
