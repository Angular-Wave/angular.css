<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    class="input-otp-composition-body"
    ng-init="verify={a:'',b:'',c:'',d:'',e:'',f:'',submitted:false};resends=0"
    data-example="input-otp-form"
  >
    <form

      class="input-otp-form-card visual-example card"
      ng-submit="verify.submitted=true"
    >
      <header class="card-header">
        <h2 class="card-title">Verify your login</h2>
        <p class="card-description">
          Enter the verification code we sent to your email address:
          <strong>m@example.com</strong>.
        </p>
      </header>
      <section class="card-content">
        <div class="input-otp-form-field field">
          <div class="input-otp-form-label-row">
            <label for="verify-otp-1"
               class="field-label label">Verification code</label>
            <button

              variant="outline"
              size="xs"
              type="button"
              ng-click="resends=resends+1" class="button">
              <svg
                data-icon="inline-start"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5m-5 4a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"
                />
              </svg>
              Resend Code
            </button>
          </div>
          <fieldset
            ng-input-otp
            class="input-otp-large input-otp"
            aria-label="Verification code"
          >
            <div class="input-otp-group">
              <span
                 class="input-otp-slot"><input id="verify-otp-1" ng-model="verify.a" /></span><span
                 class="input-otp-slot"><input ng-model="verify.b" /></span><span
                 class="input-otp-slot"><input ng-model="verify.c" /></span>
            </div>
            <span
               class="input-otp-separator"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14" /></svg></span>
            <div class="input-otp-group">
              <span
                 class="input-otp-slot"><input ng-model="verify.d" /></span><span
                 class="input-otp-slot"><input ng-model="verify.e" /></span><span
                 class="input-otp-slot"><input ng-model="verify.f" /></span>
            </div>
          </fieldset>
          <p class="field-description">
            <a href="#">I no longer have access to this email address.</a>
          </p>
        </div>
      </section>
      <footer class="input-otp-form-footer card-footer">
        <div class="field">
          <button type="submit" class="input-otp-verify-button button">
            Verify
          </button>
          <p class="input-otp-support">
            Having trouble signing in? <a href="#">Contact support</a>
          </p>
        </div>
      </footer>
      <output class="visually-hidden" aria-live="polite">
        {{ verify.submitted ? 'Verification submitted' : (resends ? 'Code resent
        ' + resends + ' time' : '') }}
      </output>
    </form>
  </body>
</html>
