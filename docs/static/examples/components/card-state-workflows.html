<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak>
    <main class="component-state-grid" aria-label="Card state contracts">
      <section
        class="component-state-section"
        aria-labelledby="complete-card-title"
      >
        <h2 id="complete-card-title">Complete card</h2>
        <article ng-card aria-label="Complete card">
          <header data-slot="card-header">
            <h3 data-slot="card-title">Quarterly planning</h3>
            <p data-slot="card-description">Review the agenda before Monday.</p>
            <div data-slot="card-action">
              <button ng-button variant="ghost" size="sm" type="button">
                Edit
              </button>
            </div>
          </header>
          <div data-slot="card-content">Four topics are ready for review.</div>
          <footer data-slot="card-footer">Updated today</footer>
        </article>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="minimal-card-title"
      >
        <h2 id="minimal-card-title">Minimal card</h2>
        <article ng-card aria-label="Minimal card" class="card-minimal-state">
          No optional sections are required.
        </article>
      </section>

      <section
        class="component-state-section"
        aria-labelledby="compact-card-title"
      >
        <h2 id="compact-card-title">Compact card</h2>
        <article ng-card size="sm" aria-label="Compact card">
          <header data-slot="card-header">
            <h3 data-slot="card-title">Storage</h3>
          </header>
          <footer data-slot="card-footer">8.4 GB available</footer>
        </article>
      </section>
    </main>
  </body>
</html>
