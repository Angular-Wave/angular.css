<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="profile={email:'shadcn@example.com',username:'@shadcn'}"
    data-example="drawer-dialog"
  >
    <main class="drawer-dialog-demo visual-example">
      <div class="drawer-dialog-desktop">
        <section id="responsive-profile-dialog" ng-dialog>
          <button variant="outline" class="dialog-trigger button">
            Edit Profile
          </button>
          <div class="dialog-overlay"></div>
          <dialog class="drawer-profile-dialog dialog-content">
            <header class="dialog-header">
              <h2 class="dialog-title">Edit profile</h2>
              <p class="dialog-description">
                Make changes to your profile here. Click save when you're done.
              </p>
            </header>
            <form class="drawer-profile-form">
              <div class="drawer-profile-field">
                <label for="desktop-email" class="label">Email</label>
                <input
                  id="desktop-email"
                  type="email"

                  ng-model="profile.email" class="input" />
              </div>
              <div class="drawer-profile-field">
                <label for="desktop-username" class="label">Username</label>
                <input
                  id="desktop-username"

                  ng-model="profile.username" class="input" />
              </div>
              <button type="submit" data-dialog-close class="button">
                Save changes
              </button>
            </form>
          </dialog>
        </section>
      </div>

      <div class="drawer-dialog-mobile">
        <section id="responsive-profile-drawer" ng-drawer>
          <button variant="outline" class="drawer-trigger button">
            Edit Profile
          </button>
          <div class="drawer-overlay"></div>
          <dialog class="drawer-content">
            <div class="drawer-handle"></div>
            <header class="drawer-header">
              <h2 class="drawer-title">Edit profile</h2>
              <p class="drawer-description">
                Make changes to your profile here. Click save when you're done.
              </p>
            </header>
            <form class="drawer-profile-form drawer-profile-mobile">
              <div class="drawer-profile-field">
                <label for="mobile-email" class="label">Email</label>
                <input
                  id="mobile-email"
                  type="email"

                  ng-model="profile.email" class="input" />
              </div>
              <div class="drawer-profile-field">
                <label for="mobile-username" class="label">Username</label>
                <input
                  id="mobile-username"

                  ng-model="profile.username" class="input" />
              </div>
              <button type="submit" class="button">Save changes</button>
            </form>
            <footer class="drawer-footer">
              <button variant="outline" class="drawer-close button">
                Cancel
              </button>
            </footer>
          </dialog>
        </section>
      </div>
    </main>
  </body>
</html>
