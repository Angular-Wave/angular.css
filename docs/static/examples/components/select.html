<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="fruit=''" data-example="select-demo">
    <div class="select-demo visual-example">
      <div
        ng-select
        data-open="false"
        ng-on-angularcss:select="fruit=$event.detail.value"
      >
        <button

          type="button"
          aria-label="Fruit"
          data-placeholder="{{ fruit === '' }}"
         class="select-trigger">
          <span

            ng-bind="fruit === 'apple' ? 'Apple' : fruit === 'banana' ? 'Banana' : fruit === 'blueberry' ? 'Blueberry' : fruit === 'grapes' ? 'Grapes' : fruit === 'pineapple' ? 'Pineapple' : 'Select a fruit'"
           class="select-value"></span>
        </button>
        <ul class="select-content">
          <div class="select-group">
            <div class="select-label">Fruits</div>
            <li data-value="" aria-selected="true" class="select-item">
              Select a fruit
            </li>
            <li data-value="apple" class="select-item">Apple</li>
            <li data-value="banana" class="select-item">Banana</li>
            <li data-value="blueberry" class="select-item">Blueberry</li>
            <li data-value="grapes" class="select-item">Grapes</li>
            <li data-value="pineapple" class="select-item">Pineapple</li>
          </div>
        </ul>
      </div>
      <output class="output visually-hidden" aria-live="polite">
        Selected: <span ng-bind="fruit || 'none'"></span>
      </output>
    </div>
  </body>
</html>
