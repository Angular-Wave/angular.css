<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
    <script src="../../js/date-picker-demo.umd.js"></script>
  </head>
  <body
    ng-app="datePickerDemo"
    ng-controller="DatePickerDemoController as picker"
    ng-cloak
    data-example="date-picker-basic date-picker-demo date-picker-dob date-picker-input date-picker-natural-language date-picker-range date-picker-rtl date-picker-time"
  >
    <main class="date-picker-grid" aria-label="Date picker workflows">
      <section class="date-picker-workflow">
        <h2>Basic</h2>
        <fieldset ng-field class="date-picker-field-compact">
          <label for="date-picker-basic" class="field-label">Date</label>
          <span ng-popover id="date-picker-basic-popover">
            <button
              id="date-picker-basic"
              type="button"


              variant="outline"
              class="date-picker-trigger popover-trigger button"
            >
              {{ picker.basicDate ? picker.format(picker.basicDate) : 'Pick a
              date' }}
            </button>
            <aside

              side="bottom"
              align="start"
              class="calendar-popover-content popover-content"
              aria-label="Choose a basic date"
            >
              <section
                ng-calendar
                data-calendar-generated
                data-month="2026-09"
                ng-attr-data-value="{{ picker.basicDate }}"
                ng-on-angularcss:calendar-select="picker.selectBasic($event.detail.value)"
              >
                <header class="calendar-header">
                  <button
                    type="button"


                    size="icon"
                    variant="ghost"
                    aria-label="Previous basic month"
                   class="calendar-previous button">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m15 18-6-6 6-6"></path>
                    </svg>
                  </button>
                  <h3 class="calendar-title"></h3>
                  <button
                    type="button"


                    size="icon"
                    variant="ghost"
                    aria-label="Next basic month"
                   class="calendar-next button">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m9 18 6-6-6-6"></path>
                    </svg>
                  </button>
                </header>
                <div class="calendar-grid"></div>
              </section>
            </aside>
          </span>
        </fieldset>
      </section>

      <section class="date-picker-workflow">
        <h2>Demo</h2>
        <span ng-popover id="date-picker-demo-popover">
          <button
            type="button"


            variant="outline"
            class="date-picker-trigger date-picker-trigger-between popover-trigger button"
            ng-attr-data-empty="{{ !picker.demoDate }}"
          >
            <span
              >{{ picker.demoDate ? picker.format(picker.demoDate) : 'Pick a
              date' }}</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <aside

            side="bottom"
            align="start"
            class="calendar-popover-content popover-content"
            aria-label="Choose a demo date"
          >
            <section
              ng-calendar
              data-calendar-generated
              data-month="2026-09"
              ng-attr-data-value="{{ picker.demoDate }}"
              ng-on-angularcss:calendar-select="picker.selectDemo($event.detail.value)"
            >
              <header class="calendar-header">
                <button
                  type="button"


                  size="icon"
                  variant="ghost"
                  aria-label="Previous demo month"
                 class="calendar-previous button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m15 18-6-6 6-6"></path>
                  </svg>
                </button>
                <h3 class="calendar-title"></h3>
                <button
                  type="button"


                  size="icon"
                  variant="ghost"
                  aria-label="Next demo month"
                 class="calendar-next button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m9 18 6-6-6-6"></path>
                  </svg>
                </button>
              </header>
              <div class="calendar-grid"></div>
            </section>
          </aside>
        </span>
      </section>

      <section class="date-picker-workflow">
        <h2>Date of birth</h2>
        <fieldset ng-field class="date-picker-field-compact">
          <label for="date-picker-dob" class="field-label">Date of birth</label>
          <span ng-popover id="date-picker-dob-popover">
            <button
              id="date-picker-dob"
              type="button"


              variant="outline"
              class="date-picker-trigger popover-trigger button"
            >
              {{ picker.dobDate ? picker.format(picker.dobDate) : 'Select date'
              }}
            </button>
            <aside

              side="bottom"
              align="start"
              class="calendar-popover-content popover-content"
              aria-label="Choose a birth date"
            >
              <section
                ng-calendar
                data-calendar-generated
                ng-attr-data-month="{{ picker.month(picker.dobDate) }}"
                ng-attr-data-value="{{ picker.dobDate }}"
                data-caption-layout="dropdown"
                data-start-year="1900"
                data-end-year="2026"
                ng-on-angularcss:calendar-select="picker.selectDob($event.detail.value)"
              >
                <header class="calendar-header">
                  <button
                    type="button"


                    size="icon"
                    variant="ghost"
                    aria-label="Previous birth month"
                   class="calendar-previous button">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m15 18-6-6 6-6"></path>
                    </svg>
                  </button>
                  <h3 class="calendar-title"></h3>
                  <button
                    type="button"


                    size="icon"
                    variant="ghost"
                    aria-label="Next birth month"
                   class="calendar-next button">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m9 18 6-6-6-6"></path>
                    </svg>
                  </button>
                </header>
                <div class="calendar-grid"></div>
              </section>
            </aside>
          </span>
        </fieldset>
      </section>

      <section class="date-picker-workflow">
        <h2>Input</h2>
        <fieldset ng-field class="date-picker-input-field">
          <label for="date-picker-input"
             class="field-label">Subscription Date</label>
          <div ng-input-group class="input-group">
            <input
              id="date-picker-input"


              ng-model="picker.inputValue"
              data-change="picker.updateInput()"
              ng-keydown="picker.openPopover('date-picker-input-popover', $event)"
              placeholder="June 01, 2025"  class="input-group-control input"/>
            <div data-align="inline-end" class="input-group-addon">
              <span ng-popover id="date-picker-input-popover">
                <button
                  type="button"



                  variant="ghost"
                  size="icon-xs"
                  aria-label="Select subscription date"
                 class="input-group-button popover-trigger button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M16 3v4M8 3v4M3 10h18"></path>
                  </svg>
                </button>
                <aside

                  side="bottom"
                  align="end"
                  class="calendar-popover-content popover-content"
                  aria-label="Choose a subscription date"
                >
                  <section
                    ng-calendar
                    data-calendar-generated
                    ng-attr-data-month="{{ picker.month(picker.inputDate) }}"
                    ng-attr-data-value="{{ picker.inputDate }}"
                    ng-on-angularcss:calendar-select="picker.selectInput($event.detail.value)"
                  >
                    <header class="calendar-header">
                      <button
                        type="button"


                        size="icon"
                        variant="ghost"
                        aria-label="Previous subscription month"
                       class="calendar-previous button">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          aria-hidden="true"
                        >
                          <path d="m15 18-6-6 6-6"></path>
                        </svg>
                      </button>
                      <h3 class="calendar-title"></h3>
                      <button
                        type="button"


                        size="icon"
                        variant="ghost"
                        aria-label="Next subscription month"
                       class="calendar-next button">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          aria-hidden="true"
                        >
                          <path d="m9 18 6-6-6-6"></path>
                        </svg>
                      </button>
                    </header>
                    <div class="calendar-grid"></div>
                  </section>
                </aside>
              </span>
            </div>
          </div>
        </fieldset>
      </section>

      <section class="date-picker-workflow date-picker-workflow-wide">
        <h2>Natural language</h2>
        <fieldset ng-field class="date-picker-natural-field">
          <label for="date-picker-natural" class="field-label">Schedule Date</label>
          <div ng-input-group class="input-group">
            <input
              id="date-picker-natural"


              ng-model="picker.naturalValue"
              data-change="picker.updateNatural()"
              ng-keydown="picker.openPopover('date-picker-natural-popover', $event)"
              placeholder="Tomorrow or next week"  class="input-group-control input"/>
            <div data-align="inline-end" class="input-group-addon">
              <span ng-popover id="date-picker-natural-popover">
                <button
                  type="button"



                  variant="ghost"
                  size="icon-xs"
                  aria-label="Select schedule date"
                 class="input-group-button popover-trigger button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M16 3v4M8 3v4M3 10h18"></path>
                  </svg>
                </button>
                <aside

                  side="bottom"
                  align="end"
                  class="calendar-popover-content popover-content"
                  aria-label="Choose a schedule date"
                >
                  <section
                    ng-calendar
                    data-calendar-generated
                    ng-attr-data-month="{{ picker.month(picker.naturalDate) }}"
                    ng-attr-data-value="{{ picker.naturalDate }}"
                    data-caption-layout="dropdown"
                    data-start-year="2024"
                    data-end-year="2028"
                    ng-on-angularcss:calendar-select="picker.selectNatural($event.detail.value)"
                  >
                    <header class="calendar-header">
                      <button
                        type="button"


                        size="icon"
                        variant="ghost"
                        aria-label="Previous schedule month"
                       class="calendar-previous button">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          aria-hidden="true"
                        >
                          <path d="m15 18-6-6 6-6"></path>
                        </svg>
                      </button>
                      <h3 class="calendar-title"></h3>
                      <button
                        type="button"


                        size="icon"
                        variant="ghost"
                        aria-label="Next schedule month"
                       class="calendar-next button">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          aria-hidden="true"
                        >
                          <path d="m9 18 6-6-6-6"></path>
                        </svg>
                      </button>
                    </header>
                    <div class="calendar-grid"></div>
                  </section>
                </aside>
              </span>
            </div>
          </div>
          <p class="calendar-workflow-output">
            Your post will be published on
            <strong>{{ picker.format(picker.naturalDate) }}</strong>.
          </p>
        </fieldset>
      </section>

      <section class="date-picker-workflow date-picker-workflow-wide">
        <h2>Range</h2>
        <fieldset ng-field class="date-picker-range-field">
          <label for="date-picker-range"
             class="field-label">Date Picker Range</label>
          <span ng-popover id="date-picker-range-popover">
            <button
              id="date-picker-range"
              type="button"


              variant="outline"
              class="date-picker-trigger popover-trigger button"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <path d="M16 3v4M8 3v4M3 10h18"></path>
              </svg>
              <span
                >{{ picker.formatShort(picker.rangeStart) }} - {{
                picker.formatShort(picker.rangeEnd) }}</span>
            </button>
            <aside

              side="bottom"
              align="start"
              class="calendar-popover-content popover-content"
              aria-label="Choose a date range"
            >
              <section
                ng-calendar
                data-calendar-generated
                ng-attr-data-month="{{ picker.month(picker.rangeStart) }}"
                data-number-of-months="2"
                data-selection-mode="range"
                ng-attr-data-range-start-value="{{ picker.rangeStart }}"
                ng-attr-data-range-end-value="{{ picker.rangeEnd }}"
                ng-on-angularcss:calendar-select="picker.selectRange($event.detail.range)"
              >
                <header class="calendar-header">
                  <button
                    type="button"


                    size="icon"
                    variant="ghost"
                    aria-label="Previous range month"
                   class="calendar-previous button">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m15 18-6-6 6-6"></path>
                    </svg>
                  </button>
                  <h3 class="calendar-title"></h3>
                  <button
                    type="button"


                    size="icon"
                    variant="ghost"
                    aria-label="Next range month"
                   class="calendar-next button">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m9 18 6-6-6-6"></path>
                    </svg>
                  </button>
                </header>
                <div class="calendar-grid"></div>
              </section>
            </aside>
          </span>
        </fieldset>
      </section>

      <section class="date-picker-workflow" dir="rtl" lang="ar">
        <h2>من اليمين إلى اليسار</h2>
        <span ng-popover id="date-picker-rtl-popover">
          <button
            type="button"


            variant="outline"
            class="date-picker-trigger date-picker-trigger-between popover-trigger button"
            ng-attr-data-empty="{{ !picker.rtlDate }}"
          >
            <span
              >{{ picker.rtlDate ? picker.formatRtl(picker.rtlDate) : 'اختر
              تاريخًا' }}</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <aside

            side="bottom"
            align="start"
            class="calendar-popover-content popover-content"
            aria-label="اختر تاريخًا"
          >
            <section
              ng-calendar
              data-calendar-generated
              data-month="2026-09"
              ng-attr-data-value="{{ picker.rtlDate }}"
              ng-on-angularcss:calendar-select="picker.selectRtl($event.detail.value)"
            >
              <header class="calendar-header">
                <button
                  type="button"


                  size="icon"
                  variant="ghost"
                  aria-label="الشهر السابق"
                 class="calendar-previous button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m15 18-6-6 6-6"></path>
                  </svg>
                </button>
                <h3 class="calendar-title"></h3>
                <button
                  type="button"


                  size="icon"
                  variant="ghost"
                  aria-label="الشهر التالي"
                 class="calendar-next button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m9 18 6-6-6-6"></path>
                  </svg>
                </button>
              </header>
              <div class="calendar-grid"></div>
            </section>
          </aside>
        </span>
      </section>

      <section
        class="date-picker-workflow date-picker-workflow-wide date-picker-workflow-time"
      >
        <h2>Date and time</h2>
        <div class="date-picker-time-fields">
          <fieldset ng-field>
            <label for="date-picker-time-date" class="field-label">Date</label>
            <span ng-popover id="date-picker-time-popover">
              <button
                id="date-picker-time-date"
                type="button"


                variant="outline"
                class="date-picker-trigger date-picker-trigger-between popover-trigger button"
              >
                <span
                  >{{ picker.timeDate ? picker.formatShort(picker.timeDate) :
                  'Select date' }}</span>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </button>
              <aside

                side="bottom"
                align="start"
                class="calendar-popover-content popover-content"
                aria-label="Choose an appointment date"
              >
                <section
                  ng-calendar
                  data-calendar-generated
                  ng-attr-data-month="{{ picker.month(picker.timeDate) }}"
                  ng-attr-data-value="{{ picker.timeDate }}"
                  data-caption-layout="dropdown"
                  data-start-year="2024"
                  data-end-year="2028"
                  ng-on-angularcss:calendar-select="picker.selectTimeDate($event.detail.value)"
                >
                  <header class="calendar-header">
                    <button
                      type="button"


                      size="icon"
                      variant="ghost"
                      aria-label="Previous appointment month"
                     class="calendar-previous button">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                      >
                        <path d="m15 18-6-6 6-6"></path>
                      </svg>
                    </button>
                    <h3 class="calendar-title"></h3>
                    <button
                      type="button"


                      size="icon"
                      variant="ghost"
                      aria-label="Next appointment month"
                     class="calendar-next button">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                      >
                        <path d="m9 18 6-6-6-6"></path>
                      </svg>
                    </button>
                  </header>
                  <div class="calendar-grid"></div>
                </section>
              </aside>
            </span>
          </fieldset>
          <fieldset ng-field>
            <label for="date-picker-time-value" class="field-label">Time</label>
            <input
              id="date-picker-time-value"

              type="time"
              step="1"
              ng-model="picker.time" class="input" />
          </fieldset>
        </div>
      </section>
    </main>
  </body>
</html>
