<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="popover-alignments popover-basic popover-form"
  >
    <main class="popover-workflows">
      <section class="popover-workflow-section">
        <header class="workflow-heading"><h2>Basic</h2></header>
        <div class="popover-stage popover-basic-stage">
          <span ng-popover aria-label="Basic popover">
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              Open Popover
            </button>
            <aside align="start" aria-label="Dimensions" class="popover-content">
              <header class="popover-header">
                <h3 class="popover-title">Dimensions</h3>
                <p class="popover-description">Set the dimensions for the layer.</p>
              </header>
            </aside>
          </span>
        </div>
      </section>

      <section class="popover-workflow-section">
        <header class="workflow-heading"><h2>Form</h2></header>
        <div class="popover-stage popover-form-stage">
          <span ng-popover aria-label="Form popover">
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              Edit dimensions
            </button>
            <aside

              class="popover-form-content popover-content"
              align="start"
              aria-label="Edit dimensions"
            >
              <header class="popover-header">
                <h3 class="popover-title">Dimensions</h3>
                <p class="popover-description">Set the dimensions for the layer.</p>
              </header>
              <div class="popover-form-fields">
                <fieldset ng-field orientation="horizontal">
                  <span class="field-label">Width</span>
                  <input value="100%" aria-label="Width" class="input" />
                </fieldset>
                <fieldset ng-field orientation="horizontal">
                  <span class="field-label">Height</span>
                  <input value="25px" aria-label="Height" class="input" />
                </fieldset>
              </div>
            </aside>
          </span>
        </div>
      </section>

      <section class="popover-workflow-section popover-alignment-section">
        <header class="workflow-heading"><h2>Alignment</h2></header>
        <div class="popover-alignment-row">
          <span ng-popover aria-label="Start aligned popover">
            <button

              type="button"
              size="sm"
              variant="outline"

             class="popover-trigger button">
              Start
            </button>
            <aside

              class="popover-compact-content popover-content"
              align="start"
            >
              Aligned to start
            </aside>
          </span>
          <span ng-popover aria-label="Center aligned popover">
            <button

              type="button"
              size="sm"
              variant="outline"

             class="popover-trigger button">
              Center
            </button>
            <aside

              class="popover-compact-content popover-content"
              align="center"
            >
              Aligned to center
            </aside>
          </span>
          <span ng-popover aria-label="End aligned popover">
            <button

              type="button"
              size="sm"
              variant="outline"

             class="popover-trigger button">
              End
            </button>
            <aside

              class="popover-compact-content popover-content"
              align="end"
            >
              Aligned to end
            </aside>
          </span>
        </div>
      </section>

      <section class="popover-workflow-section popover-state-section">
        <header class="workflow-heading"><h2>State</h2></header>
        <div class="popover-state-row">
          <span ng-popover aria-label="Disabled popover">
            <button

              type="button"
              variant="outline"

              disabled
             class="popover-trigger button">
              Disabled
            </button>
            <aside class="popover-content">Unavailable</aside>
          </span>
          <span ng-popover aria-label="First sibling popover">
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              First
            </button>
            <aside

              class="popover-compact-content popover-content"
              aria-label="First panel"
            >
              First panel
            </aside>
          </span>
          <span ng-popover aria-label="Second sibling popover">
            <button

              type="button"
              variant="outline"

             class="popover-trigger button">
              Second
            </button>
            <aside

              class="popover-compact-content popover-content"
              aria-label="Second panel"
            >
              Second panel
            </aside>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
