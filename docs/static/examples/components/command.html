<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="commandState={query:'',selected:''}; suggestions=[{label:'Calendar',icon:'calendar',disabled:false},{label:'Search Emoji',icon:'smile',disabled:false},{label:'Calculator',icon:'calculator',disabled:true}]; settings=[{label:'Profile',shortcut:'⌘P',icon:'user'},{label:'Billing',shortcut:'⌘B',icon:'credit-card'},{label:'Settings',shortcut:'⌘S',icon:'settings'}]"
    data-example="command-demo"
  >
    <main class="command-demo visual-example">
      <section
        id="command-demo"
        ng-command
        data-variant="surface"
        aria-label="Command menu"
      >
        <div class="command-input-wrapper">
          <div class="command-input-group">
            <span aria-hidden="true" class="command-input-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
            </span>
            <input

              aria-label="Search commands"
              placeholder="Type a command or search..."
              ng-model="commandState.query"
             class="command-input"/>
          </div>
        </div>
        <ul class="command-list">
          <p class="command-empty">No results found.</p>
          <section class="command-group">
            <h2 class="command-group-heading">Suggestions</h2>
            <li

              ng-repeat="item in suggestions | filter:commandState.query"
              ng-attr-aria-disabled="{{ item.disabled }}"
              ng-click="commandState.selected=item.label"
             class="command-item">
              <svg

                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
               class="command-item-icon">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M8 12h8"></path>
              </svg>
              <span ng-bind="item.label"></span>
            </li>
          </section>
          <div class="command-separator"></div>
          <section class="command-group">
            <h2 class="command-group-heading">Settings</h2>
            <li

              ng-repeat="item in settings | filter:commandState.query"
              ng-click="commandState.selected=item.label"
             class="command-item">
              <svg

                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
               class="command-item-icon">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
              </svg>
              <span ng-bind="item.label"></span>
              <span ng-bind="item.shortcut" class="command-shortcut"></span>
            </li>
          </section>
        </ul>
      </section>
      <output class="output visually-hidden" aria-live="polite">
        Selected:
        <span ng-bind="commandState.selected || 'None'"></span>
      </output>
    </main>
  </body>
</html>
