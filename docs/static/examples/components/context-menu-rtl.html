<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="lastAction='لا شيء'"
    data-example="context-menu-rtl"
  >
    <main class="context-menu-rtl-demo visual-example">
      <div ng-context-menu>
        <div class="context-menu-trigger">انقر بزر الفأرة الأيمن هنا</div>
        <menu aria-label="إجراءات المتصفح" class="context-menu-content">
          <div class="context-menu-group">
            <button ng-click="lastAction='رجوع'" class="context-menu-item">
              رجوع
              <span class="context-menu-shortcut">Alt+Right</span>
            </button>
            <button disabled class="context-menu-item">
              للأمام
              <span class="context-menu-shortcut">Alt+Left</span>
            </button>
            <button ng-click="lastAction='إعادة تحميل'" class="context-menu-item">
              إعادة تحميل
              <span class="context-menu-shortcut">Ctrl+R</span>
            </button>
          </div>
          <div class="context-menu-separator"></div>
          <div class="context-menu-sub">
            <button class="context-menu-sub-trigger">المزيد من الأدوات</button>
            <div class="context-menu-sub-content">
              <button ng-click="lastAction='حفظ الصفحة'" class="context-menu-item">
                حفظ الصفحة...
              </button>
              <button ng-click="lastAction='أدوات المطور'" class="context-menu-item">
                أدوات المطور
              </button>
            </div>
          </div>
        </menu>
      </div>
      <output class="context-menu-output" aria-live="polite">
        الإجراء الأخير: <span ng-bind="lastAction"></span>
      </output>
    </main>
  </body>
</html>
