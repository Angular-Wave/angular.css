<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="dropdownDemo={archive:false,email:true,sms:false,position:'bottom',disabled:false}"
    data-example="dropdown-menu-avatar dropdown-menu-basic dropdown-menu-checkboxes dropdown-menu-checkboxes-icons dropdown-menu-destructive dropdown-menu-icons dropdown-menu-radio-group dropdown-menu-radio-icons dropdown-menu-rtl dropdown-menu-shortcuts dropdown-menu-submenu"
  >
    <main class="dropdown-workflow-grid">
      <section class="dropdown-workflow" aria-labelledby="dropdown-basic-title">
        <h2 id="dropdown-basic-title">Basic and dynamic items</h2>
        <div class="dropdown-workflow-actions">
          <button
            ng-button
            type="button"
            variant="outline"
            ng-click="dropdownDemo.archive=true"
            ng-disabled="dropdownDemo.archive"
          >
            {{ dropdownDemo.archive ? 'Archive added' : 'Add archive item' }}
          </button>
          <div ng-dropdown aria-label="Account commands">
            <button type="button" data-slot="dropdown-menu-trigger">Open</button>
            <div data-slot="dropdown-menu-content">
              <div data-slot="dropdown-menu-group">
                <div data-slot="dropdown-menu-label">My Account</div>
                <button data-slot="dropdown-menu-item">Profile</button>
                <button data-slot="dropdown-menu-item">Billing</button>
                <button data-slot="dropdown-menu-item">Settings</button>
              </div>
              <div data-slot="dropdown-menu-separator" role="separator"></div>
              <button data-slot="dropdown-menu-item">Support</button>
              <button data-slot="dropdown-menu-item" disabled>API</button>
              <button
                id="dropdown-archive-item"
                data-slot="dropdown-menu-item"
                ng-if="dropdownDemo.archive"
              >
                Archive
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="dropdown-workflow" aria-labelledby="dropdown-avatar-title">
        <h2 id="dropdown-avatar-title">Avatar trigger</h2>
        <div ng-dropdown class="dropdown-avatar-demo">
          <button
            type="button"
            size="icon"
            variant="ghost"
            aria-label="Open account menu"
            data-slot="dropdown-menu-trigger"
          >
            <span ng-avatar>
              <img
                data-slot="avatar-image"
                src="../../images/avatars/01.png"
                alt="Jane Doe"
              />
              <span data-slot="avatar-fallback">JD</span>
            </span>
          </button>
          <div data-slot="dropdown-menu-content" data-align="end">
            <div data-slot="dropdown-menu-group">
              <button data-slot="dropdown-menu-item">Account</button>
              <button data-slot="dropdown-menu-item">Billing</button>
              <button data-slot="dropdown-menu-item">Notifications</button>
            </div>
            <div data-slot="dropdown-menu-separator" role="separator"></div>
            <button data-slot="dropdown-menu-item" data-variant="destructive">
              Sign Out
            </button>
          </div>
        </div>
      </section>

      <section
        class="dropdown-workflow dropdown-workflow-menu-tall"
        aria-labelledby="dropdown-preferences-title"
      >
        <h2 id="dropdown-preferences-title">Preferences</h2>
        <div ng-dropdown>
          <button type="button" data-slot="dropdown-menu-trigger">
            Notifications
          </button>
          <div data-slot="dropdown-menu-content" class="dropdown-menu-wide">
            <div data-slot="dropdown-menu-group">
              <div data-slot="dropdown-menu-label">
                Notification Preferences
              </div>
              <button
                data-slot="dropdown-menu-checkbox-item"
                role="menuitemcheckbox"
                aria-checked="{{ dropdownDemo.email }}"
                ng-click="dropdownDemo.email=!dropdownDemo.email"
              >
                <span data-slot="dropdown-menu-checkbox-item-indicator">
                  <svg
                    ng-if="dropdownDemo.email"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <path d="m3 8 3 3 7-7"></path>
                  </svg>
                </span>
                Email notifications
              </button>
              <button
                data-slot="dropdown-menu-checkbox-item"
                role="menuitemcheckbox"
                aria-checked="{{ dropdownDemo.sms }}"
                ng-click="dropdownDemo.sms=!dropdownDemo.sms"
              >
                <span data-slot="dropdown-menu-checkbox-item-indicator">
                  <svg
                    ng-if="dropdownDemo.sms"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <path d="m3 8 3 3 7-7"></path>
                  </svg>
                </span>
                SMS notifications
              </button>
            </div>
            <div data-slot="dropdown-menu-separator" role="separator"></div>
            <div
              data-slot="dropdown-menu-radio-group"
              role="group"
              aria-label="Menu position"
            >
              <div data-slot="dropdown-menu-label">Position</div>
              <button
                data-slot="dropdown-menu-radio-item"
                role="menuitemradio"
                aria-checked="{{ dropdownDemo.position === 'top' }}"
                ng-click="dropdownDemo.position='top'"
              >
                <span data-slot="dropdown-menu-radio-item-indicator">
                  <svg
                    ng-if="dropdownDemo.position === 'top'"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <circle cx="8" cy="8" r="3"></circle>
                  </svg>
                </span>
                Top
              </button>
              <button
                data-slot="dropdown-menu-radio-item"
                role="menuitemradio"
                aria-checked="{{ dropdownDemo.position === 'bottom' }}"
                ng-click="dropdownDemo.position='bottom'"
              >
                <span data-slot="dropdown-menu-radio-item-indicator">
                  <svg
                    ng-if="dropdownDemo.position === 'bottom'"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <circle cx="8" cy="8" r="3"></circle>
                  </svg>
                </span>
                Bottom
              </button>
            </div>
          </div>
        </div>
      </section>

      <section
        class="dropdown-workflow dropdown-workflow-menu-tall"
        aria-labelledby="dropdown-actions-title"
      >
        <h2 id="dropdown-actions-title">Actions and submenu</h2>
        <div ng-dropdown>
          <button type="button" data-slot="dropdown-menu-trigger">Actions</button>
          <div data-slot="dropdown-menu-content" class="dropdown-menu-wide">
            <div data-slot="dropdown-menu-group">
              <button data-slot="dropdown-menu-item">
                Edit
                <span data-slot="dropdown-menu-shortcut">Ctrl+E</span>
              </button>
              <button data-slot="dropdown-menu-item">
                Share
                <span data-slot="dropdown-menu-shortcut">Ctrl+S</span>
              </button>
              <div data-slot="dropdown-menu-sub">
                <button data-slot="dropdown-menu-sub-trigger">
                  Invite users
                </button>
                <div data-slot="dropdown-menu-sub-content">
                  <button data-slot="dropdown-menu-item">Email</button>
                  <button data-slot="dropdown-menu-item">Message</button>
                  <div
                    data-slot="dropdown-menu-separator"
                    role="separator"
                  ></div>
                  <button data-slot="dropdown-menu-item">More options</button>
                </div>
              </div>
            </div>
            <div data-slot="dropdown-menu-separator" role="separator"></div>
            <button data-slot="dropdown-menu-item" data-variant="destructive">
              Delete
            </button>
          </div>
        </div>
      </section>

      <section
        class="dropdown-workflow dropdown-workflow-wide dropdown-workflow-rtl"
        dir="rtl"
        lang="ar"
        aria-labelledby="dropdown-rtl-title"
      >
        <div class="dropdown-workflow-heading">
          <h2 id="dropdown-rtl-title">اتجاه من اليمين إلى اليسار</h2>
          <label ng-label>
            <input
              ng-checkbox
              type="checkbox"
              ng-model="dropdownDemo.disabled"
            />
            تعطيل القائمة
          </label>
        </div>
        <div ng-dropdown aria-label="Arabic account menu">
          <button
            type="button"
            data-slot="dropdown-menu-trigger"
            ng-disabled="dropdownDemo.disabled"
          >
            افتح القائمة
          </button>
          <div data-slot="dropdown-menu-content">
            <div data-slot="dropdown-menu-label">الحساب</div>
            <button data-slot="dropdown-menu-item">الملف الشخصي</button>
            <button data-slot="dropdown-menu-item">الإعدادات</button>
            <div data-slot="dropdown-menu-separator" role="separator"></div>
            <button data-slot="dropdown-menu-item" data-variant="destructive">
              تسجيل الخروج
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
