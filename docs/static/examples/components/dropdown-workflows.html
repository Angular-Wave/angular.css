<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="dropdownDemo={archive:false,email:true,sms:false,position:'bottom',disabled:false}"
    data-example="dropdown-menu-avatar dropdown-menu-basic dropdown-menu-checkboxes dropdown-menu-checkboxes-icons dropdown-menu-destructive dropdown-menu-icons dropdown-menu-radio-group dropdown-menu-radio-icons dropdown-menu-rtl dropdown-menu-shortcuts dropdown-menu-submenu"
  >
    <main class="dropdown-workflow-grid">
      <section class="dropdown-workflow" aria-labelledby="dropdown-basic-title">
        <h2 id="dropdown-basic-title">Basic and dynamic items</h2>
        <div class="dropdown-workflow-actions">
          <button

            type="button"
            variant="outline"
            ng-click="dropdownDemo.archive=true"
            ng-disabled="dropdownDemo.archive" class="button">
            {{ dropdownDemo.archive ? 'Archive added' : 'Add archive item' }}
          </button>
          <div ng-dropdown aria-label="Account commands">
            <button type="button" class="dropdown-menu-trigger">
              Open
            </button>
            <menu class="dropdown-menu-content">
              <div class="dropdown-menu-group">
                <div class="dropdown-menu-label">My Account</div>
                <button class="dropdown-menu-item">Profile</button>
                <button class="dropdown-menu-item">Billing</button>
                <button class="dropdown-menu-item">Settings</button>
              </div>
              <hr class="dropdown-menu-separator" />
              <button class="dropdown-menu-item">Support</button>
              <button disabled class="dropdown-menu-item">API</button>
              <button
                id="dropdown-archive-item"

                ng-if="dropdownDemo.archive"
               class="dropdown-menu-item">
                Archive
              </button>
            </menu>
          </div>
        </div>
      </section>

      <section
        class="dropdown-workflow"
        aria-labelledby="dropdown-avatar-title"
      >
        <h2 id="dropdown-avatar-title">Avatar trigger</h2>
        <div ng-dropdown class="dropdown-avatar-demo">
          <button
            type="button"
            size="icon"
            variant="ghost"
            aria-label="Open account menu"

           class="dropdown-menu-trigger">
            <span class="avatar">
              <img

                src="../../images/avatars/01.png"
                alt="Jane Doe"
               class="avatar-image" />
              <span class="avatar-fallback">JD</span>
            </span>
          </button>
          <menu data-align="end" class="dropdown-menu-content">
            <div class="dropdown-menu-group">
              <button class="dropdown-menu-item">Account</button>
              <button class="dropdown-menu-item">Billing</button>
              <button class="dropdown-menu-item">Notifications</button>
            </div>
            <hr class="dropdown-menu-separator" />
            <button data-variant="destructive" class="dropdown-menu-item">
              Sign Out
            </button>
          </menu>
        </div>
      </section>

      <section
        class="dropdown-workflow dropdown-workflow-menu-tall"
        aria-labelledby="dropdown-preferences-title"
      >
        <h2 id="dropdown-preferences-title">Preferences</h2>
        <div ng-dropdown>
          <button type="button" class="dropdown-menu-trigger">
            Notifications
          </button>
          <menu class="dropdown-menu-wide dropdown-menu-content">
            <div class="dropdown-menu-group">
              <div class="dropdown-menu-label">
                Notification Preferences
              </div>
              <button


                aria-checked="{{ dropdownDemo.email }}"
                ng-click="dropdownDemo.email=!dropdownDemo.email"
               class="dropdown-menu-checkbox-item">
                <span class="dropdown-menu-checkbox-item-indicator">
                  <svg
                    ng-if="dropdownDemo.email"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <path d="m3 8 3 3 7-7"></path>
                  </svg>
                </span>
                Email notifications
              </button>
              <button


                aria-checked="{{ dropdownDemo.sms }}"
                ng-click="dropdownDemo.sms=!dropdownDemo.sms"
               class="dropdown-menu-checkbox-item">
                <span class="dropdown-menu-checkbox-item-indicator">
                  <svg
                    ng-if="dropdownDemo.sms"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <path d="m3 8 3 3 7-7"></path>
                  </svg>
                </span>
                SMS notifications
              </button>
            </div>
            <hr class="dropdown-menu-separator" />
            <fieldset


              aria-label="Menu position"
             class="dropdown-menu-radio-group">
              <div class="dropdown-menu-label">Position</div>
              <button


                aria-checked="{{ dropdownDemo.position === 'top' }}"
                ng-click="dropdownDemo.position='top'"
               class="dropdown-menu-radio-item">
                <span class="dropdown-menu-radio-item-indicator">
                  <svg
                    ng-if="dropdownDemo.position === 'top'"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <circle cx="8" cy="8" r="3"></circle>
                  </svg>
                </span>
                Top
              </button>
              <button


                aria-checked="{{ dropdownDemo.position === 'bottom' }}"
                ng-click="dropdownDemo.position='bottom'"
               class="dropdown-menu-radio-item">
                <span class="dropdown-menu-radio-item-indicator">
                  <svg
                    ng-if="dropdownDemo.position === 'bottom'"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <circle cx="8" cy="8" r="3"></circle>
                  </svg>
                </span>
                Bottom
              </button>
            </fieldset>
          </menu>
        </div>
      </section>

      <section
        class="dropdown-workflow dropdown-workflow-menu-tall"
        aria-labelledby="dropdown-actions-title"
      >
        <h2 id="dropdown-actions-title">Actions and submenu</h2>
        <div ng-dropdown>
          <button type="button" class="dropdown-menu-trigger">
            Actions
          </button>
          <menu class="dropdown-menu-wide dropdown-menu-content">
            <div class="dropdown-menu-group">
              <button class="dropdown-menu-item">
                Edit
                <span class="dropdown-menu-shortcut">Ctrl+E</span>
              </button>
              <button class="dropdown-menu-item">
                Share
                <span class="dropdown-menu-shortcut">Ctrl+S</span>
              </button>
              <div class="dropdown-menu-sub">
                <button class="dropdown-menu-sub-trigger">
                  Invite users
                </button>
                <div class="dropdown-menu-sub-content">
                  <button class="dropdown-menu-item">Email</button>
                  <button class="dropdown-menu-item">Message</button>
                  <hr


                   class="dropdown-menu-separator" />
                  <button class="dropdown-menu-item">More options</button>
                </div>
              </div>
            </div>
            <hr class="dropdown-menu-separator" />
            <button data-variant="destructive" class="dropdown-menu-item">
              Delete
            </button>
          </menu>
        </div>
      </section>

      <section
        class="dropdown-workflow dropdown-workflow-wide dropdown-workflow-rtl"
        dir="rtl"
        lang="ar"
        aria-labelledby="dropdown-rtl-title"
      >
        <div class="dropdown-workflow-heading">
          <h2 id="dropdown-rtl-title">اتجاه من اليمين إلى اليسار</h2>
          <label class="label">
            <input

              type="checkbox"
              ng-model="dropdownDemo.disabled" class="checkbox" />
            تعطيل القائمة
          </label>
        </div>
        <div ng-dropdown aria-label="Arabic account menu">
          <button
            type="button"

            ng-disabled="dropdownDemo.disabled"
           class="dropdown-menu-trigger">
            افتح القائمة
          </button>
          <menu class="dropdown-menu-content">
            <div class="dropdown-menu-label">الحساب</div>
            <button class="dropdown-menu-item">الملف الشخصي</button>
            <button class="dropdown-menu-item">الإعدادات</button>
            <hr class="dropdown-menu-separator" />
            <button data-variant="destructive" class="dropdown-menu-item">
              تسجيل الخروج
            </button>
          </menu>
        </div>
      </section>
    </main>
  </body>
</html>
