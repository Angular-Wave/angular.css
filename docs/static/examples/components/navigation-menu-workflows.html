<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="navigationWorkflow={controlled:false,showMenu:false,showLink:false}"
  >
    <main class="navigation-menu-workflows">
      <section class="navigation-menu-workflow-section">
        <header class="workflow-heading">
          <h2>Controlled and disabled</h2>
        </header>
        <div class="navigation-menu-workflow-actions">
          <button

            type="button"
            variant="outline"
            ng-click="navigationWorkflow.controlled=!navigationWorkflow.controlled" class="button">
            Toggle controlled panel
          </button>
        </div>
        <nav ng-navigation-menu aria-label="Controlled navigation">
          <ul class="navigation-menu-list">
            <li class="navigation-menu-item">
              <button type="button" class="navigation-menu-trigger">
                Resources
              </button>
              <section
                ng-if="!navigationWorkflow.controlled"

               class="navigation-menu-content">
                <ul
                  class="navigation-menu-content-list navigation-menu-intro-list"
                >
                  <li><a href="#guides" class="navigation-menu-link">Guides</a></li>
                  <li>
                    <a href="#api" class="navigation-menu-link">API reference</a>
                  </li>
                </ul>
              </section>
              <section
                ng-if="navigationWorkflow.controlled"

                data-open="true"
               class="navigation-menu-content">
                <ul
                  class="navigation-menu-content-list navigation-menu-intro-list"
                >
                  <li><a href="#guides" class="navigation-menu-link">Guides</a></li>
                  <li>
                    <a href="#api" class="navigation-menu-link">API reference</a>
                  </li>
                </ul>
              </section>
              <span aria-hidden="true" class="navigation-menu-indicator"></span>
            </li>
            <li class="navigation-menu-item">
              <button type="button" disabled class="navigation-menu-trigger">
                Disabled
              </button>
              <section class="navigation-menu-content">
                <a href="#unavailable" class="navigation-menu-link">Unavailable</a>
              </section>
            </li>
            <li class="navigation-menu-item">
              <a href="#pricing" class="navigation-menu-link">Pricing</a>
            </li>
          </ul>
        </nav>
      </section>

      <section class="navigation-menu-workflow-section">
        <header class="workflow-heading">
          <h2>Dynamic AngularTS content</h2>
        </header>
        <div class="navigation-menu-workflow-actions">
          <button

            type="button"
            variant="outline"
            ng-click="navigationWorkflow.showMenu=true" class="button">
            Add company menu
          </button>
          <button

            type="button"
            variant="outline"
            ng-click="navigationWorkflow.showLink=true" class="button">
            Add careers link
          </button>
        </div>
        <nav ng-navigation-menu aria-label="Dynamic navigation">
          <ul class="navigation-menu-list">
            <li class="navigation-menu-item">
              <button type="button" class="navigation-menu-trigger">Product</button>
              <section class="navigation-menu-content">
                <ul
                  class="navigation-menu-content-list navigation-menu-intro-list"
                >
                  <li>
                    <a href="#overview" class="navigation-menu-link">Overview</a>
                  </li>
                  <li ng-if="navigationWorkflow.showLink">
                    <a

                      id="dynamic-careers-link"
                      href="#careers"
                     class="navigation-menu-link">
                      Careers
                    </a>
                  </li>
                </ul>
              </section>
              <span aria-hidden="true" class="navigation-menu-indicator"></span>
            </li>
            <li
              ng-if="navigationWorkflow.showMenu"

              id="dynamic-company-menu"
             class="navigation-menu-item">
              <button type="button" class="navigation-menu-trigger">Company</button>
              <section class="navigation-menu-content">
                <ul
                  class="navigation-menu-content-list navigation-menu-intro-list"
                >
                  <li><a href="#about" class="navigation-menu-link">About</a></li>
                  <li>
                    <a href="#contact" class="navigation-menu-link">Contact</a>
                  </li>
                </ul>
              </section>
              <span aria-hidden="true" class="navigation-menu-indicator"></span>
            </li>
            <li class="navigation-menu-item">
              <a href="#support" class="navigation-menu-link">Support</a>
            </li>
          </ul>
        </nav>
      </section>

      <button type="button" variant="outline" class="button">
        Outside focus target
      </button>
    </main>
  </body>
</html>
