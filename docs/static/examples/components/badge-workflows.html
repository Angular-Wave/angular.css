<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    data-example="badge-colors badge-icon badge-link badge-rtl badge-spinner badge-variants"
  >
    <main class="workflow-stack">
      <div class="workflow-row" aria-label="Badge variants">
        <span ng-badge>Default</span>
        <span ng-badge variant="secondary">Secondary</span>
        <span ng-badge variant="destructive">Destructive</span>
        <span ng-badge variant="outline">Outline</span>
        <span ng-badge variant="ghost">Ghost</span>
      </div>

      <div class="workflow-row" aria-label="Badge custom colors">
        <span ng-badge class="badge-color-blue">Blue</span>
        <span ng-badge class="badge-color-green">Green</span>
        <span ng-badge class="badge-color-sky">Sky</span>
        <span ng-badge class="badge-color-purple">Purple</span>
        <span ng-badge class="badge-color-red">Red</span>
      </div>

      <div class="workflow-row" aria-label="Badges with icons">
        <span ng-badge variant="secondary">
          <svg
            data-icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m9 12 2 2 4-4M12 3l2.2 1.5 2.7-.1.8 2.6 2.2 1.5-.9 2.5.9 2.5-2.2 1.5-.8 2.6-2.7-.1L12 21l-2.2-1.5-2.7.1-.8-2.6L4.1 15l.9-2.5-.9-2.5L6.3 7l.8-2.6 2.7.1L12 3Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Verified
        </span>
        <span ng-badge variant="outline">
          Bookmark
          <svg
            data-icon="inline-end"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4V4Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <a ng-badge href="#link">
          Open Link
          <svg
            data-icon="inline-end"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M7 17 17 7M7 7h10v10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>

      <div class="workflow-row" aria-label="Badges with loading status">
        <span ng-badge variant="destructive">
          <svg
            ng-spinner
            data-icon="inline-start"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          Deleting
        </span>
        <span ng-badge variant="secondary">
          Generating
          <svg
            ng-spinner
            data-icon="inline-end"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </div>

      <div class="workflow-row" dir="rtl" aria-label="RTL badges">
        <span ng-badge>شارة</span>
        <span ng-badge variant="secondary">ثانوي</span>
        <span ng-badge variant="destructive">مدمر</span>
        <span ng-badge variant="outline">مخطط</span>
      </div>
    </main>
  </body>
</html>
