<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="toolbar-demo">
    <menu ng-toolbar class="visual-example" aria-label="Document actions">
      <button class="button" size="icon-sm" variant="ghost" aria-label="Undo">
        ↶
      </button>
      <button
        class="button"
        size="icon-sm"
        variant="ghost"
        aria-label="Redo"
        disabled
      >
        ↷
      </button>
      <hr />
      <button class="button" size="sm" variant="ghost">Copy</button>
      <button class="button" size="sm" variant="ghost">Archive</button>
      <button class="button" size="sm" variant="ghost">Export</button>
    </menu>
  </body>
</html>
