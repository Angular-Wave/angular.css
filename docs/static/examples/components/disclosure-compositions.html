<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Disclosure Compositions</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    class="disclosure-composition-body"
    data-example="disclosure-file-tree"
  >
    <main aria-label="Disclosure file tree composition">
      <div size="sm" class="disclosure-file-card visual-example card">
        <header>
          <section ng-tabs>
            <menu aria-label="File views">
              <button aria-selected="true">Explorer</button>
              <button>Outline</button>
            </menu>
            <section class="visually-hidden">Explorer file tree</section>
            <section class="visually-hidden">No outline available</section>
          </section>
        </header>
        <section>
          <div class="disclosure-file-tree">
            <details class="disclosure">
              <summary>
                <svg
                  class="tree-chevron"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                >
                  <path d="m9 18 6-6-6-6" /></svg
                ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M4 19V5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
                  /></svg
                ><span>components</span>
              </summary>
              <div>
                <details class="disclosure">
                  <summary>
                    <svg
                      class="tree-chevron"
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path d="m9 18 6-6-6-6" /></svg
                    ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path
                        d="M4 19V5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
                      /></svg
                    ><span>ui</span>
                  </summary>
                  <div>
                    <button variant="link" size="sm" class="button">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                        />
                        <path d="M14 2v6h6" /></svg
                      >button.tsx
                    </button>
                    <button variant="link" size="sm" class="button">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                        />
                        <path d="M14 2v6h6" /></svg
                      >card.tsx
                    </button>
                    <button variant="link" size="sm" class="button">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                        />
                        <path d="M14 2v6h6" /></svg
                      >dialog.tsx
                    </button>
                    <button variant="link" size="sm" class="button">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                        />
                        <path d="M14 2v6h6" /></svg
                      >input.tsx
                    </button>
                    <button variant="link" size="sm" class="button">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                        />
                        <path d="M14 2v6h6" /></svg
                      >select.tsx
                    </button>
                    <button variant="link" size="sm" class="button">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                        />
                        <path d="M14 2v6h6" /></svg
                      >table.tsx
                    </button>
                  </div>
                </details>
                <button variant="link" size="sm" class="button">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                    />
                    <path d="M14 2v6h6" /></svg
                  >login-form.tsx
                </button>
                <button variant="link" size="sm" class="button">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"
                    />
                    <path d="M14 2v6h6" /></svg
                  >register-form.tsx
                </button>
              </div>
            </details>
            <details class="disclosure">
              <summary>
                <svg
                  class="tree-chevron"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                >
                  <path d="m9 18 6-6-6-6" /></svg
                ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M4 19V5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
                  /></svg
                ><span>lib</span>
              </summary>
              <div>
                <button variant="link" size="sm" class="button">utils.ts</button
                ><button variant="link" size="sm" class="button">cn.ts</button
                ><button variant="link" size="sm" class="button">api.ts</button>
              </div>
            </details>
            <details class="disclosure">
              <summary>
                <svg
                  class="tree-chevron"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                >
                  <path d="m9 18 6-6-6-6" /></svg
                ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M4 19V5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
                  /></svg
                ><span>hooks</span>
              </summary>
              <div>
                <button variant="link" size="sm" class="button">
                  use-media-query.ts</button
                ><button variant="link" size="sm" class="button">
                  use-debounce.ts</button
                ><button variant="link" size="sm" class="button">
                  use-local-storage.ts
                </button>
              </div>
            </details>
            <details class="disclosure">
              <summary>
                <svg
                  class="tree-chevron"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                >
                  <path d="m9 18 6-6-6-6" /></svg
                ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M4 19V5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
                  /></svg
                ><span>types</span>
              </summary>
              <div>
                <button variant="link" size="sm" class="button">
                  index.d.ts</button
                ><button variant="link" size="sm" class="button">
                  api.d.ts
                </button>
              </div>
            </details>
            <details class="disclosure">
              <summary>
                <svg
                  class="tree-chevron"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                >
                  <path d="m9 18 6-6-6-6" /></svg
                ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M4 19V5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
                  /></svg
                ><span>public</span>
              </summary>
              <div>
                <button variant="link" size="sm" class="button">
                  favicon.ico</button
                ><button variant="link" size="sm" class="button">
                  logo.svg</button
                ><button variant="link" size="sm" class="button">images</button>
              </div>
            </details>
            <button variant="link" size="sm" class="button">app.tsx</button>
            <button variant="link" size="sm" class="button">layout.tsx</button>
            <button variant="link" size="sm" class="button">globals.css</button>
            <button variant="link" size="sm" class="button">
              package.json
            </button>
            <button variant="link" size="sm" class="button">
              tsconfig.json
            </button>
            <button variant="link" size="sm" class="button">README.md</button>
            <button variant="link" size="sm" class="button">.gitignore</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
