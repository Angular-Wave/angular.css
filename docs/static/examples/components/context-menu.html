<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="ui"
    ng-cloak
    ng-init="lastAction='None'"
    data-example="context-menu-basic context-menu-demo context-menu-submenu"
  >
    <main class="context-menu-demo visual-example">
      <div id="context-menu-demo" ng-context-menu>
        <div class="context-menu-trigger">Right click here</div>
        <menu aria-label="Browser actions" class="context-menu-content">
          <div class="context-menu-group">
            <button ng-click="lastAction='Back'" class="context-menu-item">
              Back
              <span class="context-menu-shortcut">Alt+Left</span>
            </button>
            <button disabled class="context-menu-item">
              Forward
              <span class="context-menu-shortcut">Alt+Right</span>
            </button>
            <button ng-click="lastAction='Reload'" class="context-menu-item">
              Reload
              <span class="context-menu-shortcut">Ctrl+R</span>
            </button>
          </div>
          <div class="context-menu-separator"></div>
          <div class="context-menu-group">
            <button ng-click="lastAction='Save'" class="context-menu-item">
              Save
              <span class="context-menu-shortcut">Ctrl+S</span>
            </button>
          </div>
          <div class="context-menu-sub">
            <button class="context-menu-sub-trigger">More Tools</button>
            <div class="context-menu-sub-content">
              <div class="context-menu-group">
                <button ng-click="lastAction='Save Page'" class="context-menu-item">
                  Save Page...
                </button>
                <button

                  ng-click="lastAction='Create Shortcut'"
                 class="context-menu-item">
                  Create Shortcut...
                </button>
                <button

                  ng-click="lastAction='Name Window'"
                 class="context-menu-item">
                  Name Window...
                </button>
              </div>
              <div class="context-menu-separator"></div>
              <button

                ng-click="lastAction='Developer Tools'"
               class="context-menu-item">
                Developer Tools
              </button>
            </div>
          </div>
          <div class="context-menu-separator"></div>
          <button

            data-variant="destructive"
            ng-click="lastAction='Delete'"
           class="context-menu-item">
            Delete
          </button>
        </menu>
      </div>
      <output class="context-menu-output" aria-live="polite">
        Last action: <span ng-bind="lastAction"></span>
      </output>
    </main>
  </body>
</html>
