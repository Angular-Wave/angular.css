<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="ui" ng-cloak ng-init="alignment='center'">
    <div class="stack-sm">
      <fieldset class="toggle-group visual-example" variant="outline">
        <legend class="visually-hidden">Text alignment</legend>
        <label class="toggle-group-item">
          <input
            type="radio"
            name="alignment"
            value="left"
            ng-model="alignment"
          />
          Left
        </label>
        <label class="toggle-group-item">
          <input
            type="radio"
            name="alignment"
            value="center"
            ng-model="alignment"
          />
          Center
        </label>
        <label class="toggle-group-item">
          <input
            type="radio"
            name="alignment"
            value="right"
            ng-model="alignment"
          />
          Right
        </label>
      </fieldset>
      <div class="output">Alignment: <span ng-bind="alignment"></span></div>
    </div>
  </body>
</html>
