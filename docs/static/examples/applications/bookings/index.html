<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Bookings</title>
    <link
      rel="stylesheet"
      href="../../../css/tailwind-preflight.css" />
    <link rel="stylesheet" href="../../../css/angular.css" />
    <link rel="stylesheet" href="./bookings.css" />
    <script src="../../../js/angular-ts.umd.js"></script>
    <script src="../../../js/angular-css.umd.js"></script>
    <script src="./bookings.js"></script>
  </head>
  <body
    ng-app="bookingsDemo"
    ng-controller="BookingsController as bookings"
    ng-cloak
  >
    <div class="booking-shell" data-testid="booking-shell">
      <nav class="booking-rail" aria-label="Application navigation">
        <a class="booking-brand" href="./" aria-label="OrbitPass home">O</a>
        <div class="booking-rail-primary">
          <a href="#search" aria-label="Search"
            ><span ng-icon="search"></span></a>
          <a class="is-active" href="#bookings" aria-label="Bookings">
            <span ng-icon="bookings"></span><small>Bookings</small>
          </a>
          <a href="#support" aria-label="Support">
            <span ng-icon="support"></span><small>Support</small>
          </a>
          <a href="#admin" aria-label="Admin">
            <span ng-icon="settings"></span><small>Admin</small>
          </a>
        </div>
        <div class="booking-rail-footer">
          <button type="button" aria-label="Notifications">
            <span ng-icon="bell"></span><span class="notification-dot"></span>
          </button>
          <span ng-avatar data-size="sm">
            <span class="avatar-fallback">EE</span>
            <span aria-label="Online" class="avatar-badge"></span>
          </span>
        </div>
      </nav>

      <aside
        id="booking-sidebar"
        class="booking-secondary"
        ng-sidebar
        data-state="expanded"
        style="--sidebar-width: 14rem"
      >
        <div class="sidebar-inner">
          <header class="booking-sidebar-header sidebar-header">
            <strong>Bookings</strong>
            <button

              size="icon-sm"
              variant="ghost"
              aria-label="Add booking" class="button">
              <span ng-icon="plus"></span>
            </button>
          </header>
          <hr class="sidebar-separator" />
          <nav class="sidebar-content">
            <section class="sidebar-group">
              <div class="sidebar-group-content">
                <ul class="sidebar-menu">
                  <li class="sidebar-menu-item">
                    <button data-active="true" class="sidebar-menu-button">
                      <span ng-icon="bookings"></span><span>Upcoming</span>
                    </button>
                    <span class="sidebar-menu-badge">40</span>
                  </li>
                  <li class="sidebar-menu-item">
                    <button class="sidebar-menu-button">
                      <span ng-icon="clock"></span><span>Past</span>
                    </button>
                    <span class="sidebar-menu-badge">0</span>
                  </li>
                  <li class="sidebar-menu-item">
                    <button class="sidebar-menu-button">
                      <span ng-icon="customers"></span><span>Customers</span>
                    </button>
                    <span class="sidebar-menu-badge">21</span>
                  </li>
                  <li class="sidebar-menu-item">
                    <button class="sidebar-menu-button">
                      <span ng-icon="invoices"></span><span>Invoices</span>
                    </button>
                    <span class="sidebar-menu-badge">0</span>
                  </li>
                </ul>
              </div>
            </section>
          </nav>
          <footer class="booking-sidebar-footer sidebar-footer">
            <span class="muted">Signed in as</span>
            <strong>Emma Executive</strong>
          </footer>
        </div>
      </aside>

      <main class="booking-main" id="bookings">
        <header class="booking-toolbar">
          <div class="booking-title-row">
            <button
              class="booking-mobile-menu button"

              size="icon-sm"
              variant="outline"
              data-sidebar-target="booking-sidebar"
              aria-label="Toggle booking navigation"
            >
              <span ng-icon="menu"></span>
            </button>
            <div>
              <span class="booking-eyebrow">Bookings</span>
              <h1>Upcoming</h1>
            </div>
          </div>
          <div ng-input-group class="booking-search input-group">
            <span ng-icon="search" class="input-group-addon"></span>
            <input


              ng-model="bookings.query"
              data-change="bookings.updateVisible()"
              type="search"
              aria-label="Search bookings"
              placeholder="Search bookings"
             class="input-group-control input" />
            <span data-align="inline-end" class="input-group-addon">
              <kbd>/</kbd>
            </span>
          </div>
        </header>

        <div class="booking-filterbar">
          <section ng-tabs>
            <div

              variant="line"
              aria-label="Booking status"
             class="tabs-list">
              <button

                ng-click="bookings.setStatus('All')"
               class="tabs-trigger">
                All
              </button>
              <button

                ng-click="bookings.setStatus('Confirmed')"
               class="tabs-trigger">
                Confirmed
              </button>
              <button

                ng-click="bookings.setStatus('Pending')"
               class="tabs-trigger">
                Pending
              </button>
              <button

                ng-click="bookings.setStatus('Change Requested')"
               class="tabs-trigger">
                Change requested
              </button>
            </div>
            <div class="tabs-content"></div>
            <div hidden class="tabs-content"></div>
            <div hidden class="tabs-content"></div>
            <div hidden class="tabs-content"></div>
          </section>
          <span class="booking-result-count">
            <strong ng-bind="bookings.visibleCount"></strong> results
          </span>
        </div>

        <section ng-scroll-area class="booking-scroll">
          <div class="scroll-area-viewport">
            <div class="booking-list" aria-live="polite">
              <article
                class="booking-row"
                ng-repeat="booking in bookings.bookings"
                ng-show="booking.visible"
              >
                <button
                  class="booking-row-trigger"
                  type="button"
                  aria-controls="booking-detail-dialog"
                  ng-click="bookings.select(booking)"
                >
                  <span class="booking-summary">
                    <span
                      class="booking-reference"
                      ng-bind="booking.reference"
                    ></span>
                    <span
                      ><span ng-icon="ticket"></span><span ng-bind="booking.service"></span></span>
                    <span
                      ><span ng-icon="rocket"></span><span ng-bind="booking.vessel"></span></span>
                    <span

                      variant="secondary"
                      ng-class="bookings.statusClass(booking.status)"
                      ng-bind="booking.status" class="badge"></span>
                  </span>

                  <span class="booking-route">
                    <span class="booking-place">
                      <strong ng-bind="booking.origin"></strong>
                      <span ng-bind="booking.departure"></span>
                    </span>
                    <span class="booking-journey" aria-hidden="true">
                      <span class="booking-route-line"></span>
                      <span ng-icon="plane"></span>
                      <small ng-bind="booking.duration"></small>
                    </span>
                    <span class="booking-place booking-destination">
                      <strong ng-bind="booking.destination"></strong>
                      <span ng-bind="booking.arrival"></span>
                    </span>
                  </span>

                  <span class="booking-meta">
                    <span
                      ><span ng-icon="customer"></span><span ng-bind="booking.customer"></span></span>
                    <span
                      ><span ng-icon="ticket"></span><span ng-bind="booking.customerId"></span></span>
                    <span
                      ><span ng-icon="home"></span><span ng-bind="booking.cabin"></span></span>
                    <span
                      ><span ng-icon="luggage"></span><span ng-bind="booking.luggage"></span></span>
                    <span
                      ><span ng-icon="luggage"></span><span ng-bind="booking.allowance"></span></span>
                  </span>
                </button>
              </article>

              <section ng-show="bookings.empty" class="booking-empty empty">
                <div class="empty-media">
                  <span ng-icon="search"></span>
                </div>
                <h2 class="empty-title">No bookings found</h2>
                <p class="empty-description">
                  Try a different search or status.
                </p>
              </section>
            </div>
          </div>
          <div data-orientation="vertical" class="scroll-area-scrollbar">
            <div class="scroll-area-thumb"></div>
          </div>
        </section>
      </main>
    </div>

    <section
      id="booking-detail-dialog"
      class="booking-dialog"
      ng-dialog
      data-open="false"
    >
      <div class="dialog-overlay"></div>
      <dialog


        aria-modal="true"
        aria-labelledby="booking-dialog-title"
       class="dialog-content">
        <header class="dialog-header">
          <span
            class="booking-dialog-reference"
            ng-bind="bookings.selected.reference"
          ></span>
          <h2 id="booking-dialog-title" class="dialog-title">
            Booking details
          </h2>
          <p class="dialog-description">
            <span ng-bind="bookings.selected.customer"></span> traveling from
            <span ng-bind="bookings.selected.origin"></span> to
            <span ng-bind="bookings.selected.destination"></span>.
          </p>
        </header>
        <dl class="booking-detail-grid">
          <div>
            <dt>Service</dt>
            <dd ng-bind="bookings.selected.service"></dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd ng-bind="bookings.selected.status"></dd>
          </div>
          <div>
            <dt>Departure</dt>
            <dd ng-bind="bookings.selected.departure"></dd>
          </div>
          <div>
            <dt>Arrival</dt>
            <dd ng-bind="bookings.selected.arrival"></dd>
          </div>
          <div class="booking-detail-wide">
            <dt>Cabin</dt>
            <dd ng-bind="bookings.selected.cabin"></dd>
          </div>
        </dl>
        <footer class="dialog-footer">
          <button variant="outline" data-dialog-close class="button">Close</button>
          <button class="button">Open booking</button>
        </footer>
      </dialog>
    </section>
  </body>
</html>
